}
// ホストの開始画面：Player の席に、つながっている人の名前を入れる
const renderSetupModalSolo = renderSetupModal;
renderSetupModal = function(){
  renderSetupModalSolo();
  if(NET.on) netDecorateSetup();
};
function netDecorateSetup(){
  const rows = [...$('optSlots').children];
  const others = NET.members.filter(m => m.token !== NET.token && m.online);
  let k = 0;
  rows.forEach((row, i) => {
    const inp = row.querySelector('.slot-head input');
    if(!inp) return;
    if(i === 0){
      if(NET.name) inp.value = CFG.slots[0].name = NET.name;
      inp.oninput = () => { netSetName(inp.value); };
      return;
    }
    // AI（Gemini）は選べない
    row.querySelectorAll('.seg button').forEach(b => { if(b.textContent === 'AI') b.disabled = true; });
    if(i >= CFG.count || CFG.slots[i].type !== 'human') return;
    const m = others[k++];
    inp.value = m ? m.name : '';
    inp.placeholder = '参加待ち';
    inp.disabled = true;
  });
}

/* --- つなぐ ---
   つなぎ方は2通り。どちらも「順番を決める係（ハブ）」に操作を送り、ハブが番号を振って全員に配る。
   ・LAN：ネット対戦/server.js がハブ。このページはそのサーバーから開いたときだけこの方式になる
   ・インターネット：ホストのページ自身がハブ（netHubCreate）。端末どうしは PeerJS（WebRTC）で直接つなぐ。
     部屋番号から PeerJS の宛先を作り、合言葉はハブが確かめる */
const NET_PAGES_URL = 'https://mmluy11714-glitch.github.io/gunto/';          // 公開したページのURL（file:// で開いたホストが招待のURLを作るのに使う）
const NET_PEER_PREFIX = 'gunto-kaitakusha-v1-';
const NET_ROOM_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';   // 見間違えやすい 0/O・1/I/L を除く
function netSend(obj){ if(NET.link) NET.link.send(obj); }
const netRandom = n => [...crypto.getRandomValues(new Uint8Array(n))].map(b => NET_ROOM_CHARS[b % NET_ROOM_CHARS.length]).join('');
function netShareUrl(room){
  const base = location.protocol.startsWith('http') ? location.origin + location.pathname : NET_PAGES_URL;
  return base ? base + '?room=' + room : '';
}
function netLinkUp(){
  NET.connected = true;
  $('netDot').classList.add('ok');
}
function netLinkDown(){
  NET.connected = false;
  NET.inflight = false;
  $('netDot').classList.remove('ok');
  netRenderModal();
}
const netHello = extra => ({t:'hello', token: NET.token, name: NET.name, autoNo: CFG.autoNo,
                            game: NET.game ? NET.game.id : null, ...extra});

/* LAN：ネット対戦サーバーへ WebSocket でつなぐ */
function netConnectLan(){
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  NET.ws = ws;
  NET.link = {send: obj => { if(ws.readyState === 1) ws.send(JSON.stringify(obj)); }};
  ws.onopen = () => NET.link.send(netHello());
  ws.onmessage = e => { try{ netOnMessage(JSON.parse(e.data)); }catch(err){ console.error('[net]', err); } };
  ws.onclose = () => {
    if(NET.ws !== ws) return;
    netLinkDown();
    setTimeout(netConnectLan, 1500);
  };
}

/* インターネット：PeerJS を読み込む */
function netLoadPeer(){
  if(window.Peer) return Promise.resolve();
  return new Promise((ok, ng) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js';
    sc.onload = ok;
    sc.onerror = () => ng(new Error('PeerJS を読み込めない'));
    document.head.appendChild(sc);
  });
}

/* ハブ（ホストのページの中で動く、順番を決める係）。ネット対戦/server.js の onMessage と同じ決まりで動く */
function netHubCreate(room, pass){
  const key = 'island_p2p_hub_' + room;
  const H = {room, pass, members: [], game: null, log: [], lobby: false, checks: new Map(), reported: new Set()};
  // ホストが読み込み直しても、部屋の参加者と対戦の続きを戻す
  try{
    const sv = JSON.parse(localStorage.getItem(key) || 'null');
    if(sv){
      H.game = sv.game || null;
      H.log = sv.log || [];
      H.lobby = !!sv.lobby;
      H.members = (sv.members || []).map(m => ({...m, online: false, ep: null}));
    }
  }catch(e){}
  let saveT = 0;
  const save = () => {
    clearTimeout(saveT);
    saveT = setTimeout(() => {
      try{
        localStorage.setItem(key, JSON.stringify({game: H.game, log: H.log, lobby: H.lobby,
          members: H.members.map(m => ({token: m.token, name: m.name, autoNo: m.autoNo, self: !!m.self}))}));
      }catch(e){ /* 容量が足りなければ、読み込み直したときに続きから戻せないだけ */ }
    }, 400);
  };
  const pub = () => H.members.map(m => ({token: m.token, name: m.name, online: m.online, host: !!m.self, autoNo: m.autoNo}));
  const to = (m, obj) => { if(m.online && m.ep) m.ep.send(obj); };
  const all = obj => H.members.forEach(m => to(m, obj));
  const sendMembers = () => all({t:'members', members: pub()});
  const desync = (i, where) => {
    if(H.reported.has(i + where)) return;
    H.reported.add(i + where);
    console.warn('[net] 盤の食い違い', i, where);
    all({t:'desync', i, where});
  };
  H.join = (msg, ep) => {
    if(!ep.self && H.pass && msg.pass !== H.pass){
      ep.send({t:'denied'});
      setTimeout(() => ep.close(), 400);
      return null;
    }
    const name = String(msg.name || '').trim().slice(0, 8);
    let me = ep.self ? H.members.find(m => m.self)
      : (H.members.find(m => msg.token && m.token === msg.token && !m.self) ||
         (name && H.members.find(m => !m.online && !m.self && m.name === name)));
    if(me && me.online && me.ep && me.ep !== ep) me.ep.close();
    if(!me){
      me = {token: netRandom(12), name: name || `参加者${H.members.length + 1}`, self: !!ep.self};
      H.members.push(me);
    }
    if(name) me.name = name;
    me.ep = ep;
    me.online = true;
    me.autoNo = msg.autoNo === 0 ? 0 : 1;
    to(me, {t:'welcome', token: me.token, name: me.name, members: pub(), lan: [],
            share: ep.self ? {room: H.room, pass: H.pass, url: netShareUrl(H.room)} : null,
            game: H.game, log: H.game ? H.log : [], lobby: H.lobby});
    sendMembers();
    save();
    return me;
  };
  H.leave = (me, ep) => {
    if(!me || me.ep !== ep) return;
    me.online = false;
    me.ep = null;
    sendMembers();
  };
  H.recv = (me, msg) => {
    switch(msg.t){
      case 'name':
        me.name = String(msg.name || '').trim().slice(0, 8) || me.name;
        sendMembers(); save();
        return;
      case 'start':
        if(!me.self || !msg.game) return;
        H.game = {...msg.game, id: Date.now().toString(36)};
        H.log = []; H.checks.clear(); H.reported.clear(); H.lobby = false;
        all({t:'start', game: H.game});
        save();
        return;
      case 'lobby':
        if(!me.self) return;
        H.lobby = true;
        all({t:'lobby'});
        save();
        return;
      case 'in': {
        if(!H.game) return;
        if(msg.base !== H.log.length){ to(me, {t:'reject', base: msg.base, now: H.log.length}); return; }
        const entry = {t:'in', i: H.log.length, from: me.token, hash: msg.hash, ev: msg.ev};
        H.log.push(entry);
        all(entry);
        save();
        return;
      }
      case 'chk': {
        if(!H.game) return;
        let c = H.checks.get(msg.i);
        if(!c){ c = {}; H.checks.set(msg.i, c); }
        c[me.token] = msg.hash;
        if(new Set(Object.values(c)).size > 1) desync(msg.i, 'after');
        if(H.checks.size > 400) H.checks.delete(H.checks.keys().next().value);
        return;
      }
      case 'desync':
        desync(msg.i, msg.where || 'before');
        return;
      case 'botstat':
        me.stat = msg.stat;
        return;
    }
  };
  return H;
}

/* インターネット：ホストになる。自分のページの中のハブに、自分もひとりの参加者としてつなぐ */
async function netHostP2P(room, pass){
  NET.mode = 'p2p';
  NET.room = room;
  const hub = NET.hub = netHubCreate(room, pass);
  // 自分の分は、通信を通さずに同じページの中で渡す（届く順は保つ）
  const selfEp = {self: true, send: obj => setTimeout(() => netOnMessage(obj), 0), close(){}};
  let me = null;
  NET.link = {send: obj => setTimeout(() => {
    if(obj.t === 'hello'){ me = hub.join(obj, selfEp); return; }
    if(me) hub.recv(me, obj);
  }, 0)};
  NET.link.send(netHello());
  NET.peerState = '部屋を開いています…';
  netRenderModal();
  try{ await netLoadPeer(); }
  catch(e){ NET.peerState = 'つなぐための部品を読み込めませんでした。インターネットにつながっているか確かめてください。'; netRenderModal(); return; }
  const open = () => {
    const peer = new window.Peer(NET_PEER_PREFIX + room.toLowerCase(), {debug: 0});
    NET.peer = peer;
    peer.on('open', () => { NET.peerState = ''; netRenderModal(); });
    peer.on('connection', conn => {
      let m = null;
      const ep = {send: obj => { if(conn.open) conn.send(obj); }, close: () => conn.close()};
      conn.on('data', msg => {
        if(!msg || typeof msg !== 'object') return;
        if(!m){ if(msg.t === 'hello') m = hub.join(msg, ep); return; }
        hub.recv(m, msg);
      });
      conn.on('close', () => hub.leave(m, ep));
      conn.on('error', () => hub.leave(m, ep));
    });
    peer.on('disconnected', () => { if(!peer.destroyed) setTimeout(() => peer.reconnect(), 1500); });
    peer.on('error', e => {
      if(e.type === 'unavailable-id'){
        // 読み込み直した直後は、前の自分がまだ部屋を持っている。少し待ってから取り直す
        NET.peerState = '前の接続が切れるのを待っています…';
        netRenderModal();
        peer.destroy();
        setTimeout(open, 3000);
      } else if(e.type === 'network' || e.type === 'server-error' || e.type === 'socket-error' || e.type === 'socket-closed'){
        NET.peerState = '仲介サーバーにつながりません。つなぎ直しています…';
        netRenderModal();
        peer.destroy();
        setTimeout(open, 4000);
      } else console.warn('[net]', e.type, e);
    });
  };
  open();
}

/* インターネット：部屋に入る */
async function netJoinP2P(room, pass){
  NET.mode = 'p2p';
  NET.room = room;
  NET.peerState = '部屋を探しています…';
  netRenderModal();
  try{ await netLoadPeer(); }
  catch(e){ NET.peerState = 'つなぐための部品を読み込めませんでした。インターネットにつながっているか確かめてください。'; netRenderModal(); return; }
  let peer = null, conn = null, retry = 0;
  const again = ms => { clearTimeout(retry); retry = setTimeout(dial, ms); };
  const dial = () => {
    if(!peer || peer.destroyed || peer.disconnected){ start(); return; }
    const c = peer.connect(NET_PEER_PREFIX + room.toLowerCase(), {reliable: true});
    conn = c;
    NET.link = {send: obj => { if(c.open) c.send(obj); }};
    c.on('open', () => { NET.peerState = ''; c.send(netHello({pass})); });
    c.on('data', msg => { if(msg && typeof msg === 'object') netOnMessage(msg); });
    const down = () => {
      if(conn !== c) return;
      conn = null;
      netLinkDown();
      if(!NET.denied){ NET.peerState = 'ホストとの接続が切れました。つなぎ直しています…'; again(2000); }
    };
    c.on('close', down);
    c.on('error', down);
  };
  const start = () => {
    if(peer) peer.destroy();
    peer = new window.Peer({debug: 0});
    NET.peer = peer;
    peer.on('open', dial);
    peer.on('disconnected', () => { if(!peer.destroyed) setTimeout(() => peer.reconnect(), 1500); });
    peer.on('error', e => {
      if(e.type === 'peer-unavailable'){
        NET.peerState = `部屋 ${room} が見つかりません。ホストが部屋を開くのを待っています…`;
        netRenderModal();
        again(4000);
      } else {
        NET.peerState = '仲介サーバーにつながりません。つなぎ直しています…';
        netRenderModal();
        clearTimeout(retry);
        retry = setTimeout(start, 4000);
      }
    });
  };
  start();
}

function netOnMessage(m){
  switch(m.t){
    case 'welcome': {
      netLinkUp();
      NET.token = m.token;
      try{ sessionStorage.setItem('island_net_token', m.token); }catch(e){}
      if(m.name && !NET.name) NET.name = m.name;
      NET.lan = m.lan || [];
      NET.share = m.share || null;
      netMembers(m.members);
      if(m.game){
        if(NET.game && NET.game.id === m.game.id){
          // つなぎ直した：届いていなかった操作だけ足す
          m.log.forEach(x => { if(x.i >= NET.logLen){ NET.queue.push(x); NET.logLen = x.i + 1; } });
        } else netBegin(m.game, m.log);
        NET.lobby = !!m.lobby;
      } else if(NET.host){
        if(!$('setupModal').classList.contains('show') && (!G || G.phase !== 'over')) openSetup();
        if(!NET.shownOnce){ NET.shownOnce = true; netOpenModal(); }
      } else netOpenModal();
      netRenderModal();
      break;
    }
    case 'denied':
      NET.denied = true;
      try{
        sessionStorage.removeItem('island_p2p');
        sessionStorage.setItem('island_p2p_msg', '合言葉が違います。確かめてもう一度入れてください。');
      }catch(e){}
      location.reload();
      break;
    case 'members':
      netMembers(m.members);
      break;
    case 'start':
      netBegin(m.game, []);
      break;
    case 'in':
      if(m.i >= NET.logLen){ NET.queue.push(m); NET.logLen = m.i + 1; }
      break;
    case 'reject':
      NET.inflight = false;
      break;
    case 'lobby':
      NET.lobby = true;
      netPresent();
      break;
    case 'desync':
      if(!NET.desync) netSendDump(m.i);   // 原因を調べるため、最初の1回だけ手元の盤をサーバーに残す
      NET.desync = m;
      $('netDot').classList.remove('ok');
      netNote(`端末どうしの盤の状態が食い違いました（${m.i}手目の${m.where === 'before' ? '前' : '後'}）。` +
              'このまま続けると、画面ごとに違う盤になるおそれがあります。', true);
      netOpenModal();
      break;
  }
}
function netMembers(list){
  NET.members = list || [];
  const me = NET.members.find(x => x.token === NET.token);
  NET.host = !!(me && me.host);
  document.body.classList.toggle('net-guest', !NET.host);
  if(me && me.name && !NET.name) NET.name = me.name;
  if($('setupModal').classList.contains('show')) renderSetupModal();
  if($('netModal').classList.contains('show')) netRenderModal();
  netPresent();
}

/* --- 部屋を作る・入る（インターネット） --- */
function netOpenEntry(msg){
  NET.entry = true;
  NET.entryMsg = msg || '';
  netRenderModal();
  $('netModal').classList.add('show');
}
function netRenderEntry(){
  const box = $('netEntry');
  const room = NET.entryRoom || '';
  const join = `<div class="net-sec"><div class="picklabel">部屋に入る</div>
      <div class="net-row"><input id="netRoomIn" type="text" maxlength="6" placeholder="部屋番号（6文字）" value="${room}"
             autocomplete="off" spellcheck="false" autocapitalize="characters">
      <input id="netPassIn" type="text" maxlength="16" placeholder="合言葉" autocomplete="off" spellcheck="false"></div>
      <button class="primary" id="netEnter">入る</button></div>`;
  const make = `<div class="net-sec"><div class="picklabel">部屋を作る（あなたがホスト）</div>
      <div class="net-row"><input id="netNewPass" type="text" maxlength="16" placeholder="合言葉を決める" autocomplete="off" spellcheck="false"></div>
      <button${room ? '' : ' class="primary"'} id="netCreate">部屋を作る</button></div>`;
  if(box.dataset.room !== room || !box.innerHTML){
    box.dataset.room = room;
    box.innerHTML = room ? join : make + join;
    $('netEnter').onclick = () => {
      const r = $('netRoomIn').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      const p = $('netPassIn').value.trim();
      if(r.length !== 6){ netOpenEntry('部屋番号は6文字です。'); return; }
      if(!p){ netOpenEntry('合言葉を入れてください。'); return; }
      try{ sessionStorage.setItem('island_p2p', JSON.stringify({room: r, pass: p})); }catch(e){}
      netGoRoom(r);
    };
    if($('netCreate')) $('netCreate').onclick = () => {
      const p = $('netNewPass').value.trim();
      if(p.length < 3){ netOpenEntry('合言葉は3文字以上にしてください。'); return; }
      const r = netRandom(6);
      try{ localStorage.setItem('island_p2p_host_' + r, p); }catch(e){}
      netGoRoom(r);
    };
  }
}
// 部屋に入るときは、それまでの1人用の対戦を捨てて読み込み直す（途中の処理が残らないように）
function netGoRoom(room){
  const u = new URL(location.href);
  u.search = '?room=' + room;
  location.href = u.toString();
}
function netLeaveRoom(){
  try{
    sessionStorage.removeItem('island_p2p');
    if(NET.room && NET.host){
      localStorage.removeItem('island_p2p_host_' + NET.room);
      localStorage.removeItem('island_p2p_hub_' + NET.room);
    }
  }catch(e){}
  const u = new URL(location.href);
  u.search = '';
  location.href = u.toString();
}
function netShareInvite(){
  const s = NET.share;
  if(!s || !s.url) return;
  const text = `群島の開拓者で遊ぼう。部屋番号 ${s.room}`;
  if(navigator.share){ navigator.share({title: '群島の開拓者', text, url: s.url}).catch(() => {}); return; }
  const done = () => { const b = $('netShareBtn'); if(b){ b.textContent = 'コピーした'; setTimeout(() => { b.textContent = 'URLをコピー'; }, 1600); } };
  if(navigator.clipboard) navigator.clipboard.writeText(s.url).then(done, () => prompt('このURLを送ってください', s.url));
  else prompt('このURLを送ってください', s.url);
}

/* --- 画面：ネット対戦の窓 --- */
function netRenderModal(){
  const entry = !NET.on && NET.entry;
  $('netEntry').style.display = entry ? '' : 'none';
  $('netRoomBox').style.display = entry ? 'none' : '';
  $('netLeave').style.display = NET.mode === 'p2p' ? '' : 'none';
  if(entry){
    $('netStatus').textContent = NET.entryRoom
      ? `部屋 ${NET.entryRoom} に入ります。ホストから聞いた合言葉を入れてください。`
      : 'インターネットで遊びます。ホストが部屋を作り、URLと合言葉をほかの人に伝えます。';
    netRenderEntry();
    netNote(NET.entryMsg || '', !!NET.entryMsg);
  } else {
    $('netStatus').textContent = NET.peerState ? NET.peerState
      : !NET.connected ? (NET.mode === 'p2p' ? 'ホストにつないでいます…' : 'サーバーに接続しています…')
      : NET.host ? 'あなたがホストです。開始画面で条件を決めて「島に渡る」を押すと、全員の画面で始まります。'
      : NET.game ? '対戦に参加しています。'
      : 'ホストが始めるのを待っています。';
  }
  const nameIn = $('netName');
  if(document.activeElement !== nameIn) nameIn.value = NET.name;
  // 招待（ホストだけに出す）：インターネットは部屋番号と合言葉とURL、LANは同じWi-Fiのアドレス
  const join = $('netJoin');
  const s = NET.share;
  const url = s ? s.url : (NET.lan[0] || '');
  const want = NET.host && !entry ? (s ? 'p2p:' + url : NET.lan.length ? 'lan:' + url : '') : '';
  if(join.dataset.key !== want){
    join.dataset.key = want;
    if(!want) join.innerHTML = '';
    else if(s){
      join.innerHTML = `${url ? '<div class="qr" id="netQr"></div>' : ''}<div class="urls">
          部屋番号<b>${s.room}</b>合言葉<b>${s.pass}</b>
          ${url ? `<button id="netShareBtn">${navigator.share ? 'URLを送る' : 'URLをコピー'}</button>`
                : '<span>公開したページで開くと、招待のURLを出せます</span>'}</div>`;
      if($('netShareBtn')) $('netShareBtn').onclick = netShareInvite;
      if(url) netDrawQr(url);
    } else {
      join.innerHTML = `<div class="qr" id="netQr"></div><div class="urls">同じWi-Fiの端末で開く
        ${NET.lan.map(u => `<b>${u}</b>`).join('')}</div>`;
      netDrawQr(url);
    }
  }
  const seatOfToken = t => NET.game ? NET.game.seats.indexOf(t) : -1;
  $('netMembers').innerHTML = NET.members.map(m => {
    const at = seatOfToken(m.token);
    const tags = [m.host ? 'ホスト' : '', m.token === NET.token ? 'あなた' : '',
                  at >= 0 && G.players[at] ? '席：' + G.players[at].name : '', m.online ? '' : '切断中']
                 .filter(Boolean).join('・');
    const sw = at >= 0 && G.players[at] ? `<span class="swatch" style="background:${G.players[at].css}"></span>` : '<span class="dot"></span>';
    return `<div class="net-mem${m.online ? '' : ' off'}">${sw}<span>${m.name || '（名前なし）'}</span><span class="st">${tags}</span></div>`;
  }).join('');
}

/* --- 始まり --- */
function netEnter(){
  NET.on = true;
  NET.entry = false;
  document.body.classList.add('net-on');
  $('setupModal').classList.remove('show');   // ホストかどうかが分かってから出す
  setInterval(netPump, 25);
}
function netInit(){
  try{
    NET.name = localStorage.getItem('island_net_name') || '';
    NET.token = sessionStorage.getItem('island_net_token') || '';
  }catch(e){}
  $('netBtn').onclick = () => { resumeAudio(); if(NET.on) netOpenModal(); else netOpenEntry(); };
  $('netClose').onclick = () => $('netModal').classList.remove('show');
  $('netLeave').onclick = netLeaveRoom;
  $('netName').oninput = e => netSetName(e.target.value);
  // LAN：ネット対戦サーバーから開いた
  if(window.ISLAND_NET){ NET.mode = 'lan'; netEnter(); netConnectLan(); return; }
  // インターネット：?room=部屋番号 で開いた
  const room = (new URLSearchParams(location.search).get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
  if(!room) return;                            // 1人で遊ぶ（左上のボタンから部屋を作れる）
  let hostPass = null, joined = null;
  try{
    hostPass = localStorage.getItem('island_p2p_host_' + room);
    joined = JSON.parse(sessionStorage.getItem('island_p2p') || 'null');
  }catch(e){}
  if(hostPass !== null){ netEnter(); netHostP2P(room, hostPass); return; }
  if(joined && joined.room === room && joined.pass){ netEnter(); netJoinP2P(room, joined.pass); return; }
  NET.entryRoom = room;
  let msg = '';
  try{ msg = sessionStorage.getItem('island_p2p_msg') || ''; sessionStorage.removeItem('island_p2p_msg'); }catch(e){}
  netOpenEntry(msg);
}
netInit();
</script>
