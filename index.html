/* 海賊を動かす（P-2, P-4）。奪えるのは、そのタイルに接する船を持つ相手だけ。
   海岸の開拓地からは奪わない（P-5）                                     */
async function movePirate(hexId, pid){
  G.hexes.forEach(h => h.pirate = false);
  G.hexes[hexId].pirate = true;
  G.mode = null;
  clearPickables();
  await movePirateMesh(G.hexes[hexId]);
  updatePirateMesh();
  const victims = [];
  G.edges.forEach(e => {
    if(e.ship === null || e.ship === pid) return;
    if(!e.hexes.includes(hexId)) return;
    if(!victims.includes(e.ship)) victims.push(e.ship);
  });
  if(victims.length){
    const target = G.players[victims[Math.floor(rng() * victims.length)]];
    const pool = RES.filter(r => target.res[r] > 0);
    if(G.seaSc === 'cloth' && target.cloth > 0 && await clothStealChoice(pid, target)){
      target.cloth--; G.players[pid].cloth++;
      log(`${G.players[pid].name}が海賊で${target.name}から布を奪った`);
      sfx('steal');
      recalcVP();
      render();
    } else if(pool.length){
      const r = pool[Math.floor(rng() * pool.length)];
      target.res[r]--; G.players[pid].res[r]++;
      log(`${G.players[pid].name}が海賊で${target.name}から${RES_JA[r]}を奪った`);
      render();
      sfx('steal');
      await flyBetween([{res:r, n:1, from:target.id, to:pid}]);
      if(pid === activeHuman()) showGain({[r]:1});
    } else log(`${target.name}から奪える資源はなかった`);
  } else log('海賊が移動した');
  G.mode = null;
  G.phase = G.robberReturn || 'action';
  G.robberReturn = null;
  render();
  await wait(500);
  if(G.phase === 'action' && G.players[G.turn].cpu) await cpuAction();
}

async function moveRobber(hexId, pid){
  G.hexes.forEach(h => h.robber = false);
  G.hexes[hexId].robber = true;
  G.mode = null;
  clearPickables();
  await moveRobberMesh(G.hexes[hexId]);
  updateRobberMesh();
  const victims = [];
  G.hexes[hexId].vertices.forEach(vi => {

async function endTurn(){
  // 攻め落とした砦は、手番の人の航海が終わってから分け前と英雄を決める（L-3）
  if(G.explore && G.pendingLairs && G.pendingLairs.length){
    await resolveLairs();
    if(G.phase === 'over') return;
  }
  if(G.seaSc){ await sea8EndTurn(G.players[G.turn]); if(G.phase === 'over') return; }
  recalcVP();
  const p = G.players[G.turn];
  if(G.seaSc ? sea8Winner() : p.vp >= G.vpTarget){ gameOver(p); return; }
  G.sinceBuild++;
  if(G.sinceBuild >= 40){
    // 盤面の空きと駒数が尽きて誰も伸ばせない。最多得点で決着
    const lead = G.players.slice().sort((a, b) => b.vp - a.vp)[0];
    log('島に開拓の余地がなくなった');
    gameOver(lead);
    return;
  }
  // 手番を終えるときに、その人のカードは次から使えるようになる
  p.dev.forEach(c => c.fresh = false);
  p.devPlayed = false;
  G.freeRoads = 0;
  G.mode = null;
  p.shipMoved = false;          // 船を動かせるのは1手番に1隻（S-5）
  if(G.explore) exploreEndTurn(p);
  G.turnCount++;
  G.turn = G.order[(G.order.indexOf(G.turn) + 1) % G.order.length];
  G.phase = 'roll';
  // 他人の手番に点が届いた人は、自分の番が来た時点で勝つ
  recalcVP();
  if((G.explore && G.players[G.turn].vp >= G.vpTarget) || (G.seaSc && sea8Winner())){ gameOver(G.players[G.turn]); return; }
  render();
  await banner(`${G.players[G.turn].name}の番`, 750);
  if(G.phase === 'over') return;
  render();
  if(G.players[G.turn].cpu) await cpuTurn();
  else if(isHotSeat()) await passDevice(G.players[G.turn]);
}

function gameOver(winner){
  // ランダムの席は、決着したところで持ち味を明かす
  if(G && G.players) G.players.forEach(x => {
    if(x.random && x.persona) log(x.name + 'の持ち味は「' + PERSONAS[x.persona].ja + '」だった');
  });
  G.phase = 'over';
  G.mode = null;
  G.busy = false;
  clearPickables();
  render();
  // ネット対戦では、見ている人が勝ったかどうかで出し分ける
  const won = NET.on ? winner.id === NET.pid : !winner.cpu;
  document.getElementById('endTitle').textContent = won ? '勝利' : '敗北';
  const parts = [];
  const builds = G.vertices.reduce((s2, v) => {
    if(!v.building || v.building.owner !== winner.id) return s2;
    return s2 + (v.building.type === 'city' || v.building.type === 'harbor' ? 2 : 1);
  }, 0);
  parts.push(G.explore ? `開拓地と港町 ${builds}点` : `開拓地と都市 ${builds}点`);
  if(G.explore && missionVP(winner)) parts.push(`任務 ${missionVP(winner)}点`);
  if(G.longestId === winner.id) parts.push('最長交易路 2点');
  if(G.armyId === winner.id) parts.push('最大騎士力 2点');
  if(G.seaSc) parts.push(...sea8OverParts(winner));
  const vpc = winner.dev.filter(c => c.type === 'vp').length;
  if(vpc) parts.push(`勝利点カード ${vpc}点`);
  document.getElementById('endText').textContent =
    `${winner.name}が勝利点${winner.vp}に到達した。（${parts.join('／')}）`;
  sfx(won ? 'win' : 'lose');
  celebrate(winner);
  document.getElementById('endModal').classList.add('show');
}

   ・港は自分の産出と噛み合うときに価値がある
   ・盗賊は首位の産出を止める
   ・交易は建設を成立させるときだけ行う
   ---------------------------------------------------------- */
// つよいCPUの調整値
const TUNE = {
  roadFloorEarly: 8,     // 序盤、この見込み未満なら街道を敷かない
  roadFloorLate: 6,      // 終盤の同上
  genericTrade: true,    // 建設に直結しない銀行交易を行うか
  blockWeight: 0.30,     // 相手の好位置を潰す価値の重み
  cityBias: 1.00         // 都市化の優先度
};

const W_EARLY = {lumber:1.25, brick:1.30, grain:1.05, wool:0.90, ore:0.80};
const W_LATE  = {lumber:0.80, brick:0.80, grain:1.30, wool:0.85, ore:1.40};

function isLate(p){
  // 都市化局面かどうか。初期配置直後は距離ルールで一時的に置き場所が0になるため、
  // 「置ける場所がない」ことは終盤の根拠にしない
  const built = G.vertices.filter(v => v.building && v.building.owner === p.id).length;
  return p.vp >= Math.ceil(G.vpTarget * .45) || built >= 4 || p.stock.settlement === 0;
}
// つよいCPUだけに効かせる調整値。数値は総当たり対戦で詰めたもの
const EXPT = {
  wEarly: null,          // 差し替えるなら {lumber:…} を入れる
  wLate:  null,
  roadFloorEarly: null,
  roadFloorLate:  null,
  blockWeight:    null,
  cityBias:       null,
  devProb:        null
};
function resWeight(p, r){
  let tbl = isLate(p) ? W_LATE : W_EARLY;
  if(expert(p.id)){
    const o = isLate(p) ? EXPT.wLate : EXPT.wEarly;
    if(o && o[r] !== undefined) return o[r] * (G.scarcity ? G.scarcity[r] : 1);
  }
  return tbl[r] * (G.scarcity ? G.scarcity[r] : 1);
}
// つよいCPUの調整値を引く（未設定なら共通の TUNE を使う）
const tuneOf = (pid, key) => {
  const f = aiFocusOf(pid), o = f && AI_FOCUS[f].tune;
  if(o && o[key] !== undefined) return o[key];
  const per = personaOf(pid);
  const q = per && G.players[pid].quirk;
  let base = (per && per.tune[key] !== undefined) ? per.tune[key] : undefined;
  if(base === undefined && per) base = (expert(pid) && EXPT[key] !== null && EXPT[key] !== undefined) ? EXPT[key] : TUNE[key];
  if(per && q && typeof base === 'number'){
    if(key === 'cityBias') return base * q.cityMul;
    if(key === 'roadFloorEarly' || key === 'roadFloorLate') return Math.max(0, base + q.roadAdd);
    return base;
  }
  if(per && per.tune[key] !== undefined) return per.tune[key];
  return (expert(pid) && EXPT[key] !== null && EXPT[key] !== undefined) ? EXPT[key] : TUNE[key];
};
/* 段位AIの方針。1手番に1回だけ Gemini に決めさせ、その手番の重みづけを差し替える。
   盤の読みは Hard のものを使い、方針で優先順位だけ動かす（呼ぶ回数と待ち時間を抑える） */
const AI_FOCUS = {
  city:   {ja:'都市化', tune:{cityBias:1.45}, dev:.10},
  settle: {ja:'開拓地を増やす', tune:{cityBias:0.75, roadFloorEarly:6}, dev:.10},
  dev:    {ja:'発展カード', tune:{}, dev:.85},
  road:   {ja:'最長交易路', tune:{roadFloorEarly:4, roadFloorLate:3}, dev:.15},
  sea:    {ja:'海へ出る', tune:{}, dev:.20}
};
const aiFocusOf = pid => {
  const p = G && G.players && G.players[pid];
  return (p && p.lv === 'ai' && p.aiFocus && AI_FOCUS[p.aiFocus]) ? p.aiFocus : null;
};

// 盤面上でその交差点がどれだけ産出するか（重みつき）
function production(vId, pid){
  const p = G.players[pid], out = {};
  G.vertices[vId].hexes.forEach(hi => {
    const h = G.hexes[hi], r = TILE_RES[h.type];
    if(!r || !h.number) return;
    out[r] = (out[r] || 0) + pipValue(h.number);
  });
  return out;
}

function evalVertexStrong(vId, pid){
  const p = G.players[pid], v = G.vertices[vId];
  const prod = production(vId, pid);
  let score = 0;
  Object.entries(prod).forEach(([r, pip]) => { score += pip * resWeight(p, r); });

  // 既に持っていない資源を押さえる価値
  const owned = {};
  G.vertices.forEach(o => {
    if(o.building && o.building.owner === pid)
      Object.entries(production(o.id, pid)).forEach(([r, pip]) => { owned[r] = (owned[r] || 0) + pip; });
  });
  Object.keys(prod).forEach(r => { if(!owned[r]) score += 3.2; });
  // 5資源をどれだけ揃えられるか
  const kinds = new Set([...Object.keys(owned), ...Object.keys(prod)]);
  score += kinds.size * .8;

  // 港：自分の産出と噛み合うほど価値がある
  if(v.port === 'any') score += 1.6;
  else if(v.port){
    const have = (owned[v.port] || 0) + (prod[v.port] || 0);
    score += have >= 4 ? 3.4 : 1.0;
  }

  // 相手にとっても好位置なら、押さえる価値が上乗せされる（首位の相手ほど重く見る）
  if(smart(pid)){
    let block = 0;
    G.players.forEach(o => {
      if(o.id === pid) return;
      let s2 = 0;
      Object.entries(prod).forEach(([r, pip]) => { s2 += pip * resWeight(o, r); });
      block = Math.max(block, s2 * (1 + .8 * (o.vp / Math.max(1, G.vpTarget))));
    });
    score += block * tuneOf(pid, 'blockWeight');
  }
  return score;
}

// 都市化の価値：都市は産出が2倍になるので、素の産出量で選ぶ
function cityValue(vId, pid){
  if(lvOf(pid) === 'weak') return evalVertex(vId, pid);
  const p = G.players[pid], prod = production(vId, pid);
  let s = 0;
  Object.entries(prod).forEach(([r, pip]) => { s += pip * resWeight(p, r); });
  return s;
}

// その交差点から2本以内の街道で届く、将来の開拓地候補の良さ
function expansionValue(vId, pid){
  const seen = new Set([vId]);
  let best = 0, second = 0;
  const step = (v, depth) => {
    if(depth > 2) return;
    for(const ei of G.vertices[v].edges){
      const e = G.edges[ei];
      if(e.road !== null && e.road !== pid) continue;       // 相手の街道は通れない
      const nx = e.v.find(x => x !== v);
      if(seen.has(nx)) continue;
      const nv = G.vertices[nx];
      if(nv.building && nv.building.owner !== pid) continue; // 相手の建物で行き止まり
      seen.add(nx);
      if(!nv.building && !nv.adj.some(a => G.vertices[a].building)){
        const sc = rawProduction(nx, pid);
        if(sc > best){ second = best; best = sc; }
        else if(sc > second) second = sc;
      }
      step(nx, depth + 1);
    }
  };
  step(vId, 0);
  return best + second * .45;
}

/* 新しい島に初めて建てると2点（V-2）。CPUがそこを狙えるよう、
   まだ入植していない島の交差点に上乗せする                             */
function islandBonusFor(vId, pid){
  const v = G.vertices[vId];
  if(G.seaSc) return sea8BonusFor(v, pid);
  if(!v.island || v.island === 'main') return 0;
  return G.players[pid].islands.includes(v.island) ? 0 : 1;
}
/* 島の2点を、産出の点数に換算していくら乗せるか。
   ・終盤ほど「確実な2点」の価値が上がるので、勝利点の進み具合で重くする
   ・本島が狭いので、産出が細いまま居座ると資源そのものが集まらない。
     細い人ほど島へ出る価値が高い（本島で回るなら出る必要がない）
   実測：固定の14では、島の角が建てられる手番でも7割は本島を選んでいた   */
// 産出の細さ。0＝本島だけで十分回る、1＝ほとんど出ない
// ピップ合計14前後が「回る」目安（良い開拓地2軒ぶん）
function thinProduction(pid){
  const pips = RES.reduce((s, r) => s + productionRate(pid, r), 0);
  return Math.max(0, 1 - pips / 14);
}
function islandWeight(pid){
  const p = G.players[pid];
  return 15 + 15 * Math.min(1, p.vp / Math.max(1, G.vpTarget)) + 14 * thinProduction(pid);
}

/* 行き止まりになった船を、島へ近づく位置へ置き直す（S-5, S-8）。
   航路を引き直せるのがこの拡張の肝なので、ふつう以上のCPUは使う       */
function islandTargets(pid){
  return G.vertices.filter(v =>
    v.land && !v.building && !v.adj.some(a => G.vertices[a].building) &&
    islandBonusFor(v.id, pid) > 0);
}
function shipReach(ei, targets, pid){
  const e = G.edges[ei];
  const a = G.vertices[e.v[0]], b = G.vertices[e.v[1]];
  const mx = (a.x + b.x) / 2, mz = (a.z + b.z) / 2;
  let best = 0;
  targets.forEach(v => { best = Math.max(best, 13 / (1 + hyp(v.x - mx, v.z - mz) / 1.7)); });
  // 島の交差点そのものに接している船は、もう仕事をしている
  if(e.v.some(vi => islandBonusFor(vi, pid) > 0 && !G.vertices[vi].building)) best += 6;
  return best;
}
function bestShipMove(pid){
  const movable = movableShips(pid);
  if(!movable.length) return null;
  const targets = islandTargets(pid);
  if(!targets.length) return null;
  // 置き先の洗い出しは重いので、いちばん遊んでいる1隻だけを見る
  const worst = movable
    .map(ei => ({ei, r: shipReach(ei, targets, pid)}))
    .sort((a, b) => a.r - b.r)[0];
  let best = null;
  validShipSpots(pid, worst.ei).forEach(to => {
    const gain = shipReach(to, targets, pid) - worst.r;
    if(gain > 1.5 && (!best || gain > best.gain)) best = {from: worst.ei, to, gain};
  });
  return best;
}

/* 街道と船の両方をたどって、次に建てたい交差点とそこへの経路を求める。
   状態は「頂点＋そこへ来た線の種類」。街道と船の乗り換えには自分の建物が
   要る（R-2, S-3）ので、種類まで見ないと届く／届かないを間違える        */
function planRoute(pid){
  const start = new Map();                    // 頂点 → 出せる線（any は建物）
  G.vertices.forEach(v => {
    if(v.building && v.building.owner === pid) start.set(v.id, 'any');
  });
  G.edges.forEach(e => {
    if(e.road === pid) e.v.forEach(v => { if(!start.has(v)) start.set(v, 'road'); });
    if(e.ship === pid) e.v.forEach(v => { if(!start.has(v)) start.set(v, 'ship'); });
  });
  if(!start.size) return null;

  const seen = new Map(), prev = new Map(), queue = [];
  start.forEach((kind, v) => {
    ['road','ship'].forEach(k => {
      if(kind !== 'any' && kind !== k) return;
      const s = v + '|' + k;
      seen.set(s, 0);
      queue.push({v, k, d: 0, s, anchored: kind === 'any'});
    });
  });
  let best = null, bestScore = 0, bestState = null;

  for(let qi = 0; qi < queue.length; qi++){
    const {v, k, d, s} = queue[qi];
    if(d >= 5) continue;                             // 5本より先は見ない
    const vb = G.vertices[v].building;
    if(d > 0 && vb && vb.owner !== pid) continue;    // 相手の建物で行き止まり
    // 乗り換えの可否は建物の有無だけで決まる。出発点の種類は start が持っている
    const mine = !!(vb && vb.owner === pid);
    for(const ei of G.vertices[v].edges){
      const e = G.edges[ei];
      let kind;
      if(e.road === pid) kind = 'road';
      else if(e.ship === pid) kind = 'ship';
      else if(e.road !== null || e.ship !== null) continue;   // 相手の線は通れない
      else if(e.canRoad && (k === 'road' || mine)) kind = 'road';
      else if(e.canShip) kind = 'ship';
      else continue;
      if(kind === 'road' && !e.canRoad) continue;
      if(kind === 'ship' && !e.canShip) continue;
      if(kind !== k && !mine) continue;                       // 乗り換えには建物が要る
      if(kind === 'ship' && e.ship === null && pirateBlocks(e)) continue;
      const nx = e.v.find(x => x !== v);
      const ns = nx + '|' + kind;
      if(seen.has(ns)) continue;
      seen.set(ns, d + 1);
      prev.set(ns, {edge: ei, from: s, kind});
      queue.push({v: nx, k: kind, d: d + 1, s: ns});
      const nv = G.vertices[nx];
      if(nv.land && !nv.building && !nv.adj.some(a => G.vertices[a].building)){
        let sc = evalVertexStrong(nx, pid) + islandBonusFor(nx, pid) * islandWeight(pid);
        sc /= 1 + (d + 1) * .55;                              // 遠いほど割り引く
        if(sc > bestScore){ bestScore = sc; best = nx; bestState = ns; }
      }
    }
  }
  if(best === null) return null;

  // 経路を逆にたどり、まだ置いていない辺を順に並べる
  const path = [];
  let cur = bestState;
  while(prev.has(cur)){
    const {edge, from, kind} = prev.get(cur);
    const e = G.edges[edge];
    if(e.road === null && e.ship === null) path.unshift({ei: edge, kind});
    cur = from;
  }
  return path.length ? {target: best, path, score: bestScore} : null;
}

// 重みをかけた素の産出量
function rawProduction(vId, pid){
  const p = G.players[pid];
  let s2 = 0;
  G.vertices[vId].hexes.forEach(hi => {
    const h = G.hexes[hi], r = TILE_RES[h.type];
    if(r && h.number) s2 += pipValue(h.number) * resWeight(p, r);
  });
  return s2;
}

function evalVertexFor(vId, pid){
  const base = lvOf(pid) === 'weak' ? evalVertex(vId, pid) : evalVertexStrong(vId, pid);
  // 新しい島の2点はどの段位でも見る。ここを外すと本島から出ていかない
  return base + islandBonusFor(vId, pid) * islandWeight(pid);
}

/* --- つよいCPU（段位2）の上積み ------------------------------
   定石として広く言われていることを、そのまま点数に落とす：
   ・初期配置は合計ピップがものを言う。噛み合わせより先に数字を見る
   ・開拓地に要る4資源（木・レンガ・小麦・羊）を2か所で揃える
   ・同じ数字に固めない（出目の振れが大きくなる）
   ・伸ばせる先があるか（街道2本で届く次の候補）
   ・最大騎士力は都市化より安い2点。届くなら発展カードを買い続ける
   ・最長交易路も、あと1〜2本で取れるなら取りに行く
   ------------------------------------------------------------ */

// 自分の建物が既に押さえている数字。偏りを避けるために使う
function ownNumbers(pid){
  const m = {};
  G.vertices.forEach(v => {
    if(!v.building || v.building.owner !== pid) return;
    v.hexes.forEach(hi => {
      const h = G.hexes[hi];
      if(h.number) m[h.number] = (m[h.number] || 0) + 1;
    });
  });
  return m;
}

// 初期配置専用の評価
function evalSetupVertex(vId, pid){
  let score = evalVertexStrong(vId, pid);
  const prod = production(vId, pid);

  if(EXP.setupCore){
    // 開拓地に要る4資源（木・レンガ・小麦・羊）を2か所で揃える
    const owned = {};
    G.vertices.forEach(o => {
      if(o.building && o.building.owner === pid)
        Object.entries(production(o.id, pid)).forEach(([r, pip]) => { owned[r] = (owned[r] || 0) + pip; });
    });
    const core = ['lumber', 'brick', 'grain', 'wool'];
    const before = core.filter(r => owned[r]).length;
    const after  = core.filter(r => owned[r] || prod[r]).length;
    score += (after - before) * 2.2;
    if(after === 4) score += 2.0;
    // 同じ数字に固めない（出目の振れが大きくなる）
    const nums = ownNumbers(pid);
    G.vertices[vId].hexes.forEach(hi => {
      const h = G.hexes[hi];
      if(h.number && nums[h.number]) score -= 1.2 * nums[h.number];
    });
  }
  /* 定石のハードコード（つよいCPUのみ）。
     ・鉄5・麦4・羊3のピップがそろう角は都市と発展カードの回転が早い
     ・鉄も麦も出ない角は、都市化の目処が立たないので初期配置では避ける        */
  if(expert(pid) && !G.seaSc && !G.explore){
    const owned = {};
    G.vertices.forEach(o => {
      if(o.building && o.building.owner === pid)
        Object.entries(production(o.id, pid)).forEach(([r, pip]) => { owned[r] = (owned[r] || 0) + pip; });
    });
    const pipOf = r => (owned[r] || 0) + (prod[r] || 0);
    if(pipOf('ore') >= 5 && pipOf('grain') >= 4 && pipOf('wool') >= 3) score += 6;
    const wb = pipOf('lumber') + pipOf('brick');
    if(wb >= 9 && Math.abs(pipOf('lumber') - pipOf('brick')) <= 2) score += 4;
    if(pipOf('ore') === 0 && pipOf('grain') === 0) score -= 8;
  }
  // 一点狙いの相手は、単一資源の厚みとその2:1港を好む
  const perS = personaOf(pid);
  if(perS && perS.single){
    const owned = {};
    G.vertices.forEach(o => {
      if(o.building && o.building.owner === pid)
        Object.entries(production(o.id, pid)).forEach(([r, pip]) => { owned[r] = (owned[r] || 0) + pip; });
    });
    const merged = {...owned};
    Object.entries(prod).forEach(([r, pip]) => { merged[r] = (merged[r] || 0) + pip; });
    let topRes = null, top = 0;
    Object.entries(merged).forEach(([r, pip]) => { if(pip > top){ top = pip; topRes = r; } });
    score += top * 1.2;
    const vv = G.vertices[vId];
    if(vv.port && vv.port === topRes) score += 5;
  }
  const perSet = personaOf(pid);
  if(perSet && perSet.portLove){
    // 港そのものを強く好む。2:1は自分の産出と噛み合えばさらに重い
    const vp2 = G.vertices[vId];
    if(vp2.port === 'any') score += 4;
    else if(vp2.port) score += (prod[vp2.port] ? 7 : 3);
  }
  if(perSet && perSet.core){
    // 開拓地に要る4資源を早くそろえる打ち方
    const owned2 = {};
    G.vertices.forEach(o => {
      if(o.building && o.building.owner === pid)
        Object.entries(production(o.id, pid)).forEach(([r, pip]) => { owned2[r] = (owned2[r] || 0) + pip; });
    });
    const core = ['lumber', 'brick', 'grain', 'wool'];
    const before = core.filter(r => owned2[r]).length;
    const after  = core.filter(r => owned2[r] || prod[r]).length;
    score += (after - before) * 2.2;
    if(after === 4) score += 2.0;
  }
  if(perSet && perSet.pips){
    // 噛み合わせより、とにかく出る角を取る
    score += Object.values(prod).reduce((a, b) => a + b, 0) * 0.55;
  }
  if(EXP.setupPips){
    // 合計ピップそのもの。噛み合わせが多少悪くても、出る角は強い
    score += Object.values(prod).reduce((a, b) => a + b, 0) * 0.55;
    score += expansionValue(vId, pid) * 0.30;   // 伸びしろ
  }
  return score;
}

const handSize = p => RES.reduce((n, r) => n + p.res[r], 0);

// 自分の盤面が1手番あたりに生む、その資源の量（ピップ換算）
function ownOutput(pid, res){
  let s = 0;
  G.vertices.forEach(v => {
    if(!v.building || v.building.owner !== pid) return;
    const mul = v.building.type === 'city' ? 2 : 1;
    v.hexes.forEach(hi => {
      const h = G.hexes[hi];
      if(h.number && TILE_RES[h.type] === res) s += pipValue(h.number) * mul;
    });
  });
  return s;
}

// 最大騎士力まであと何枚か。
// 発展カードは羊毛＋小麦＋鉱石。半端に買うと資源だけ減るので、
// つよいCPUは鉱石と小麦が実際に出る盤面のときだけ追う（armyGate）
function armyChase(p){
  if(G.armyId === p.id) return false;
  const target = G.armyId === null ? ARMY_MIN : G.armyCount + 1;
  const need = target - p.knights;
  if(need <= 0 || need > 3) return false;
  if(EXP.armyGate && expert(p.id)){
    const engine = ownOutput(p.id, 'ore') >= 3 && ownOutput(p.id, 'grain') >= 3;
    if(!engine) return false;
  }
  return true;
}

// 最長交易路まであと1〜2本か
function roadChase(pid){
  const p = G.players[pid];
  if(G.longestId === pid || p.stock.road < 2) return false;
  const target = Math.max(LONGEST_MIN, (G.longestLen || 0) + 1);
  const need = target - longestRoadLen(pid);
  return need > 0 && need <= 2;
}

function pickBest(list, pid){
  const sorted = list.slice().sort((a, b) => b.s - a.s);
  // 段位に応じて最善を選び損ねる。
  // よわいは候補から無作為、ふつうは上位から外れる程度に留める
  const slip = SLIP[lvOf(pid)] || 0;
  if(slip && sorted.length > 1 && rng() < slip){
    if(lvOf(pid) === 'weak') return sorted[Math.floor(rng() * sorted.length)];
    // 上位3手のどれかを選ぶ（悪手までは打たない）
    return sorted[Math.floor(rng() * Math.min(3, sorted.length))];
  }
  return sorted[0];
}

function evalVertex(vId, pid){
  const v = G.vertices[vId];
  let score = 0;
  const kinds = new Set();
  v.hexes.forEach(hi => {
    const h = G.hexes[hi];
    const r = TILE_RES[h.type];
    if(!r) return;
    score += pipValue(h.number);
    kinds.add(r);
  });
  score += kinds.size * 1.5;                      // 資源の多様性
  if(v.port) score += v.port === 'any' ? 1 : 1.5; // 港
  // 既に持っていない資源を優先
  const owned = new Set();
  G.vertices.forEach(o => {
    if(o.building && o.building.owner === pid)
      o.hexes.forEach(hi => { const r = TILE_RES[G.hexes[hi].type]; if(r) owned.add(r); });
  });
  kinds.forEach(k => { if(!owned.has(k)) score += 2; });
  return score;
}

async function cpuSetup(){
  const pid = G.turn;
  G.level = G.players[pid].lv;
  await wait(500);
  const spots = validSettlementSpots(pid);
  if(!spots.length){ await advanceSetup(); return; }
  const evalAt = v => expOn(pid, 'setup') ? evalSetupVertex(v, pid) : evalVertexFor(v, pid);
  const best = pickBest(spots.map(v => ({v, s: evalAt(v)})), pid).v;
  placeSettlement(best, pid);
  G.lastSettlement = best;
  if(G.setupStep >= setupGrantFrom()) grantInitialResources(best, pid);
  G.setupNeeds = 'road';
  render();
  await wait(650);
  // 海岸なら街道の代わりに船を出してもよい（T-3）。両方を同じ土俵で比べる
  const rate = (ei, kind) => {
    const e = G.edges[ei];
    const far = e.v.find(x => x !== best);
    let s = G.vertices[far].land ? evalVertexFor(far, pid) : 0;
    if(expOn(pid, 'setup')) s += expansionValue(far, pid) * .55;
    if(kind === 'ship') s += 2.2;      // 島へ渡る足がかりを少し買う
    return {ei, kind, s};
  };
  const cands = [
    ...validRoadSpots(pid).map(ei => rate(ei, 'road')),
    ...validShipSpots(pid).map(ei => rate(ei, 'ship'))
  ];
  if(cands.length){
    const pick = pickBest(cands, pid);
    if(pick.kind === 'ship') placeShip(pick.ei, pid);
    else placeRoad(pick.ei, pid);
  }
  render();
  await wait(600);
  await advanceSetup();
}

/* --- 段位AI（Gemini） --------------------------------------------
   手番の頭で一度だけ「この手番は何を狙うか」を尋ね、実行は Hard の判断で行う。
   キーが無い・つながらない・形式が違うときは、その局は Hard として進める     */
const aiKeyNow = () => AI_CANVAS ? '' : String(CFG.aiKey || '').trim();
const aiUsable = () => AI_CANVAS || !!aiKeyNow();
function aiBoardText(pid){
  const p = G.players[pid];
  const mine = RES.map(r => RES_JA[r] + (p.res[r] || 0)).join('／');
  const cities = G.vertices.filter(v => v.building && v.building.owner === pid && v.building.kind === 'city').length;
  const setts  = G.vertices.filter(v => v.building && v.building.owner === pid && v.building.kind === 'settlement').length;
  const others = G.players.filter(x => x.id !== pid)
    .map(x => x.name + ' ' + x.vp + '点/手札' + handSize(x) + '枚').join('、');
  return [
    'あなたはカタン系ボードゲーム「群島の開拓者」の熟練プレイヤー ' + p.name + '。この手番の方針をひとつ選ぶ。',
    'ルール：' + scenarioOf().name + '（勝利は' + G.vpTarget + '点）',
    '自分：' + p.vp + '点、開拓地' + setts + '・都市' + cities + '、手札 ' + mine + '、発展カード' + p.dev.length + '枚、騎士' + p.knights + '体',
    '手持ちの駒：開拓地' + p.stock.settlement + '・都市' + p.stock.city + '・街道' + p.stock.road,
    '置ける開拓地の場所：' + validSettlementSpots(pid).length + 'か所',
    '最長交易路：' + (G.longestId === null ? 'まだ誰も' : G.players[G.longestId].name) + '（' + (G.longestLen || 0) + '本）',
    '最大騎士力：' + (G.armyId === null ? 'まだ誰も' : G.players[G.armyId].name),
    '他の開拓者：' + others,
    '直近の出来事：' + G.log.slice(-6).join(' / '),
    '選べる方針：city=都市化、settle=開拓地を増やす、dev=発展カード、road=最長交易路、sea=海へ出る。',
    '理由は30字以内の日本語で。'
  ].join(String.fromCharCode(10));
}
async function aiAskFocus(pid, retried){
  const used = aiModelNow();
  try{
    return await aiAskFocusOnce(pid);
  }catch(e){
    // モデルが使えないときだけ作り直す。通信断や形式違いはそのまま失敗させる
    const msg = String(e && e.message);
    const gone = AI_CANVAS ? /HTTP (404|400|403)/.test(msg) : /HTTP (404|400)/.test(msg);
    if(retried || !gone) throw e;
    let next;
    if(AI_CANVAS){
      // Canvas は動作を確かめてある決め打ちへ戻す。それ自体が駄目なら諦める
      if(used === AI_MODEL_CANVAS) throw e;
      next = AI_MODEL_CANVAS;
    }else{
      const list = await aiFetchModels(aiKeyNow());
      AI_MODELS = list;
      const pick = list.find(m => m.id !== used);   // 失敗したモデル以外の先頭
      if(!pick) throw e;
      next = pick.id;
    }
    CFG.aiModel = next === AI_MODEL_CANVAS && AI_CANVAS ? '' : next;
    saveCfg();
    log('使えなくなった ' + used + ' の代わりに ' + next + ' を使う');
    return await aiAskFocus(pid, true);
  }
}
async function aiAskFocusOnce(pid){
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + aiModelNow() +
              ':generateContent?key=' + aiKeyNow();
  const payload = {
    contents: [{parts: [{text: aiBoardText(pid)}]}],
    generationConfig: {
      responseMimeType: 'application/json',
      responseSchema: {type:'OBJECT', properties:{
        focus:  {type:'STRING', enum: Object.keys(AI_FOCUS)},
        reason: {type:'STRING'}
      }, required:['focus']}
    }
  };
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 12000);
  try{
    const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
                                  body: JSON.stringify(payload), signal: ctl.signal});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const c = data.candidates && data.candidates[0];
    const text = c && c.content && c.content.parts && c.content.parts[0] && c.content.parts[0].text;
    if(!text) throw new Error('空の返事');
    const obj = JSON.parse(text);
    if(!AI_FOCUS[obj.focus]) throw new Error('知らない方針：' + obj.focus);
    return obj;
  } finally { clearTimeout(timer); }
}
async function aiPlanTurn(pid){
  const p = G.players[pid];
  if(!p || p.lv !== 'ai' || G.aiOff) return;
  if(!aiUsable()){
    G.aiOff = true;
    log('AIのキーが無いので、この局は' + LEVEL_JA.strong + 'として進める');
    return;
  }
  try{
    const r = await aiAskFocus(pid);
    p.aiFocus = r.focus;
    const why = r.reason ? '（' + String(r.reason).slice(0, 30) + '）' : '';
    log(p.name + 'は' + AI_FOCUS[r.focus].ja + 'を狙う' + why);
  }catch(e){
    p.aiFocus = null;
    G.aiOff = true;
    log('Geminiを使えないので、この局は' + LEVEL_JA.strong + 'として進める');
  }
}

/* 振る前の騎士。自分のタイルが盗賊で止まっているなら、振る前にどければ
   その手番の産出から戻る。人間側と同じ道（robberReturn）を通すので、
   盗賊を置いたあとは振る前の状態に戻り、そのまま続きが進む            */
function preRollKnightGain(pid){
  const p = G.players[pid];
  let pips = 0;
  G.hexes.forEach(h => {
    if(!h.robber || !h.number) return;
    h.vertices.forEach(vi => {
      const v = G.vertices[vi];
      if(v.building && v.building.owner === pid)
        pips += pipValue(h.number) * (v.building.type === 'city' ? 2 : 1);
    });
  });
  return pips;
}
async function cpuPreRollKnight(pid){
  const p = G.players[pid];
  if(!p || p.devPlayed || G.explore || G.seaSc === 'pirates') return false;
  const kc = p.dev.find(c => c.type === 'knight' && !c.fresh);
  if(!kc) return false;
  // 止められている見込みが小さいなら、振ったあとの判断に任せる
  if(preRollKnightGain(pid) < 3) return false;
  G.robberReturn = G.phase;              // 振る前に戻す
  removeDev(p, kc);
  await playKnight(p);
  await cpuPlaceThief(pid);
  return true;
}

async function cpuTurn(){
  if(G.phase === 'over') return;
  if(!G.players[G.turn] || !G.players[G.turn].cpu) return;
  G.level = G.players[G.turn].lv;
  G.cpuOffered = false;   // 人間への申し出は1手番に1回まで
  G.cpuDeals = 0;         // CPU同士の交渉の回数（つよいCPUは3回まで）
  await wait(450);
  if(expert(G.turn)) await cpuPreRollKnight(G.turn);
  if(G.phase === 'over') return;
  await rollDice();
  if(G.phase === 'over') return;
  if(G.phase === 'robber'){ await wait(500); await cpuRobber(); return; }
  await wait(450);
  if(G.players[G.turn] && G.players[G.turn].lv === 'ai') await aiPlanTurn(G.turn);
  if(G.phase === 'over') return;
  await cpuAction();
}

// 盗賊を置くタイルを選ぶ。相手の建物が多く、自分の建物がない所。
// つよいCPUは首位を優先し、手札を持っている相手から奪えるかも見る
function robberScore(hexId, pid){
  const h = G.hexes[hexId];
  if(!h || !h.land) return -1;
  let s = 0, mine = false, loot = 0;
  h.vertices.forEach(vi => {
    const v = G.vertices[vi];
    if(!v.building) return;
    if(v.building.owner === pid){ mine = true; return; }
    const own = G.players[v.building.owner];
    let w = (v.building.type === 'city' ? 2 : 1) * pipValue(h.number);
    if(smart(pid)) w *= 1 + 1.1 * (own.vp / Math.max(1, G.vpTarget));
    if(expOn(pid, 'robber')){
      // 勝利目前の相手はさらに重く止める
      if(own.vp >= G.vpTarget - 2) w *= 1.6;
      loot = Math.max(loot, handSize(own));
      /* つよいCPUは「点が近い」だけでなく「いま回っている」相手を止める。
         都市が多いほど、そして手札が厚いほど、止めたときの痛手が大きい      */
      const cityN = G.vertices.filter(v => v.building && v.building.owner === own.id &&
                                           v.building.type === 'city').length;
      w *= 1 + cityN * 0.18 + Math.min(handSize(own), 9) * 0.03;
    }
    s += w;
  });
  if(expOn(pid, 'robber')) s += Math.min(loot, 6) * 0.8;   // 奪える見込み
  return mine ? -1 : s;
}
function bestRobberHex(pid){
  // 盗賊は陸のタイルにしか置けない
  const cand = G.hexes.filter(h => h.land && !h.robber && !(G.seaSc && !sea8RobberOK(h)))
    .map(h => ({h, s: robberScore(h.id, pid)}))
    .sort((a, b) => b.s - a.s);
  return cand.length ? cand[0].h.id : null;
}

/* 海賊を置いて得か（P-1）。止められる相手の船と、奪える手札で見る。
   陸で止められる産出のほうが普通は大きいので、盗賊を既定にしておく     */
function bestPirateHex(pid){
  if(G.seaSc && !sea8PirateAllowed(pid)) return null;
  const cand = G.hexes.filter(h => !h.land && !h.pirate).map(h => {
    let s = 0, mine = false, loot = 0;
    G.edges.forEach(e => {
      if(e.ship === null || !e.hexes.includes(h.id)) return;
      if(e.ship === pid){ mine = true; return; }
      const own = G.players[e.ship];
      // 開いた船を止めると、その先の島へ渡れなくなる
      let w = shipIsOpen(e.id, e.ship) ? 2.2 : 1.0;
      if(smart(pid)) w *= 1 + 1.1 * (own.vp / Math.max(1, G.vpTarget));
      if(expOn(pid, 'robber') && own.vp >= G.vpTarget - 2) w *= 1.6;
      loot = Math.max(loot, handSize(own));
      s += w;
    });
    if(expOn(pid, 'robber')) s += Math.min(loot, 6) * .5;
    return {h, s: mine ? -1 : s};
  }).sort((a, b) => b.s - a.s);
  return cand.length ? cand[0] : null;
}
async function cpuPlaceThief(pid){
  const rob = bestRobberHex(pid);
  const pir = bestPirateHex(pid);
  // 海賊で止める価値が陸の何割かを超えたときだけ海へ出す
  const robScore = rob === null ? -1 : robberScore(rob, pid);
  if(pir && pir.s > 1.6 && pir.s > robScore * .9) await movePirate(pir.h.id, pid);
  else if(rob !== null) await moveRobber(rob, pid);
  else if(pir) await movePirate(pir.h.id, pid);
}
async function cpuRobber(){
  if(!G.players[G.turn] || !G.players[G.turn].cpu) return;
  const pid = G.turn;
  G.level = G.players[pid].lv;
  await cpuPlaceThief(pid);
}

async function cpuAction(){
  if(G.phase === 'over') return;
  if(!G.players[G.turn] || !G.players[G.turn].cpu) return;   // 人間の手番では動かさない
  if(G.explore){ await cpuActionX(); return; }
  const pid = G.turn, p = G.players[pid];
  G.level = p.lv;
  if(G.seaSc && await sea8Cpu(pid)){
    if(G.phase === 'over') return;
    render();
    await wait(650);
    await cpuAction();
    return;
  }
  let acted = false;

  // 0. 勝利に届くなら、その手を最優先で取る
  if(smart(pid)){
    const need = G.vpTarget - p.vp;
    // つよいCPUは2点の特別賞も勝ち筋に数える
    if(expOn(pid, 'winPath') && need <= 3){
      // 最長交易路：あと1〜2本で取れるなら、資源を作ってでも取りに行く
      if(need <= 2 && roadChase(pid) && validRoadSpots(pid).length){
        if(!canAfford(p, 'road')) tryTradeFor(p, 'road');
        if(canAfford(p, 'road')){
          const roads = validRoadSpots(pid);
          const scored = roads.map(ei => {
            const e = G.edges[ei];
            let s = 0;
            e.v.forEach(vi => {
              const v = G.vertices[vi];
              if(!v.building && !v.adj.some(a => G.vertices[a].building))
                s = Math.max(s, evalVertexFor(vi, pid));
            });
            return {ei, s};
          }).sort((a, b) => b.s - a.s);
          placeRoad(scored[0].ei, pid);
          if(G.phase === 'over') return;
          acted = true;
        }
      }
      // 最大騎士力：あと少しなら発展カードを買い足す
      if(!acted && need <= 2 && armyChase(p)){
        if(!canBuyDev(p)) tryTradeFor(p, 'dev');
        if(canBuyDev(p)){ buyDev(p); if(G.phase === 'over') return; acted = true; }
      }
    }
    /* 新しい島に建てる開拓地は「1点＋島の点」なので、都市より効くことがある。
       つよいCPUだけ、あと3点以内ならそこを最優先で取りに行く（航海者のシナリオのみ） */
    if(!acted && expert(pid) && G.seaSc && G.islandVP && need <= 1 + G.islandVP && p.stock.settlement > 0){
      const spots = validSettlementSpots(pid).filter(v => islandBonusFor(v, pid) > 0);
      if(spots.length){
        if(!canAfford(p, 'settlement')) tryTradeFor(p, 'settlement');
        if(canAfford(p, 'settlement')){
          placeSettlement(pickBest(spots.map(v => ({v, s: evalVertexFor(v, pid)})), pid).v, pid);
          if(G.phase === 'over') return;
          acted = true;
        }
      }
    }
    if(!acted && need <= 2){
      // 都市は2点、開拓地は1点。届く方を先に試す
      if(need <= 2 && p.stock.city > 0 && validCitySpots(pid).length){
        if(!canAfford(p, 'city')) tryTradeFor(p, 'city');
        if(canAfford(p, 'city')){
          placeCity(pickBest(validCitySpots(pid).map(v => ({v, s: cityValue(v, pid)})), pid).v, pid);
          if(G.phase === 'over') return;
          acted = true;
        }
      }
      if(!acted && need <= 1 && p.stock.settlement > 0 && validSettlementSpots(pid).length){
        if(!canAfford(p, 'settlement')) tryTradeFor(p, 'settlement');
        if(canAfford(p, 'settlement')){
          placeSettlement(pickBest(validSettlementSpots(pid).map(v => ({v, s: evalVertexFor(v, pid)})), pid).v, pid);
          if(G.phase === 'over') return;
          acted = true;
        }
      }
      // 勝利点カードで届く可能性に賭ける
      if(!acted && canBuyDev(p)){ buyDev(p); if(G.phase === 'over') return; acted = true; }
    }
  }

  // 0.5 つよいCPUは、あと少しで建てられるものを交易で成立させる
  if(expert(pid)){
    const late = isLate(p);
    // 船も交易の対象に入れる。島の2点は都市化と同じ重さなので序盤から狙う
    const order = late ? ['city', 'settlement', 'ship', 'road']
                       : ['settlement', 'ship', 'city', 'road'];
    for(const t of order){
      if(t === 'city'       && (p.stock.city === 0       || !validCitySpots(pid).length)) continue;
      if(t === 'settlement' && (p.stock.settlement === 0 || !validSettlementSpots(pid).length)) continue;
      if(t === 'ship'       && !wantsShip(p)) continue;
      if(t === 'road'       && (p.stock.road === 0       || !validRoadSpots(pid).length)) continue;
      if(canAfford(p, t)) break;                 // すでに建てられるなら交易不要
      if(t === 'road' && !late) continue;         // 街道のために資源を崩さない
      // 交易所は必ず損をするので、まず相手との交渉で足りない1枚を埋める
      if(expert(pid) && await negotiateForBuild(p, pid, t)){
        if(canAfford(p, t)) break;
      }
      if(tryTradeFor(p, t)){ render(); await wait(600); break; }
    }
  }

  // 1〜2. 都市化と開拓地。
  // つよいCPUは序盤だけ開拓地を先に置く（置ける角は先に取らないと無くなる。
  // 都市は同じ角をいつでも伸ばせるので、盤面が埋まる前の開拓地の方が取り返しがつかない）
  const sSpots = () => (p.stock.settlement > 0 ? validSettlementSpots(pid) : []);
  const cSpots = () => (p.stock.city > 0 ? validCitySpots(pid) : []);
  const buildCity = () => {
    const spots = cSpots();
    if(!spots.length) return false;
    placeCity(pickBest(spots.map(v => ({v, s: cityValue(v, pid) * (smart(pid) ? tuneOf(pid, 'cityBias') : 1)})), pid).v, pid);
    return true;
  };
  const buildSettlement = () => {
    const spots = sSpots();
    if(!spots.length) return false;
    const evalAt = v => expOn(pid, 'setup') ? evalSetupVertex(v, pid) : evalVertexFor(v, pid);
    placeSettlement(pickBest(spots.map(v => ({v, s: evalAt(v)})), pid).v, pid);
    return true;
  };
  /* 島へ渡る判断。いま本島に置ける場所が平凡で、船を継げば島の2点が取れるなら、
     開拓地より先に航路へ資源を回す。ここを入れないと本島に閉じこもる     */
  const islandFirst = (() => {
    if(!wantsShip(p) || p.stock.ship === 0) return false;
    const best = sSpots().reduce((m, v) => Math.max(m, evalVertexFor(v, pid)), 0);
    // 産出が細いほど、本島の平凡な角を見送って航路に回す
    const bar = (smart(pid) ? 16 : 12) + 10 * thinProduction(pid);
    return best < bar;
  })();
  const settleFirst = expOn(pid, 'settleFirst') && !isLate(p) && sSpots().length > 0 && !islandFirst;
  if(!acted && settleFirst && canAfford(p, 'settlement')){
    if(buildSettlement()){ if(G.phase === 'over') return; acted = true; }
  }
  if(!acted && canAfford(p, 'city')){
    if(buildCity()){ if(G.phase === 'over') return; acted = true; }
  }
  // 島を狙っている間は、平凡な角に開拓地を置くより先に航路を継ぐ
  if(!acted && !islandFirst && canAfford(p, 'settlement')){
    if(buildSettlement()){ if(G.phase === 'over') return; acted = true; }
  }
  /* 2.6 行き止まりの船を置き直す（S-5）。1手番に1隻だけ。
         ふつう以上のCPUだけが使う。よわいCPUは伸ばすだけにする        */
  if(!acted && smart(pid) && !p.shipMoved){
    const mv = bestShipMove(pid);
    if(mv){ moveShip(mv.from, mv.to, pid); acted = true; }
  }
  /* 2.7 航路（船）。新しい島の2点が大きいので、街道より先に見る。
         経路の1本目が船なら、そこへ伸ばす                              */
  if(!acted && p.stock.ship > 0 && canAfford(p, 'ship')){
    const ships = validShipSpots(pid);
    if(ships.length){
      const plan = planRoute(pid);
      const first = plan && plan.path[0];
      if(first && first.kind === 'ship' && ships.includes(first.ei) && plan.score > 3){
        placeShip(first.ei, pid);
        acted = true;
      } else {
        /* 目標が定まらないときは、まだ入植していない島へ近づく向きに出す。
           隣の交差点だけを見ると、2〜3辺かかる航路がいつまでも始まらない  */
        const targets = G.vertices.filter(v =>
          v.land && !v.building && !v.adj.some(a => G.vertices[a].building) &&
          islandBonusFor(v.id, pid) > 0);
        const scored = ships.map(ei => {
          const e = G.edges[ei];
          const a = G.vertices[e.v[0]], b = G.vertices[e.v[1]];
          const mx = (a.x + b.x) / 2, mz = (a.z + b.z) / 2;
          let s = 0;
          e.v.forEach(vi => {
            const v = G.vertices[vi];
            if(v.land && !v.building && !v.adj.some(x => G.vertices[x].building))
              s = Math.max(s, evalVertexFor(vi, pid));
          });
          // 島に近いほど高く。1辺ぶん（約1.7）進むごとに目減りさせる
          let near = 0;
          targets.forEach(v => { near = Math.max(near, 13 / (1 + hyp(v.x - mx, v.z - mz) / 1.7)); });
          return {ei, s: s + near};
        });
        const pick = pickBest(scored, pid);
        if(pick.s > (smart(pid) ? 5 : 0)){ placeShip(pick.ei, pid); acted = true; }
      }
    }
  }
  // 2.8 島を待っていたが船を出せなかったとき。手が止まらないよう普通に建てる
  if(!acted && islandFirst && canAfford(p, 'settlement')){
    if(buildSettlement()){ if(G.phase === 'over') return; acted = true; }
  }
  // 3. 街道（良い開拓地予定地へ伸ばす）
  if(!acted && p.stock.road > 0 && canAfford(p, 'road')){
    const roads = validRoadSpots(pid);
    if(roads.length){
      const scored = roads.map(ei => {
        const e = G.edges[ei];
        let s = 0;
        e.v.forEach(vi => {
          const v = G.vertices[vi];
          if(!v.building && !v.adj.some(a => G.vertices[a].building))
            s = Math.max(s, evalVertexFor(vi, pid));
        });
        return {ei, s};
      });
      // 最長交易路まであと1〜2本なら、2点を取りに行く（つよいCPUのみ）
      const perR = personaOf(pid);
      if((expOn(pid, 'roadRace') || aiFocusOf(pid) === 'road' || (perR && perR.race)) && roadChase(pid)){
        const best = scored.slice().sort((a, b) => b.s - a.s)[0];
        placeRoad(best.ei, pid);
        acted = true;
      }
      // つよいCPUは目標の交差点を定め、そこへ向かう経路の最初の1本を敷く
      if(!acted && expert(pid)){
        const plan = planRoute(pid);
        const first = plan && plan.path[0];
        if(first && first.kind === 'road' && roads.includes(first.ei) &&
           plan.score > (isLate(p) ? 4 : 5)){
          placeRoad(first.ei, pid);
          acted = true;
        }
      }
      if(!acted){
        const pick = pickBest(scored, pid);
        // 伸ばす先に見込みがないなら街道を敷かず資源を温存する。
        // つよいCPUはこの線引きを厳しくして、余った木とレンガを都市化の側に残す
        let floor = smart(pid) ? (isLate(p) ? tuneOf(pid, 'roadFloorLate') : tuneOf(pid, 'roadFloorEarly')) : 0;
        if(expOn(pid, 'roadBar')) floor = isLate(p) ? 8 : 11;
        // ただし手札が捨て札の危険域なら、敷いておく方が得
        if(expOn(pid, 'antiDiscard') && handSize(p) >= 8) floor = 0;
        if(pick.s > floor){ placeRoad(pick.ei, pid); acted = true; }
      }
    }
  }
  // 3.5 発展カードを使う（1手番に1枚）
  if(!acted && !p.devPlayed){
    const has = t => p.dev.find(c => c.type === t && !c.fresh);
    // 騎士：最大騎士力が狙えるか、相手の産出を止めたいとき
    const kc = has('knight');
    // 自分の産出が盗賊に止められている、最大騎士力に届く、または相手の首位を止めたい
    const robbedMine = G.hexes.some(h => h.robber &&
      h.vertices.some(vi => { const v = G.vertices[vi];
        return v.building && v.building.owner === pid; }));
    const armyReach = p.knights + 1 >= ARMY_MIN &&
      (G.armyId !== pid) && (p.knights + 1 > (G.armyId === null ? ARMY_MIN - 1 : G.armyCount));
    const leaderClose = G.players.some(o => o.id !== pid && o.vp >= G.vpTarget - 2);
    // つよいCPUは最大騎士力を数えているので、届く見込みがあるうちは積極的に切る
    const play = expOn(pid, 'army')
      ? (robbedMine || armyReach || leaderClose || armyChase(p))
      : smart(pid)
        ? (robbedMine || armyReach || leaderClose)
        : (p.knights + 1 >= ARMY_MIN || rng() < .5);
    if(kc && play && G.seaSc !== 'pirates'){
      removeDev(p, kc);
      await playKnight(p);
      // moveRobber がこの手番の続きを進めるので、ここで連鎖を終える
      await cpuPlaceThief(pid);
      return;
    }
    // 独占：いちばん多く集められる資源を選ぶ
    if(!acted){
      const mc = has('monopoly');
      if(mc){
        const totals = {};
        RES.forEach(r => { totals[r] = G.players.reduce((a, o) => a + (o.id === pid ? 0 : o.res[r]), 0); });
        let best = RES.slice().sort((a, b) => totals[b] - totals[a])[0];
        let okToPlay = totals[best] >= 3;
        if(expert(pid)){
          /* つよいCPUは独占を安売りしない。
             ・その場で開拓地か都市が建つなら、枚数が少なくても撃つ
             ・そうでなければ5枚以上たまるまで待つ                       */
          const byBuild = RES.filter(r => totals[r] >= 2)
            .map(r => ({r, gain: buildableWith(p, pid, {[r]: totals[r]}), n: totals[r]}))
            .sort((a, b) => (b.gain - a.gain) || (b.n - a.n))[0];
          if(byBuild && byBuild.gain > 0){ best = byBuild.r; okToPlay = true; }
          else okToPlay = totals[best] >= 5;
        }
        if(okToPlay){
          removeDev(p, mc); p.devPlayed = true;
          // カードを見せてから資源を集める。どちらが原因か分かる順にする
          await showDevPlay(p, 'monopoly', monopolyText(best));
          applyMonopoly(p, best);
          render();
          await lastFly;
          acted = true;
        }
      }
    }
    // 収穫：足りない資源を2枚もらう
    if(!acted){
      const yc = has('plenty');
      if(yc){
        const lack = shortfall(p);
        const want = Object.keys(lack).filter(r => G.bank[r] > 0);
        /* つよいCPUは、2枚もらって実際に建つときに使う。
           建たないなら、手札が溢れそうなときか終盤まで取っておく        */
        let useNow = want.length > 0;
        if(expert(pid) && want.length){
          const two = {};
          Object.entries(lack).forEach(([r, n]) => {
            for(let i = 0; i < n && Object.values(two).reduce((a, b) => a + b, 0) < 2; i++)
              if(G.bank[r] > 0) two[r] = (two[r] || 0) + 1;
          });
          useNow = buildableWith(p, pid, two) > 0 || isLate(p) || handSize(p) >= 7;
        }
        if(useNow && want.length){
          const picks = [];
          Object.entries(lack).forEach(([r, n]) => {
            for(let i = 0; i < n && picks.length < 2; i++) if(G.bank[r] > 0) picks.push(r);
          });
          while(picks.length < 2){
            const r = RES.filter(x => G.bank[x] > 0).sort((a, b) => resValue(p, b) - resValue(p, a))[0];
            if(!r) break;
            picks.push(r);
          }
          if(picks.length){
            removeDev(p, yc); p.devPlayed = true;
            await showDevPlay(p, 'plenty', plentyText(picks));
            applyPlenty(p, picks);
            render();
            await lastFly;
            acted = true;
          }
        }
      }
    }
    // 街道建設：伸ばす先があるとき
    if(!acted){
      const rc = has('road');
      /* つよいCPUの使い時：
         ・無償の2本で最長交易路（2点）が取れるなら最優先
         ・取れないなら、伸ばした先に見込みのある角があるときだけ使う
         ・どちらでもなければ温存する（終盤や手札が溢れそうなときは使う）    */
      let roadOK = !!(rc && p.stock.road > 0 && validRoadSpots(pid).length);
      if(roadOK && expert(pid)){
        const spots0 = validRoadSpots(pid);
        const bestSpot = spots0.reduce((m, ei) => {
          const e = G.edges[ei];
          let sc = 0;
          e.v.forEach(vi => {
            const v = G.vertices[vi];
            if(!v.building && !v.adj.some(a => G.vertices[a].building))
              sc = Math.max(sc, evalVertexFor(vi, pid));
          });
          return Math.max(m, sc);
        }, 0);
        const need = Math.max(LONGEST_MIN, (G.longestLen || 0) + 1) - longestRoadLen(pid);
        const grabLongest = G.longestId !== pid && need > 0 && need <= 2;
        roadOK = grabLongest || bestSpot >= 6 || isLate(p) || handSize(p) >= 8;
      }
      if(roadOK){
        removeDev(p, rc); p.devPlayed = true;
        G.freeRoads = Math.min(2, p.stock.road);
        log(`${p.name}が街道建設を使った`);
        await showDevPlay(p, 'road', `街道を${G.freeRoads}本、無償で敷く`);
        while(G.freeRoads > 0){
          const spots = validRoadSpots(pid);
          if(!spots.length || p.stock.road === 0) break;
          const scored = spots.map(ei => {
            const e = G.edges[ei];
            let sc = 0;
            e.v.forEach(vi => {
              const v = G.vertices[vi];
              if(!v.building && !v.adj.some(a => G.vertices[a].building))
                sc = Math.max(sc, evalVertexFor(vi, pid));
            });
            if(expert(pid)){
              // その辺を敷いたら自分の交易路が何本になるかを見る（2点に直結する）
              const before = longestRoadLen(pid);
              e.road = pid;
              const after = longestRoadLen(pid);
              e.road = null;
              sc += Math.max(0, after - before) * 4;
            }
            return {ei, s: sc};
          });
          placeRoad(pickBest(scored, pid).ei, pid);
          if(G.phase === 'over') return;
        }
        G.freeRoads = 0;
        acted = true;
      }
    }
  }

  // 3.7 発展カードを買う（建てるあてがないとき）
  // つよいCPUは最大騎士力を「安い2点」として明示的に追う
  if(!acted && canBuyDev(p)){
    const noBuild = !validSettlementSpots(pid).length || p.stock.settlement === 0;
    const aiF = aiFocusOf(pid);
    const perD = personaOf(pid);
    const knightLove = perD && perD.knightLove;
    const quirkDev = (perD && G.players[pid].quirk) ? G.players[pid].quirk.devAdd : 0;
    // 倹約家は、あと少しで建つ手番に発展カードへ資源を流さない
    const holdForBuild = perD && perD.saveForBuild && shortToBuild(p, pid) <= 2;
    const devProb = aiF ? AI_FOCUS[aiF].dev
                  : (perD && perD.dev !== undefined) ? Math.min(.95, Math.max(.05, perD.dev + quirkDev))
                  : Math.min(.95, Math.max(.05, (EXPT.devProb === null ? .45 : EXPT.devProb) + quirkDev));
    const want = !holdForBuild && (knightLove ? true : expOn(pid, 'army')
      ? (noBuild || isLate(p) || armyChase(p) || rng() < devProb)
      : (rank(G.level) >= 1 ? (noBuild || isLate(p) || rng() < .35) : rng() < .3));
    if(want){
      buyDev(p);
      acted = true;
    }
  }

  // 4. 人間へ交渉を持ちかける（過不足から中身を組み立てる）
  const humanCap = expert(pid) ? 3 : 1;
  if(!acted && (G.cpuDeals || 0) < humanCap && !(!expert(pid) && G.cpuOffered) &&
     G.players.some(x => !x.cpu)){
    const lack = shortfall(p);
    const need = neededResource(p);
    // 手札の中身は見えないので、盤上の産出から持っていそうな人を選ぶ
    const humans = G.players.filter(x => !x.cpu);
    const human = humans.length ? likelyHolder(need, humans) : null;
    const surplusList = RES.filter(r => r !== need && !lack[r] && p.res[r] >= 2)
                           .sort((a, b) => (p.res[b] - (lack[b] || 0)) - (p.res[a] - (lack[a] || 0)));
    if(need && surplusList.length && human){
      G.cpuDeals = (G.cpuDeals || 0) + 1;
      if(!expert(pid)) G.cpuOffered = true;
      // 欲しい枚数は不足分（最大2枚）
      const wantN = Math.max(1, Math.min(2, lack[need] || 1));
      const wants = {[need]: wantN};
      // 出す枚数は、どれだけ欲しいかで変える
      const urgency = smart(pid) ? resValue(p, need) : 1.4;
      const gives = {};
      let budget = Math.max(1, Math.round(wantN * (urgency >= 2.4 ? 2 : urgency >= 1.6 ? 1.5 : 1)));
      for(const r of surplusList){
        if(budget <= 0) break;
        const give = Math.min(budget, Math.max(1, p.res[r] - (lack[r] || 0) - 1));
        if(give <= 0) continue;
        gives[r] = give;
        budget -= give;
      }
      if(!Object.keys(gives).length){ gives[surplusList[0]] = 1; }
      log(`${p.name}が${human.name}に交渉を持ちかけた：${bundleText(gives)} ↔ ${bundleText(wants)}`);
      render();
      if(isHotSeat()) await passDevice(human, `${p.name}からの提案です。端末を${human.name}に渡してください。`);
      lastHumanId = human.id;
      // 求められた資源を持っていないなら、設定に従って自動で断る（毎回きくと煩わしい）
      const canAnswer = canPay(human, wants);
      const ans = (!canAnswer && netPref(human.id, 'autoNo'))
        ? (log(`${human.name}は出せる資源がなく断った`), 'no')
        : await askHuman(p, gives, wants);
      if(ans === 'yes'){
        execTrade(p, human, gives, wants);
        await lastFly;
        showGain(gives);
        acted = true;
      } else if(ans === 'counter'){
        // 相手の提案を裏返して初期値に入れ、こちらから条件を返す
        const done = await openNego({to: p.id, give: wants, get: gives, depth: 1});
        if(done) acted = true;
      } else log('あなたは断った');
      render();
      await wait(450);
    }
  }

  // 4.2 CPU同士でも交渉する。
  // 公式ルールでは手番の人は誰とでも交易できるのに、以前はCPU同士が一切交換せず、
  // 銀行の4:1しか使えていなかった。段位によらず全員が持ちかける。
  // 受けるかどうかの基準（margin）は段位ごとに違うので、交換の巧拙には差が出る
  const dealCap = expert(pid) ? 3 : 1;
  if(!acted && EXP.cpuTrade && (G.cpuDeals || 0) < dealCap && !(!expert(pid) && G.cpuOffered)){
    const need = neededResource(p);
    const lack = shortfall(p);
    if(need){
      const spareOf = r => p.res[r] - (lack[r] || 0) - (r === need ? 0 : 1);
      const surplus = RES.filter(r => r !== need && spareOf(r) > 0)
                         .sort((a, b) => spareOf(b) - spareOf(a));
      const partners = G.players.filter(o => o.id !== pid && o.cpu && o.res[need] > 0);
      let dealt = false;
      for(const o of partners){
        if(dealt) break;
        const wants = {[need]: Math.min(Math.max(1, Math.min(2, lack[need] || 1)), o.res[need])};
        // 出す枚数は少ない方から試し、相手が乗る最小の条件で成立させる
        for(let budget = 1; budget <= 3 && !dealt; budget++){
          const gives = {};
          let left = budget;
          for(const r of surplus){
            if(left <= 0) break;
            const n = Math.min(left, spareOf(r));
            if(n <= 0) continue;
            gives[r] = n; left -= n;
          }
          if(left > 0 || !Object.keys(gives).length) continue;
          const saved = G.level;
          const ok = cpuAcceptsTrade(o, gives, wants, p);
          G.level = saved;                       // 判定で書き換わるので戻す
          if(ok){
            execTrade(p, o, gives, wants);
            await lastFly;
            G.cpuDeals = (G.cpuDeals || 0) + 1;
            if(!expert(pid)) G.cpuOffered = true;
            acted = dealt = true;
          }
        }
      }
    }
  }

  // 4.5 手札を8枚未満に減らす（7が出ると半分失うため）。
  // 実測で1試合あたり6〜7枚を捨て札で失っていたので、つよいCPUはここを徹底する
  if(!acted && smart(pid)){
    const total = handSize(p);
    if(total >= 8){
      if(canBuyDev(p)){ buyDev(p); acted = true; }
      else {
        // 建設に近づく形で交換しておく
        const order = expOn(pid, 'hand') ? ['city', 'settlement', 'road', 'dev'] : ['city', 'settlement', 'road'];
        for(const t of order){
          if(t === 'city' && !validCitySpots(pid).length) continue;
          if(t === 'settlement' && !validSettlementSpots(pid).length) continue;
          if(t === 'road' && !validRoadSpots(pid).length) continue;
          if(tryTradeFor(p, t)){ acted = true; break; }
        }
      }
      // それでも減らないなら、価値の低い街道でも敷いて手札を吐き出す
      if(!acted && expOn(pid, 'antiDiscard') && p.stock.road > 0 && canAfford(p, 'road')){
        const roads = validRoadSpots(pid);
        if(roads.length){
          const scored = roads.map(ei => {
            const e = G.edges[ei];
            let s = 0;
            e.v.forEach(vi => {
              const v = G.vertices[vi];
              if(!v.building && !v.adj.some(a => G.vertices[a].building))
                s = Math.max(s, evalVertexFor(vi, pid));
            });
            return {ei, s};
          }).sort((a, b) => b.s - a.s);
          placeRoad(scored[0].ei, pid);
          acted = true;
        }
      }
    }
  }

  // 5. 銀行との交易（余剰資源を不足資源へ）
  if(!acted && !(smart(pid) && !TUNE.genericTrade)){
    const need = neededResource(p);
    if(need){
      for(const give of RES){
        if(give === need) continue;
        const rate = tradeRate(p, give);
        if(p.res[give] >= rate + 1){
          if(G.bank[need] < 1) continue;
          p.res[give] -= rate; G.bank[give] += rate;
          p.res[need]++;      G.bank[need]--;
          log(`${p.name}が${RES_JA[give]}${rate}枚を${RES_JA[need]}に交換した`);
          render();
          await wait(700);
          await cpuAction();
          return;
        }
      }
    }
  }
  if(G.phase === 'over') return;
  render();
  if(acted){ await wait(750); await cpuAction(); }
  else { await wait(500); await endTurn(); }
}

// カードの説明は1行に収めたいので、資源の並びを短く書く
function plentyText(picks){
  const c = {};
  picks.forEach(r => { c[r] = (c[r] || 0) + 1; });
  const ks = Object.keys(c);
  return ks.length === 1
    ? `${RES_ICON[ks[0]]}${RES_JA[ks[0]]}を${c[ks[0]]}枚もらう`
    : ks.map(r => RES_ICON[r] + RES_JA[r]).join('と') + 'をもらう';
}
const monopolyText = r => `全員の${RES_ICON[r]}${RES_JA[r]}を集める`;

// 収穫：好きな資源を2枚。独占：1種を全員から集める
function applyPlenty(p, picks){
  const moves = [];
  picks.forEach(r => {
    if(G.bank[r] > 0){ p.res[r]++; G.bank[r]--; moves.push({res:r, n:1, from:'bank', to:p.id}); }
  });
  log(`${p.name}が収穫で${picks.map(r => RES_JA[r]).join('・')}を得た`);
  flyBetween(moves);            // 進行を止めない。待つ側は lastFly を await する
}
function applyMonopoly(p, res){
  let got = 0;
  const moves = [];
  G.players.forEach(o => {
    if(o.id === p.id) return;
    if(o.res[res] > 0) moves.push({res, n:o.res[res], from:o.id, to:p.id});
    got += o.res[res]; p.res[res] += o.res[res]; o.res[res] = 0;
  });
  log(`${p.name}が独占で${RES_JA[res]}を${got}枚集めた`);
  flyBetween(moves);
  return got;
}

/* ============================================================
   交渉
   ============================================================ */
// まだ入植していない島が残っていて、そこへ船で近づけるか
function wantsShip(p){
  if(p.stock.ship === 0 || !validShipSpots(p.id).length) return false;
  return G.seaSc ? sea8WantsShip(p) : islandTargets(p.id).length > 0;
}
// 次に建てたいものに足りない資源を数える
function shortfall(p){
  if(G.explore) return shortfallX(p);
  const need = {};
  const targets = ['city', 'settlement', 'ship', 'road'];
  for(const t of targets){
    if(t === 'city' && (p.stock.city === 0 || !validCitySpots(p.id).length)) continue;
    if(t === 'settlement' && (p.stock.settlement === 0 || !validSettlementSpots(p.id).length)) continue;
    if(t === 'ship' && !wantsShip(p)) continue;      // 島が残っているときだけ船を欲しがる
    if(t === 'road' && (p.stock.road === 0 || !validRoadSpots(p.id).length)) continue;
    Object.entries(COST[t]).forEach(([r, n]) => {
      const lack = Math.max(0, n - p.res[r]);
      if(lack > 0) need[r] = Math.max(need[r] || 0, lack);
    });
  }
  return need;
}

// 港や銀行で他の資源に換えられる枚数（その資源自身は除く）
function convertibleCards(p, exclude){
  let n = 0;
  RES.forEach(r => {
    if(r === exclude) return;
    n += Math.floor(p.res[r] / tradeRate(p, r));
  });
  return n;
}

/* 次の一手にどれだけ近づくか。残り1枚で建つものに使える資源ほど高く見る。
   盤面の走査は重いので、駒の在庫だけで判定する軽い見積もりにしている。   */
function proximityBonus(p, r){
  const targets = [
    {cost: COST.city,       worth: 2.0, ok: p.stock.city > 0},
    {cost: COST.settlement, worth: 1.6, ok: p.stock.settlement > 0},
    {cost: COST.ship,       worth: 1.5, ok: wantsShip(p)},      // 島の2点ぶん重く見る
    {cost: DEV_COST,        worth: 1.2, ok: G.deck.length > 0},
    {cost: COST.road,       worth: 0.7, ok: p.stock.road > 0}
  ];
  let best = 0;
  for(const t of targets){
    if(!t.ok || !t.cost[r]) continue;
    if(p.res[r] >= t.cost[r]) continue;         // その資源はもう足りている
    let missing = 0;
    Object.entries(t.cost).forEach(([rr, n]) => { missing += Math.max(0, n - p.res[rr]); });
    if(missing === 0) continue;                 // すでに建てられるものは対象外
    let b = t.worth / missing;                  // 残り1枚なら大きく、遠いほど小さい
    // 港や銀行で自力で揃えられるなら、そこまで欲しがらない
    if(convertibleCards(p, r) >= missing) b *= .5;
    if(b > best) best = b;
  }
  return best;
}

/* 盤上の建物から、その人がその資源をどれだけ産み出しているかを見積もる。
   出目の出やすさ（pip）で重みを付け、都市は2倍、盗賊で止まっているタイルは除く。 */
function productionRate(pid, res){
  let rate = 0;
  G.vertices.forEach(v => {
    if(!v.building || v.building.owner !== pid) return;
    const mult = v.building.type === 'city' ? 2 : 1;
    v.hexes.forEach(hi => {
      const h = G.hexes[hi];
      if(h.robber || !h.number) return;
      if(TILE_RES[h.type] !== res) return;
      rate += pipValue(h.number) * mult;      // 8なら5、12なら1
    });
  });
  return rate;
}

// その資源を持っていそうな相手を見積もる（手札の中身は見ない）
function likelyHolder(res, candidates){
  const handSize = x => RES.reduce((n, r) => n + x.res[r], 0);
  return candidates.slice().sort((a, b) => {
    const d = productionRate(b.id, res) - productionRate(a.id, res);
    if(d !== 0) return d;
    return handSize(b) - handSize(a);         // 産出が同じなら手札の多い方
  })[0];
}

// CPUにとっての資源1枚の値打ち
function resValue(p, r){
  const need = shortfall(p);
  let v = smart(p.id) ? resWeight(p, r) : 1;
  if(smart(p.id)){
    v += proximityBonus(p, r) * 1.3;
    // 2:1の港があれば2枚で何にでも換えられる。捌きやすい資源ほど1枚の値打ちが高い
    v *= 1 + (4 - tradeRate(p, r)) * .10;
  }
  if(need[r]) v += 0.9 * Math.min(2, need[r]);
  if(p.res[r] === 0) v += 0.3;
  if(p.res[r] >= 5) v -= 0.35;
  return Math.max(0.25, v);
}
/* 資源の束の値打ち。同じ資源をたくさんもらっても価値は頭打ちになる。
   （枚数を積めば何でも通る、という交渉を防ぐ）                      */
function bundleValue(p, bundle, incoming){
  let total = 0;
  Object.entries(bundle).forEach(([r, n]) => {
    const base = resValue(p, r);
    for(let k = 0; k < n; k++){
      // もらう側は逓減、渡す側は逆に「手放すほど痛い」ので逓増させる
      const held = incoming ? p.res[r] + k : p.res[r] - k;
      let f = 1;
      // 港で捌ける資源は余っても腐りにくいので、減り方を緩める
      const decay = 0.72 + (4 - tradeRate(p, r)) * .06;
      if(incoming) f = powi(decay, Math.max(0, held - 1));   // すでに持っているほど安い
      else         f = held <= 2 ? 1.5 : 1;                      // 残りが少ない資源は手放したくない
      total += base * Math.max(.15, f);
    }
  });
  return total;
}

const bundleText = b => Object.entries(b).filter(([, n]) => n > 0)
  .map(([r, n]) => `${RES_JA[r]}${n}`).join('・') || 'なし';

function canPay(p, bundle){
  return Object.entries(bundle).every(([r, n]) => p.res[r] >= n);
}

// from が give を渡し、to が get を渡す
function execTrade(from, to, give, get){
  Object.entries(give).forEach(([r, n]) => { from.res[r] -= n; to.res[r] += n; });
  Object.entries(get).forEach(([r, n]) => { to.res[r] -= n; from.res[r] += n; });
  log(`${from.name}→${to.name}：${bundleText(give)} と ${bundleText(get)} を交換`);
  sfx('trade');
  // 何が誰から誰へ動いたかを、両方向まとめて見せる
  flyBetween(bundleMoves(give, from.id, to.id).concat(bundleMoves(get, to.id, from.id)));
}

// CPUが提案を受けるかどうか
function cpuAcceptsTrade(cpu, gains, gives, proposer){
  G.level = cpu.lv;          // 判断はその相手の強さで行う
  if(!canPay(cpu, gives)) return false;
  const totalGains = Object.values(gains).reduce((a, b) => a + b, 0);
  const totalGives = Object.values(gives).reduce((a, b) => a + b, 0);
  if(totalGains === 0 || totalGives === 0) return false;
  // 勝利目前の相手には手を貸さない
  const lead = smart(cpu.id) ? 2 : 1;
  if(proposer && proposer.vp >= G.vpTarget - lead) return false;

  if(smart(cpu.id)){
    // 渡したせいで、いま建てられるものが建てられなくなるなら断る
    const after = {...cpu.res};
    Object.entries(gives).forEach(([r, n]) => after[r] -= n);
    Object.entries(gains).forEach(([r, n]) => after[r] = (after[r] || 0) + n);
    const afford = (res, kind) => Object.entries(COST[kind]).every(([r, n]) => res[r] >= n);
    for(const kind of ['city', 'settlement', 'road']){
      if(afford(cpu.res, kind) && !afford(after, kind)) return false;
    }
    // 相手が都市化を狙えるなら、鉱石と小麦は渡さない
    if(proposer && (gives.ore || gives.grain)){
      const upgradable = G.vertices.filter(v =>
        v.building && v.building.owner === proposer.id && v.building.type === 'settlement').length;
      if(upgradable >= 2 && proposer.vp >= G.vpTarget - 4) return false;
    }
  }

  const gainV = bundleValue(cpu, gains, true);
  const giveV = bundleValue(cpu, gives, false);
  const lv = lvOf(cpu.id);
  // 段位が上ほど、自分に有利でないと応じない
  const perN = personaOf(cpu.id);
  if(perN && perN.noDeal) return false;
  const perA = personaOf(cpu.id);
  if(proposer && perA && perA.avoidTop){
    const top = Math.max(...G.players.map(x => x.vp));
    const alone = G.players.filter(x => x.vp === top).length === 1;
    if(alone && top >= G.vpTarget * 0.6 && proposer.vp === top){
      const g1 = bundleValue(cpu, gains, true), g2 = bundleValue(cpu, gives, false);
      if(g1 < g2 * 1.5) return false;
    }
  }
  const perM = personaOf(cpu.id);
  const margin = (perM && perM.margin !== undefined) ? perM.margin : [1.0, 1.12, 1.10][rank(lv)];
  return gainV >= giveV * margin;
}

// 断る場合でも、条件を変えれば飲める案を探す
function cpuCounter(cpu, gains, gives, proposer){
  const variants = [];
  // 相手が出す量を増やす案
  Object.keys(gains).forEach(r => {
    for(let add = 1; add <= 2; add++)
      variants.push({gains: {...gains, [r]: gains[r] + add}, gives: {...gives}});
  });
  // 自分が渡す量を減らす案
  Object.keys(gives).forEach(r => {
    for(let sub = 1; sub < gives[r]; sub++)
      variants.push({gains: {...gains}, gives: {...gives, [r]: gives[r] - sub}});
  });
  // 減らして0になるものは案から除く
  const clean = b => Object.fromEntries(Object.entries(b).filter(([, n]) => n > 0));
  for(const v of variants){
    const ga = clean(v.gains), gi = clean(v.gives);
    if(!Object.keys(ga).length || !Object.keys(gi).length) continue;
    if(!canPay(cpu, gi)) continue;
    if(cpuAcceptsTrade(cpu, ga, gi, proposer)) return {gains: ga, gives: gi};
  }
  return null;
}


// 目標の建設に足りない分を、余剰資源の交易で埋められるか試す
function tryTradeFor(p, target){
  // 'dev' は発展カード（COST に無いので別に引く）
  const cost = target === 'dev' ? DEV_COST : COST[target];
  if(!cost) return false;
  if(target === 'dev' && G.deck.length === 0) return false;
  const sim = {...p.res}, plan = [];
  for(const [r, n] of Object.entries(cost)){
    let lack = n - sim[r];
    while(lack > 0){
      // 目標コストを崩さない範囲で最も余っている資源を出す
      const donor = RES.filter(x => x !== r)
        .filter(x => sim[x] - (cost[x] || 0) >= tradeRate(p, x))
        .sort((a, b) => (sim[b] - (cost[b] || 0)) - (sim[a] - (cost[a] || 0)))[0];
      if(!donor || G.bank[r] < 1) return false;
      const rate = tradeRate(p, donor);
      sim[donor] -= rate; sim[r]++; lack--;
      plan.push([donor, rate, r]);
    }
  }
  if(!plan.length) return false;
  plan.forEach(([donor, rate, r]) => {
    p.res[donor] -= rate; G.bank[donor] += rate;
    p.res[r]++;           G.bank[r]--;
    log(`${p.name}が${RES_JA[donor]}${rate}枚を${RES_JA[r]}に交換した`);
  });
  return true;
}

/* 建てたい物に足りない資源を、相手との交渉で1〜2枚もらう。
   交易所は4:1（港でも3:1・2:1）で必ず損をするので、崩す前にこちらを試す。
   受けるかどうかは相手の段位の基準で決まる。1手番に1回まで。            */
async function negotiateForBuild(p, pid, target){
  const cap = expert(pid) ? 3 : 1;
  if((G.cpuDeals || 0) >= cap) return false;
  if(!expert(pid) && G.cpuOffered) return false;
  const cost = target === 'dev' ? DEV_COST : COST[target];
  if(!cost) return false;
  const lack = {};
  Object.entries(cost).forEach(([r, n]) => { if(p.res[r] < n) lack[r] = n - p.res[r]; });
  const needs = Object.keys(lack);
  if(!needs.length) return false;
  // 2種類以上足りないときは交渉1回では届かないので、交易所に任せる
  if(needs.length > 1) return false;
  const need = needs[0];
  // 目標に使わない資源から出す。手元に残す1枚は確保する
  const spareOf = r => p.res[r] - (cost[r] || 0);
  const surplus = RES.filter(r => r !== need && spareOf(r) > 0)
                     .sort((a, b) => spareOf(b) - spareOf(a));
  if(!surplus.length) return false;
  const partners = G.players.filter(o => o.id !== pid && o.cpu && o.res[need] >= lack[need]);
  for(const o of partners){
    const wants = {[need]: lack[need]};
    for(let budget = 1; budget <= 2; budget++){
      const gives = {};
      let left = budget;
      for(const r of surplus){
        if(left <= 0) break;
        const n = Math.min(left, spareOf(r));
        if(n <= 0) continue;
        gives[r] = n; left -= n;
      }
      if(left > 0 || !Object.keys(gives).length) continue;
      const saved = G.level;
      const ok = cpuAcceptsTrade(o, gives, wants, p);
      G.level = saved;
      if(ok){
        execTrade(p, o, gives, wants);
        G.cpuDeals = (G.cpuDeals || 0) + 1;
        if(!expert(pid)) G.cpuOffered = true;
        render();
        await wait(500);
        return true;
      }
    }
  }
  return false;
}

/* 倹約家の持ち味に使う。開拓地か都市まであと何枚か（交換で埋められる分も見る） */
function shortToBuild(p, pid){
  let best = 99;
  const kinds = [];
  if(p.stock.city > 0 && validCitySpots(pid).length) kinds.push('city');
  if(p.stock.settlement > 0 && validSettlementSpots(pid).length) kinds.push('settlement');
  for(const k of kinds){
    let missing = 0;
    Object.entries(COST[k]).forEach(([r, n]) => { missing += Math.max(0, n - p.res[r]); });
    if(missing === 0) return 0;
    const spare = RES.reduce((a, r) =>
      a + Math.floor(Math.max(0, p.res[r] - (COST[k][r] || 0)) / tradeRate(p, r)), 0);
    best = Math.min(best, Math.max(0, missing - spare));
  }
  return best;
}

/* その資源を n 枚もらったら、この手番に建てられるものが増えるか。
   発展カード（独占・収穫）の使い時を決めるために使う              */
function buildableWith(p, pid, add){
  const res = {...p.res};
  Object.entries(add).forEach(([r, n]) => { res[r] = (res[r] || 0) + n; });
  const can = (kind, r2) => Object.entries(COST[kind]).every(([r, n]) => r2[r] >= n);
  const kinds = [];
  if(p.stock.city > 0 && validCitySpots(pid).length) kinds.push('city');
  if(p.stock.settlement > 0 && validSettlementSpots(pid).length) kinds.push('settlement');
  let gain = 0;
  kinds.forEach(k => { if(!can(k, p.res) && can(k, res)) gain++; });
  return gain;
}

function neededResource(p){
  const targets = ['city','settlement','road'];
  for(const t of targets){
    if(t === 'city' && p.stock.city === 0) continue;
    if(t === 'settlement' && (p.stock.settlement === 0 || !validSettlementSpots(p.id).length)) continue;
    for(const [r, n] of Object.entries(COST[t])){
      if(p.res[r] < n) return r;
    }
  }
  return null;
}

// 毎フレームの頂点計算はしない。焼き込んだ濃淡と、texture.offset を
// ずらすだけのさざ波で質感を出す（頂点もマテリアルも作り直さない）
function makeSeaTexture(){
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(256, 256, 30, 256, 256, 262);
  g.addColorStop(0,   '#63dbdd');
  g.addColorStop(.18, '#3ec2d2');
  g.addColorStop(.42, '#1e93b6');
  g.addColorStop(.72, '#146a92');
  g.addColorStop(1,   '#0e4a70');
  x.fillStyle = g; x.fillRect(0, 0, 512, 512);
  // 深さのむら。ぼかした円を重ねるだけ
  for(let i = 0; i < 190; i++){
    const r = 18 + Math.random() * 96;
    const px = Math.random() * 512, py = Math.random() * 512;
    const light = Math.random() > .45;
    const gg = x.createRadialGradient(px, py, 0, px, py, r);
    gg.addColorStop(0, light ? 'rgba(180,250,255,.10)' : 'rgba(4,48,76,.12)');
    gg.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = gg;
    x.beginPath(); x.arc(px, py, r, 0, 7); x.fill();
  }
  const t = new THREE.CanvasTexture(c);
  // 島の周りだけを浅瀬の色にし、外側は端の深い色を引き伸ばして埋める
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  const SPAN = 190 / 46;
  t.repeat.set(SPAN, SPAN);
  t.offset.set(-(SPAN - 1) / 2, -(SPAN - 1) / 2);
  t.anisotropy = 4;
  return t;
}

// さざ波。継ぎ目が出ないよう同じ図形を上下左右に回り込ませて描く
function makeRippleTexture(){
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const x = c.getContext('2d');
  x.strokeStyle = 'rgba(255,255,255,.55)';
  const shapes = [];
  for(let i = 0; i < 60; i++){
    shapes.push([Math.random() * 256, Math.random() * 256,
                 9 + Math.random() * 30, 1.6 + Math.random() * 3,
                 (Math.random() - .5) * .7, .7 + Math.random() * 1.1]);
  }
  for(let ox = -256; ox <= 256; ox += 256){
    for(let oy = -256; oy <= 256; oy += 256){
      shapes.forEach(s => {
        x.lineWidth = s[5];
        x.beginPath();
        if(x.ellipse) x.ellipse(s[0] + ox, s[1] + oy, s[2], s[3], s[4], 0, 6.284);
        else x.arc(s[0] + ox, s[1] + oy, s[3], 0, 6.284);
        x.stroke();
      });
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(20, 20);
  return t;
}

function buildSea(){
  const wg = new THREE.PlaneGeometry(190, 190, 1, 1);
  wg.rotateX(-Math.PI / 2);
  water = new THREE.Mesh(wg, new THREE.MeshStandardMaterial({
    map: makeSeaTexture(), roughness: .34, metalness: .18
  }));
  water.position.y = -0.35;
  water.receiveShadow = false;   // 海面に島の影は落とさない
  scene.add(water);

  const rg = new THREE.PlaneGeometry(120, 120, 1, 1);
  rg.rotateX(-Math.PI / 2);
  ripple = new THREE.Mesh(rg, new THREE.MeshBasicMaterial({
    map: makeRippleTexture(), transparent: true, opacity: .06,
    depthWrite: false, blending: THREE.AdditiveBlending
  }));
  ripple.position.y = -0.33;
  ripple.renderOrder = 1;
  scene.add(ripple);
}

const numberTexCache = new Map();
function makeNumberTexture(n){
  if(numberTexCache.has(n)) return numberTexCache.get(n);
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#f2ead6';
  x.beginPath(); x.arc(128, 128, 126, 0, 7); x.fill();
  x.strokeStyle = 'rgba(96,78,48,.30)'; x.lineWidth = 5;
  x.beginPath(); x.arc(128, 128, 121, 0, 7); x.stroke();
  x.strokeStyle = 'rgba(96,78,48,.16)'; x.lineWidth = 2;
  x.beginPath(); x.arc(128, 128, 108, 0, 7); x.stroke();
  const hot = (n === 6 || n === 8);
  x.fillStyle = hot ? '#b23a22' : '#3a3226';

  numberTexCache.set(n, t);

}

const portTexCache = new Map();

  x.fill();
  x.strokeStyle = 'rgba(72,52,28,.5)'; x.lineWidth = 7; x.stroke();
  x.strokeStyle = 'rgba(120,92,52,.20)'; x.lineWidth = 2;
  for(let i = 1; i < 4; i++){
    x.beginPath(); x.moveTo(14, 24 + i * 36); x.lineTo(178, 24 + i * 36); x.stroke();
  }
  x.fillStyle = '#3a2c18';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = 'bold 48px ' + JP_FONT;
  x.fillText(label, 96, 74);
  x.font = 'bold 42px ' + JP_FONT;
  x.fillStyle = any ? '#4f6340' : '#8c4a24';
  x.fillText(rate, 96, 130);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 8;
  portTexCache.set(type, t);
  return t;
}
