// 同じ形でも1つずつ色を少しずらすと、量産感が消える
function varyColor(hex, dh, ds, dl){
  const c = new THREE.Color(hex);
  c.offsetHSL((Math.random() - .5) * (dh || .03),
              (Math.random() - .5) * (ds || .10),
              (Math.random() - .5) * (dl || .10));
  return c;
}

/* --- タイル内の配置 ---------------------------------------- */
// 数字トークンと建物を隠さないよう、中心と6つの頂点を避けて点を撒く
const HEX_NORM = [], HEX_CORNER = [];
for(let i = 0; i < 6; i++){
  const an = Math.PI / 3 * i;
  HEX_NORM.push([Math.cos(an), Math.sin(an)]);
  const ac = Math.PI / 180 * (60 * i - 30);
  HEX_CORNER.push([Math.cos(ac) * HEX_SIZE, Math.sin(ac) * HEX_SIZE]);
}
const HEX_IN = HEX_SIZE * Math.sqrt(3) / 2;

function inHex(dx, dz, shrink){
  const lim = HEX_IN * shrink;
  for(let i = 0; i < 6; i++)
    if(dx * HEX_NORM[i][0] + dz * HEX_NORM[i][1] > lim) return false;
  return true;
}

function spots(h, n, opt){
  opt = opt || {};
  const rMin   = opt.rMin   !== undefined ? opt.rMin   : .46;   // 数字トークンを空ける
  const corner = opt.corner !== undefined ? opt.corner : .40;   // 建物の場所を空ける
  const shrink = opt.shrink || .82;                             // 街道の上に乗せない
  const sep    = opt.sep || 0;
  const out = [];
  let guard = n * 45;
  while(out.length < n && guard-- > 0){
    const a = Math.random() * 6.2832, d = Math.sqrt(Math.random()) * .95;
    const dx = Math.cos(a) * d, dz = Math.sin(a) * d;
    if(d < rMin || !inHex(dx, dz, shrink)) continue;
    let bad = false;
    for(let i = 0; i < 6 && !bad; i++){
      const cx = HEX_CORNER[i][0] - dx, cz = HEX_CORNER[i][1] - dz;
      if(cx * cx + cz * cz < corner * corner) bad = true;
    }
    if(!bad && sep){
      for(let i = 0; i < out.length && !bad; i++){
        const ex = out[i][0] - dx, ez = out[i][1] - dz;
        if(ex * ex + ez * ez < sep * sep) bad = true;
      }
    }
    if(bad) continue;
    out.push([dx, dz]);
  }
  return out.map(p => [h.x + p[0], h.z + p[1]]);
}

const TOP_Y = 0.21;          // タイル上面。建物・街道・トークンの基準

// 装飾はここに貯めてから、形ごとに1つのInstancedMeshへまとめる
function newBins(){
  return {trunk:[], cone:[], wheat:[], bush:[], rock:[], peak:[], sheep:[], face:[]};
}
function pushInst(bin, x, y, z, sx, sy, sz, ry, color){
  bin.push({x, y, z, sx, sy, sz, rx:0, ry:ry || 0, rz:0, c:color});
}

function addInstanced(geo, list, receive){
  if(!list.length) return null;
  const im = new THREE.InstancedMesh(geo, M.decor, list.length);
  const mtx = new THREE.Matrix4(), q = new THREE.Quaternion();
  const e = new THREE.Euler(), p = new THREE.Vector3(), s = new THREE.Vector3();
  list.forEach((it, i) => {
    e.set(it.rx || 0, it.ry || 0, it.rz || 0);
    q.setFromEuler(e);
    p.set(it.x, it.y, it.z);
    s.set(it.sx, it.sy, it.sz);
    mtx.compose(p, q, s);
    im.setMatrixAt(i, mtx);
    im.setColorAt(i, it.c);
  });
  im.instanceMatrix.needsUpdate = true;
  if(im.instanceColor) im.instanceColor.needsUpdate = true;
  im.castShadow = true;
  im.receiveShadow = !!receive;
  boardGroup.add(im);
  own(im);
  return im;
}

// 針葉樹。幹1本と円錐3段。参考映像に合わせて小ぶりに、代わりに数を置く
function addTree(bins, x, z, s){
  const ry = Math.random() * 6.2832;
  pushInst(bins.trunk, x, TOP_Y, z, s, .17 * s, s, ry, varyColor(0x5b4128, .02, .08, .10));
  const col = varyColor(0x3d7c36, .05, .14, .16);
  // [高さ, 半径, 円錐の高さ]
  [[.11, .135, .27], [.25, .105, .23], [.39, .072, .21]].forEach(t => {
    pushInst(bins.cone, x, TOP_Y + t[0] * s, z,
             t[1] * 2 * s, t[2] * s, t[1] * 2 * s, ry, col);
  });
}

function tileDecor(h, bins){
  const rnd = (a, b) => a + Math.random() * (b - a);
  const bush = (x, z, s, wide, flat, hex) =>
    pushInst(bins.bush, x, TOP_Y + s * .30, z, s * wide, s * flat, s * wide * .92,
             Math.random() * 6.2832, varyColor(hex, .04, .12, .14));

  if(h.type === 'forest'){
    spots(h, 38, {sep:.125, rMin:.52}).forEach(p => addTree(bins, p[0], p[1], rnd(.78, 1.28)));
    spots(h, 12, {sep:.13}).forEach(p => bush(p[0], p[1], rnd(.11, .20), 1.6, 1.0, 0x3f6b30));
  } else if(h.type === 'fields'){
    // 麦は密に。畝を感じさせるため向きをそろえる
    const dir = Math.random() * 6.2832;
    spots(h, 150, {sep:.068, rMin:.44, shrink:.86, corner:.34}).forEach(p => {
      const s = rnd(.8, 1.25);
      pushInst(bins.wheat, p[0], TOP_Y, p[1], .082 * s, .23 * s, .082 * s,
               dir + (Math.random() - .5) * .4, varyColor(0xd9bc55, .03, .12, .12));
    });
    spots(h, 6, {sep:.22}).forEach(p => bush(p[0], p[1], rnd(.10, .17), 1.7, .9, 0x6d7f33));
  } else if(h.type === 'pasture'){
    spots(h, 10, {sep:.21}).forEach(p => {
      const s = rnd(.85, 1.15), ry = Math.random() * 6.2832;
      pushInst(bins.sheep, p[0], TOP_Y + .085 * s, p[1],
               .21 * s, .18 * s, .16 * s, ry, varyColor(0xf4f1e6, .01, .04, .04));
      pushInst(bins.face, p[0] + Math.cos(ry) * .10 * s, TOP_Y + .10 * s,
               p[1] - Math.sin(ry) * .10 * s,
               .09 * s, .09 * s, .09 * s, ry, varyColor(0x3b3630, .02, .06, .10));
    });
    spots(h, 18, {sep:.14}).forEach(p => bush(p[0], p[1], rnd(.10, .20), 1.7, 1.0, 0x4a7a33));
    spots(h, 7, {sep:.16}).forEach(p => {
      const s = rnd(.08, .16);
      pushInst(bins.rock, p[0], TOP_Y + s * .28, p[1], s * 1.6, s * 1.1, s * 1.5,
               Math.random() * 6.2832, varyColor(0x6d5942, .03, .10, .12));
    });
  } else if(h.type === 'hills'){
    // 丘陵：赤みの低木が連なって起伏に見えるよう、大小を混ぜて密に置く
    spots(h, 9, {sep:.23, rMin:.52}).forEach(p =>
      bush(p[0], p[1], rnd(.19, .27), 1.9, .85, 0xa8512b));
    spots(h, 22, {sep:.125}).forEach(p =>
      bush(p[0], p[1], rnd(.09, .17), 1.6, 1.05, 0x8a3f26));
    spots(h, 10, {sep:.15}).forEach(p => {
      const s = rnd(.07, .14);
      pushInst(bins.rock, p[0], TOP_Y + s * .28, p[1], s * 1.5, s, s * 1.4,
               Math.random() * 6.2832, varyColor(0x7a5b3e, .03, .10, .12));
    });
  } else if(h.type === 'mountains'){
    // 山：とがった岩峰を寄せて稜線をつくる。
    // 島の縁の岩は「丸くて茶色」なので、形（円錐）と色（青灰）の両方で分ける
    spots(h, 8, {sep:.20, rMin:.54, corner:.38, shrink:.86}).forEach(p => {
      // 裾を前後左右で変え、少し傾ける。そのままの円錐だと作り物に見える
      const w = rnd(.15, .26);
      bins.peak.push({x:p[0], y: TOP_Y - .06, z:p[1],
                      sx: w * 2 * rnd(.78, 1.25), sy: rnd(.34, .70), sz: w * 2 * rnd(.78, 1.25),
                      rx: (Math.random() - .5) * .34, ry: Math.random() * 6.2832,
                      rz: (Math.random() - .5) * .34,
                      c: varyColor(0x7f8b99, .025, .07, .22)});
    });
    // 裾の小岩。これも青灰にして、浜の岩と見分けがつくようにする
    spots(h, 16, {sep:.125}).forEach(p => {
      const s = rnd(.07, .15);
      pushInst(bins.rock, p[0], TOP_Y + s * .28, p[1], s * 1.5, s * 1.1, s * 1.4,
               Math.random() * 6.2832, varyColor(0x6c7683, .02, .06, .14));
    });
  } else if(h.type === 'spice'){
    // 香辛料の村：低木の畑。家と袋は上物（updateFeatureMesh）で置く
    spots(h, 20, {sep:.13}).forEach(p => bush(p[0], p[1], rnd(.09, .16), 1.5, 1.0, 0x7a8f2e));
    spots(h, 10, {sep:.16}).forEach(p => bush(p[0], p[1], rnd(.07, .12), 1.2, 1.3, 0xb2452a));
  } else if(h.type === 'gold'){
    // 金の川：岩場と、川床に光る金の粒
    spots(h, 16, {sep:.14}).forEach(p => {
      const s = rnd(.07, .15);
      pushInst(bins.rock, p[0], TOP_Y + s * .28, p[1], s * 1.5, s, s * 1.4,
               Math.random() * 6.2832, varyColor(0x7d6a4f, .03, .10, .12));
    });
    spots(h, 24, {sep:.09, rMin:.5}).forEach(p => {
      const s = rnd(.045, .075);
      pushInst(bins.face, p[0], TOP_Y + s * .4, p[1], s, s * .6, s, 0, varyColor(0xf2c14e, .02, .08, .08));
    });
  } else if(h.type === 'desert'){
    spots(h, 26, {sep:.11}).forEach(p => {
      const s = rnd(.04, .11);
      pushInst(bins.rock, p[0], TOP_Y + s * .28, p[1], s * 1.6, s, s * 1.5,
               Math.random() * 6.2832, varyColor(0xb8a375, .03, .10, .12));
    });
    spots(h, 6, {sep:.20}).forEach(p => bush(p[0], p[1], rnd(.08, .14), 1.5, .8, 0x8f8a57));
  }
}

/* --- 盤面の構築 -------------------------------------------- */
const playerMatList = [];

function buildScene(){
  while(boardGroup.children.length) boardGroup.remove(boardGroup.children[0]);
  while(pickGroup.children.length) pickGroup.remove(pickGroup.children[0]);
  pickables = [];
  KB.mark = null;
  bobbers.length = 0;
  buildFitPoints();
  freeOwned();
  while(playerMatList.length) playerMatList.pop().dispose();
  G.players.forEach(p => { p._mats = null; });

  const bins = newBins();
  computeIslandCenters();

  G.hexes.forEach(h => addHexVisual(h, bins));

  buildShore(bins);
  addAllInstanced(bins);

  buildPorts();

  robberMesh = makeRobber();
  boardGroup.add(robberMesh);
  updateRobberMesh();
  robberMesh.visible = !G.explore && G.hexes.some(h => h.robber);
  pirateMesh = makePirate();
  boardGroup.add(pirateMesh);
  updatePirateMesh();

  G.vertices.forEach(v => { v.mesh = null; });
  resetCamera();          // 開始時の向きを固定する（触った角度を持ち越さない）
  G.edges.forEach(e => { e.mesh = null; });
  if(G.seaSc) buildSea8Scene();
  fitCamera();
}
// タイル1枚ぶんの見た目。伏せたタイルをめくったときにも使う
function addHexVisual(h, bins){
  if(h.hidden){ addHiddenHex(h); return; }
  // 海タイルは水面に薄い枠だけ置く。船を置ける辺が読めるようにする
  if(!h.land){
    const tile = new THREE.Mesh(GEO.hexTop, M.seaTile);
    tile.position.set(h.x, -.14, h.z);
    tile.scale.set(.985, .04, .985);
    tile.renderOrder = 3;
    tile.userData = {hex: h.id};
    boardGroup.add(tile);
    h.mesh = tile;
    const ring = new THREE.Mesh(GEO.hexRing, M.seaEdge);
    ring.position.set(h.x, -.12, h.z);
    ring.rotation.x = -Math.PI / 2;
    ring.renderOrder = 4;
    boardGroup.add(ring);
    addSeaFeature(h);
    return;
  }
  // 収穫の点灯をタイル単位で行うため、上面のマテリアルは複製して持たせる
  h.mat = own(M[h.type].clone());
  h.mat.emissive = new THREE.Color(0xffe9a8);
  h.mat.emissiveIntensity = 0;
  const top = new THREE.Mesh(GEO.hexTop, [M.sand, h.mat, M.cliff]);
  top.position.set(h.x, TOP_Y - .08, h.z);
  top.castShadow = true; top.receiveShadow = true;
  top.userData = {hex: h.id};
  boardGroup.add(top);
  h.mesh = top;

  // 海から立ち上がる断崖
  const cliff = new THREE.Mesh(GEO.hexCliff, M.cliff);
  cliff.position.set(h.x, TOP_Y - .66, h.z);
  cliff.castShadow = true; cliff.receiveShadow = true;
  boardGroup.add(cliff);

  tileDecor(h, bins);

  if(h.number){
    const face = own(new THREE.MeshStandardMaterial({
      map: makeNumberTexture(h.number), roughness: .85
    }));
    const disc = new THREE.Mesh(GEO.token, [M.tokenSide, face, M.tokenSide]);
    disc.position.set(h.x, TOP_Y + .035, h.z);
    // 円柱の上面はUVが90°ずれて貼られる（u←z, v←x）ため、そのままだと
    // 数字が横倒しになる。ここで起こして、文字の下が画面の下を向くようにする
    disc.rotation.y = Math.PI / 2;
    disc.castShadow = true; disc.receiveShadow = true;
    boardGroup.add(disc);
    h.token = disc;
  }
}
// 装飾は形ごとに1つの InstancedMesh にまとめる
function addAllInstanced(bins){
  addInstanced(GEO.trunk,  bins.trunk);
  addInstanced(GEO.cone,   bins.cone);
  addInstanced(GEO.wheat,  bins.wheat);
  addInstanced(GEO.bush,   bins.bush, true);
  addInstanced(GEO.sphere, bins.sheep);
  addInstanced(GEO.sphere, bins.face);
  addInstanced(GEO.rock,   bins.rock, true);
  addInstanced(GEO.peak,   bins.peak, true);
}

// 島の縁：浅瀬のにじみ、波打ち際、海から突き出す岩
/* 島ごとの中心。岩や桟橋を「その島の外側」へ押し出すのに使う。
   盤の原点から押すと、離れた小島では向きが逆になってしまう            */
function computeIslandCenters(){
  const acc = {};
  G.hexes.forEach(h => {
    if(!h.land || h.hidden) return;
    const a = acc[h.island] || (acc[h.island] = {x:0, z:0, n:0});
    a.x += h.x; a.z += h.z; a.n++;
  });
  G.islandCenter = {};
  Object.entries(acc).forEach(([k, a]) => { G.islandCenter[k] = {x: a.x / a.n, z: a.z / a.n}; });
}
// その辺・その点を、属する島の外へ向かって押し出す量
function outwardFrom(island, x, z){
  const c = (G.islandCenter && G.islandCenter[island]) || {x:0, z:0};
  const dx = x - c.x, dz = z - c.z;
  const d = hyp(dx, dz) || 1;
  return {nx: dx / d, nz: dz / d};
}

function buildShore(bins, only){
  const sc = document.createElement('canvas');
  sc.width = sc.height = 256;
  const sx = sc.getContext('2d');
  // 島の外周（半径5前後＝画像の0.63あたり）に波打ち際の白みを置く
  const grd = sx.createRadialGradient(128, 128, 20, 128, 128, 128);
  grd.addColorStop(0,   'rgba(150,240,244,.22)');
  grd.addColorStop(.50, 'rgba(126,228,238,.19)');
  grd.addColorStop(.63, 'rgba(222,249,252,.19)');   // 波打ち際の白み
  grd.addColorStop(.73, 'rgba(112,214,230,.12)');
  grd.addColorStop(.87, 'rgba(92,198,216,.045)');
  grd.addColorStop(1,   'rgba(80,190,210,0)');
  sx.fillStyle = grd; sx.fillRect(0, 0, 256, 256);
  // 島ごとに浅瀬を敷く。群島なので、盤の中心に1枚では足りない
  Object.entries(G.islandCenter || {}).forEach(([isle, c]) => {
    // めくったタイルだけを足すときは、その島の浅瀬だけ敷く
    if(only && !G.hexes.some(h => only.has(h.id) && h.island === isle)) return;
    const n = G.hexes.filter(h => h.land && h.island === isle).length;
    const size = G.explore ? (isle === 'main' ? 13 : 3.6) : G.islands.length ? 5.2 + n * .72 : 16;
    const shoal = new THREE.Mesh(
      own(new THREE.PlaneGeometry(size, size)),
      own(new THREE.MeshBasicMaterial({
        map: own(new THREE.CanvasTexture(sc)), transparent: true, depthWrite: false
      })));
    shoal.rotation.x = -Math.PI / 2;
    shoal.position.set(c.x, -.17, c.z);
    shoal.renderOrder = 2;
    boardGroup.add(shoal);
  });

  // 陸と海（または盤外）の境目に岩を積み、断崖に厚みを持たせる
  G.edges.filter(e => {
    if(only && !e.hexes.some(i => only.has(i))) return false;
    const hs = e.hexes.map(i => G.hexes[i]);
    return hs.some(h => h.land && !h.hidden) && (hs.length === 1 || hs.some(h => !h.land || h.hidden));
  }).forEach(e => {
    const isle = e.hexes.map(i => G.hexes[i]).find(h => h.land && !h.hidden).island;
    const a = G.vertices[e.v[0]], b = G.vertices[e.v[1]];
    for(let i = 0; i < 8; i++){
      const t = .18 + Math.random() * .64;   // 頂点付近は建物の場所なので空ける
      const x = a.x + (b.x - a.x) * t, z = a.z + (b.z - a.z) * t;
      const {nx, nz} = outwardFrom(isle, x, z);
      /* 岩は水際の低い礁にする。以前は上端が y≈0.50 まで届き、
         船（上端0.21）・港の木札（0.26）・光る印を手前から隠していた   */
      const push = .08 + Math.random() * .26;
      const s = .15 + Math.random() * .22;
      bins.rock.push({
        x: x + nx * push,
        y: -.46 + Math.random() * .26,
        z: z + nz * push,
        sx: s * (1.1 + Math.random() * .5),
        sy: s * (1.0 + Math.random() * .7),
        sz: s * (1.1 + Math.random() * .5),
        rx: Math.random() * .8, ry: Math.random() * 6.2832, rz: Math.random() * .8,
        c: varyColor(0x574530, .03, .10, .14)
      });
    }
  });
}

// 港：桟橋・杭・木札に加え、沖に小舟を1艘浮かべる
function buildPorts(){
  G.ports.forEach((p, pi) => {
    const e = G.edges[p.edge];
    const a = G.vertices[e.v[0]], b = G.vertices[e.v[1]];
    const mx = (a.x + b.x) / 2, mz = (a.z + b.z) / 2;
    const {nx, nz} = outwardFrom(G.seaSc ? portIsle(e) : 'main', mx, mz);    // 本島の外へ向かう向き
    const px = mx + nx * .85, pz = mz + nz * .85;    // 桟橋の位置
    const face = -Math.atan2(nz, nx);

    // 2つの交差点それぞれへ板を渡す（どこに接しているかを明示）
    [a, b].forEach(v => {
      const dx = px - v.x, dz = pz - v.z;
      const len = Math.hypot(dx, dz);
      const plank = new THREE.Mesh(own(new THREE.BoxGeometry(len, .05, .17)), M.dock);
      plank.position.set((v.x + px) / 2, .19, (v.z + pz) / 2);
      plank.rotation.y = -Math.atan2(dz, dx);
      plank.castShadow = true;
      boardGroup.add(plank);
      const peg = new THREE.Mesh(GEO.peg, M.dockDark);
      peg.position.set(v.x, .15, v.z);
      peg.castShadow = true;
      boardGroup.add(peg);
    });

    const deck = new THREE.Mesh(GEO.deck, M.dock);
    deck.position.set(px, .18, pz);
    deck.rotation.y = face;
    deck.castShadow = true; deck.receiveShadow = true;
    boardGroup.add(deck);

    // 木札：真上から読める向きに寝かせる。
    // 箱の面は [+X,-X,+Y,-Y,+Z,-Z] の6つに分かれるので、上面だけに絵を貼る
    const signMat = own(new THREE.MeshStandardMaterial({
      map: makePortTexture(p.type), transparent: true, roughness: .9
    }));
    const sign = new THREE.Mesh(GEO.sign, [
      M.dockDark, M.dockDark, signMat, M.dockDark, M.dockDark, M.dockDark
    ]);
    sign.position.set(px, .27, pz);
    // 木札は桟橋に沿わせず、常に画面から読める向きにそろえる
    sign.rotation.y = 0;
    sign.castShadow = true;
    boardGroup.add(sign);

    // 桟橋に舫った小舟。波で上下に揺れる
    const boat = new THREE.Group();
    const hull = new THREE.Mesh(GEO.hull, M.dock);
    hull.scale.set(1, .8, .5);
    const mast = new THREE.Mesh(GEO.mast, M.dockDark);
    mast.position.y = .18;
    const sail = new THREE.Mesh(GEO.sailP, M.sail);
    sail.position.set(.05, .22, 0);
    sail.rotation.y = Math.PI / 2;
    boat.add(hull, mast, sail);
    boat.traverse(o => { o.castShadow = true; });
    boat.position.set(px + nx * .62 - nz * .52, -.24, pz + nz * .62 + nx * .52);
    boat.rotation.y = face + .35;
    boat.scale.setScalar(.72);
    boardGroup.add(boat);
    bobbers.push({obj: boat, y: -.24, ph: pi * 1.7});
  });
}

// 収穫したタイルを光らせ、光の輪を立ち上げる
function flashHexes(ids){
  if(ids.length) sfx('harvest');
  if(!ids.length || !FX.anim) return Promise.resolve();
  const rings = ids.map(id => {
    const h = G.hexes[id];
    const m = new THREE.Mesh(GEO.ring, new THREE.MeshBasicMaterial({
      color: 0xffe9a8, transparent: true, opacity: 0,
      depthWrite: false, side: THREE.DoubleSide
    }));
    m.position.set(h.x, TOP_Y + .05, h.z);
    m.renderOrder = 3;
    boardGroup.add(m);
    return m;
  });
  return tween(1000, k => {
    const v = Math.sin(Math.PI * Math.min(1, k * 1.15));
    ids.forEach(id => {
      if(G.hexes[id].mat) G.hexes[id].mat.emissiveIntensity = Math.max(0, v * .30);
    });
    rings.forEach(m => {
      const s = .5 + k * 1.9;
      m.scale.set(s, 1, s);
      m.position.y = TOP_Y + .05 + k * .4;
      m.material.opacity = Math.max(0, (1 - k) * .85);
    });
  }).then(() => {
    rings.forEach(m => { boardGroup.remove(m); m.material.dispose(); });
    ids.forEach(id => { if(G.hexes[id].mat) G.hexes[id].mat.emissiveIntensity = 0; });
  });
}

// 建設の土煙。輪が広がり、小さな粒が跳ねる
function buildDust(x, y, z, scale){
  if(!FX.anim) return Promise.resolve();
  scale = scale || 1;
  const mat = new THREE.MeshBasicMaterial({
    color: 0xe8dcc0, transparent: true, opacity: .6,
    depthWrite: false, side: THREE.DoubleSide
  });
  const ring = new THREE.Mesh(GEO.ring, mat);
  ring.position.set(x, y + .03, z);
  ring.renderOrder = 3;
  boardGroup.add(ring);

  const puffs = [];
  for(let i = 0; i < 7; i++){
    const m = new THREE.Mesh(GEO.puff, mat);
    const a = Math.random() * 6.2832, d = .1 + Math.random() * .12;
    m.userData = {ax: Math.cos(a) * d, az: Math.sin(a) * d, up: .16 + Math.random() * .2};
    m.position.set(x, y + .04, z);
    boardGroup.add(m);
    puffs.push(m);
  }
  return tween(620, k => {
    const s = (.35 + k * 1.5) * scale;
    ring.scale.set(s, 1, s);
    mat.opacity = Math.max(0, (1 - k) * .6);
    puffs.forEach(m => {
      const u = m.userData;
      m.position.set(x + u.ax * k * 2.4,
                     y + .04 + u.up * Math.sin(Math.PI * k * .8),
                     z + u.az * k * 2.4);
      m.scale.setScalar(Math.max(.05, (1 - k * .7) * scale));
    });
  }).then(() => {
    boardGroup.remove(ring);
    puffs.forEach(m => boardGroup.remove(m));
    mat.dispose();
  });
}

// 壁は生成り、屋根と幕板が持ち主の色。旗と合わせて誰の建物か分かるようにする
function playerMats(p){
  if(p._mats) return p._mats;
  const body = new THREE.Color(p.color);
  const mk = (c, r, extra) => {
    const m = new THREE.MeshStandardMaterial(
      Object.assign({color: c, roughness: r, flatShading: true}, extra || {}));
    playerMatList.push(m);
    return m;
  };
  // 壁は持ち主の色を少し起こした明るい色、屋根は同系の濃い色。
  // 生成りに寄せすぎると誰の建物か分からなくなるので、色味は残す
  p._mats = {
    body: mk(body, .72),
    wall: mk(body.clone().lerp(new THREE.Color(0xf6f1e4), .34), .82),
    roof: mk(body.clone().multiplyScalar(.58), .86),
    flag: mk(body, .6, {emissive: body.clone().multiplyScalar(.22), side: THREE.DoubleSide})
  };
  return p._mats;
}

// 面の割り当て：+X=1 / -X=6 / +Y=2 / -Y=5 / +Z=3 / -Z=4
const DIE_FACE_EULER = {
  1: [0, 0, Math.PI / 2],  2: [0, 0, 0],           3: [-Math.PI / 2, 0, 0],
  4: [Math.PI / 2, 0, 0],  5: [Math.PI, 0, 0],     6: [0, 0, -Math.PI / 2]
};
function makePipTexture(n){
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = '#f4eddc'; x.fillRect(0, 0, 128, 128);
  x.fillStyle = 'rgba(120,100,70,.16)';
  x.fillRect(0, 0, 128, 5); x.fillRect(0, 123, 128, 5);
  x.fillRect(0, 0, 5, 128); x.fillRect(123, 0, 5, 128);
  const P = 33, C = 64, Q = 95;
  const pos = {
    1: [[C, C]],
    2: [[P, P], [Q, Q]],
    3: [[P, P], [C, C], [Q, Q]],
    4: [[P, P], [Q, P], [P, Q], [Q, Q]],
    5: [[P, P], [Q, P], [C, C], [P, Q], [Q, Q]],
    6: [[P, P], [Q, P], [P, C], [Q, C], [P, Q], [Q, Q]]
  }[n];
  x.fillStyle = n === 1 ? '#b23a22' : '#3a3226';
  pos.forEach(q => { x.beginPath(); x.arc(q[0], q[1], 11, 0, 7); x.fill(); });
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  return t;
}
function initDice(){
  if(diceGroup) return;
  const mats = [1, 6, 2, 5, 3, 4].map(n => new THREE.MeshStandardMaterial({
    map: makePipTexture(n), roughness: .5, metalness: .02, transparent: true
  }));
  const geo = new THREE.BoxGeometry(.62, .62, .62);
  diceGroup = new THREE.Group();
  diceGroup.visible = false;
  diceGroup.userData.mats = mats;
  for(let i = 0; i < 2; i++){
    const m = new THREE.Mesh(geo, mats);
    m.castShadow = true;
    diceGroup.add(m);
  }
  scene.add(diceGroup);
}
// 盤の上で転がして出目で止まる。UI側の表示と同時に走らせる
function rollDice3D(a, b){
  if(!FX.anim) return Promise.resolve();
  initDice();
  const mats = diceGroup.userData.mats;
  mats.forEach(m => { m.opacity = 1; });
  diceGroup.visible = true;
  const vals = [a, b], start = [], target = [], spin = [], held = [null, null];
  const HIGH = 4.0, LAND = 2.45;
  diceGroup.children.forEach((m, i) => {
    m.position.set((i - .5) * 1.5, HIGH, -0.6);
    m.quaternion.setFromEuler(new THREE.Euler(
      Math.random() * 6.28, Math.random() * 6.28, Math.random() * 6.28));
    start.push(m.quaternion.clone());
    const e = DIE_FACE_EULER[vals[i]];
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(e[0], e[1], e[2]));
    const yaw = new THREE.Quaternion().setFromEuler(
      new THREE.Euler(0, Math.floor(Math.random() * 4) * Math.PI / 2, 0));
    target.push(yaw.multiply(q));
    spin.push([2 + Math.random() * 4, 2 + Math.random() * 4, 2 + Math.random() * 4]);
  });
  return tween(820, k => {
    diceGroup.children.forEach((m, i) => {
      // 落下したあと小さく跳ねる
      let y = HIGH + (LAND - HIGH) * easeOut(Math.min(1, k / .55));
      if(k > .55) y = LAND + Math.abs(Math.sin((k - .55) * 7)) * (1 - (k - .55) / .45) * .45;
      m.position.y = y;
      if(k < .72){
        m.quaternion.setFromEuler(new THREE.Euler(
          spin[i][0] * k * 6, spin[i][1] * k * 6, spin[i][2] * k * 6)).premultiply(start[i]);
      } else {
        if(!held[i]) held[i] = m.quaternion.clone();
        m.quaternion.copy(held[i]).slerp(target[i], easeOut((k - .72) / .28));
      }
    });
  }).then(() => wait(200)).then(() => tween(270, k => {
    diceGroup.children.forEach(m => { m.position.y = LAND + k * .9; });
    mats.forEach(m => { m.opacity = Math.max(0, 1 - k); });
  })).then(() => { diceGroup.visible = false; });
}

/* --- 選択マーカー --- */
function clearPickables(){
  // 印は毎回作り直すので、外すときに材質も捨てる（貯めると増え続ける）
  while(pickGroup.children.length){
    const o = pickGroup.children[0];
    o.traverse(c => { if(c.material) c.material.dispose(); });
    pickGroup.remove(o);
  }
  pickables = [];
  KB.mark = null;
}
// 辺の印は「線」として当たり判定を取るので、両端の座標を持たせておく
const segOf = (a, b, y) => [new THREE.Vector3(a.x, y, a.z), new THREE.Vector3(b.x, y, b.z)];
function showPickables(){
  clearPickables();
  if(G.phase === 'over' || G.hidden) return;
  const pid = G.turn;
  if(G.players[pid].cpu) return;

  /* 置ける場所の印。玉ひとつだけにする。
     輪や暈を足したら盤が印で埋まって、かえって何も見えなくなった。
     深度判定だけ切って、岩や山の手前に必ず出るようにする              */
  const mk = (x, y, z, r, data, color) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r * 1.1, 14, 10),
      new THREE.MeshBasicMaterial({color, transparent:true, opacity:.9,
                                   depthTest:false, depthWrite:false}));
    m.renderOrder = 40;
    m.position.set(x, y, z);
    m.userData = data;
    pickGroup.add(m);
    pickables.push(m);
    return m;
  };
  if(G.explore){ showPickablesX(mk, pid); return; }
  if(G.seaSc && sea8Pickables(mk, pid)) return;

  if(G.mode === 'settlement'){
    validSettlementSpots(pid).forEach(vi => {
      const v = G.vertices[vi];
      mk(v.x, .35, v.z, .17, {kind:'vertex', id:vi}, 0xfff2c4);
    });
  } else if(G.mode === 'city'){
    validCitySpots(pid).forEach(vi => {
      const v = G.vertices[vi];
      mk(v.x, .48, v.z, .17, {kind:'vertex', id:vi}, 0xfff2c4);
    });
  } else if(G.mode === 'road'){
    validRoadSpots(pid).forEach(ei => {
      const e = G.edges[ei], a = G.vertices[e.v[0]], b = G.vertices[e.v[1]];
      mk((a.x + b.x) / 2, .3, (a.z + b.z) / 2, .13, {kind:'edge', id:ei, seg:segOf(a, b, .3)}, 0xfff2c4);
    });
  } else if(G.mode === 'ship'){
    validShipSpots(pid).forEach(ei => {
      const e = G.edges[ei], a = G.vertices[e.v[0]], b = G.vertices[e.v[1]];
      mk((a.x + b.x) / 2, .32, (a.z + b.z) / 2, .14, {kind:'edge', id:ei, seg:segOf(a, b, .32)}, 0x35d2f5);
    });
  } else if(G.mode === 'shipPick'){
    // 動かせる船を選ぶ（S-5, S-6）
    movableShips(pid).forEach(ei => {
      const e = G.edges[ei], a = G.vertices[e.v[0]], b = G.vertices[e.v[1]];
      mk((a.x + b.x) / 2, .36, (a.z + b.z) / 2, .155, {kind:'shipFrom', id:ei, seg:segOf(a, b, .36)}, 0xffc23d);
    });
  } else if(G.mode === 'shipMove'){
    // 選んだ船の移動先（S-8）
    validShipSpots(pid, G.shipFrom).forEach(ei => {
      const e = G.edges[ei], a = G.vertices[e.v[0]], b = G.vertices[e.v[1]];
      mk((a.x + b.x) / 2, .32, (a.z + b.z) / 2, .14, {kind:'shipTo', id:ei, seg:segOf(a, b, .32)}, 0x35d2f5);
    });
  } else if(G.mode === 'robber'){
    G.hexes.forEach(h => {
      if(!h.land || h.robber || (G.seaSc && !sea8RobberOK(h))) return;              // 盗賊は陸のみ
      mk(h.x, .75, h.z, .22, {kind:'hex', id:h.id}, 0x2a2a30);
    });
  } else if(G.mode === 'pirate'){
    G.hexes.forEach(h => {
      if(h.land || h.pirate) return;               // 海賊は海のみ（P-2）
      mk(h.x, .45, h.z, .22, {kind:'pirateHex', id:h.id}, 0x1d2730);
    });
  }
}

/* --- カメラ操作 --- */
const cam = {theta: Math.PI * .5, phi: 0.92, dist: 14, target: new THREE.Vector3(0, 0, 0)};

/* --- 盤面の据え方 --------------------------------------------
   縦画面では視点を90°回して島の長辺を縦に使う案を試したが、
   タイルの並び（六角形の向き）まで回って見えるため取りやめた。
   島の向きはどの画面でも同じにし、縦画面では伏せ角だけを浅くして
   映りの横長さを抑える（resetCamera）。
   ------------------------------------------------------------ */
function applyCamera(){
  camera.position.set(
    cam.target.x + cam.dist * Math.sin(cam.phi) * Math.cos(cam.theta),
    cam.target.y + cam.dist * Math.cos(cam.phi),
    cam.target.z + cam.dist * Math.sin(cam.phi) * Math.sin(cam.theta)
  );
  camera.lookAt(cam.target);
}
function freeArea(){
  const W = window.innerWidth, H = window.innerHeight;
  const rect = id => document.getElementById(id).getBoundingClientRect();
  const top = rect('logline'), bottom = rect('bottom');
  return {W, H, left: 0, right: W, top: top.bottom, bottom: bottom.top};
}
// 島を囲う円柱の輪郭を実際に投影して、空き領域へ収まる最短の距離を二分探索する。
// 球とみなして見積もると、俯瞰で奥行きが縮む分だけ島が小さく映っていた
// 島は円ではなく横長の六角形なので、外周の交差点そのものを使う。
// 円で見積もると、向きを変えても収まりが変わらない
let FIT_PTS = [];
function buildFitPoints(){
  const pts = [];
  const m = 1.12;                       // 縁の岩と桟橋のぶんの余裕
  const c = boardCenter();              // 盤の中心から外へ広げる（原点とは限らない）
  G.vertices.forEach(v => {
    const x = c.x + (v.x - c.x) * m, z = c.z + (v.z - c.z) * m;
    pts.push(new THREE.Vector3(x, -.25, z), new THREE.Vector3(x, 1.0, z));
  });
  FIT_PTS = pts;
}

// 引きの上限。探検者の盤は横に広く、縦長の画面では34では収まらない
const camMax = () => (G && G.explore ? 52 : 34);
function fitCamera(){
  const a = freeArea();
  const xc = (a.left + a.right) / 2, yc = (a.top + a.bottom) / 2;
  camera.setViewOffset(a.W, a.H, -(xc - a.W / 2), -(yc - a.H / 2), a.W, a.H);

  const m = 6;                                   // 縁の余白
  const L = a.left + m, Rt = a.right - m, T = a.top + m, B = a.bottom - m;
  if(Rt - L < 40 || B - T < 40 || !FIT_PTS.length){ applyCamera(); return; }

  const v = new THREE.Vector3();
  const inside = d => {
    cam.dist = d;
    applyCamera();
    camera.updateMatrixWorld();
    for(let i = 0; i < FIT_PTS.length; i++){
      v.copy(FIT_PTS[i]).project(camera);
      const sx = (v.x * .5 + .5) * a.W, sy = (-v.y * .5 + .5) * a.H;
      if(sx < L || sx > Rt || sy < T || sy > B) return false;
    }
    return true;
  };
  let lo = 6, hi = camMax();
  if(!inside(hi)){ cam.dist = hi; applyCamera(); return; }
  for(let k = 0; k < 18; k++){
    const mid = (lo + hi) / 2;
    if(inside(mid)) hi = mid; else lo = mid;
  }
  cam.dist = hi;
  applyCamera();
}
function resize(){
  if(typeof layoutSeats === 'function') layoutSeats();
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  fitCamera();
}

/* ---- キーボード操作（PC） ------------------------------------
   矢印キーで選ぶものを動かし、Enter で決める。
   ・画面（モーダル）が開いていれば、その中のボタンの間を移る
   ・盤に置ける場所の印が出ていれば、印の間を画面上の向きで移る
   ・どちらでもなければ、下の操作パネルのボタンの間を移る
   名前や点数を入力している最中は、キーを横取りしない             */
const KB = {mark: null};
const KB_DIR = {ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0]};
// 今の位置から、押した向きにあるいちばん近いものを選ぶ
function kbPick(items, from, dir){
  if(!items.length) return null;
  if(!from) return items.slice().sort((a, b) => a.d0 - b.d0)[0];
  let best = null, bestS = Infinity;
  for(const it of items){
    if(it === from) continue;
    const dx = it.x - from.x, dy = it.y - from.y;
    const d = Math.hypot(dx, dy);
    if(d < 1) continue;
    const cos = (dx * dir[0] + dy * dir[1]) / d;
    if(cos < .35) continue;                       // 押した向きから大きく外れたものは除く
    const s = d * (1 + 2.2 * (1 - cos));          // 真っすぐ先にあるものほど選ばれやすい
    if(s < bestS){ bestS = s; best = it; }
  }
  return best;
}
function kbSetMark(m){
  const prev = KB.mark;
  if(prev && prev.material && prev.userData._c !== undefined){
    prev.material.color.setHex(prev.userData._c);
    prev.scale.setScalar(1);
  }
  KB.mark = m || null;
  if(KB.mark){
    KB.mark.userData._c = KB.mark.material.color.getHex();
    KB.mark.material.color.setHex(0xffffff);
    KB.mark.scale.setScalar(1.9);
  }
}
function kbButtons(){
  const modals = [...document.querySelectorAll('.modal-bg.show')];
  const active = document.activeElement && document.activeElement.closest && document.activeElement.closest('.modal-bg.show');
  const scope = active || (modals.length ? modals[modals.length - 1] : $('actions'));
  if(!scope) return [];
  return [...scope.querySelectorAll('button')].filter(b => !b.disabled && b.offsetParent !== null);
}
function cancelSelecting(){
  G.mode = null;
  G.shipFrom = null;
  if(G.explore) G.sailShip = null;
  KB.mark = null;
  render();
  showHint('選択をやめた');
}
function onKey(e){
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  const dir = KB_DIR[e.key];
  const modalOpen = !!document.querySelector('.modal-bg.show');
  const W = window.innerWidth, H = window.innerHeight;

  // Esc：建設や船の置き場所を選んでいる状態をやめる（何も置かずに元のボタン表示へ戻す）
  if(e.key === 'Escape' && !modalOpen && G && !G.busy && G.phase !== 'over' && G.players[G.turn] && !G.players[G.turn].cpu){
    const selecting = G.mode || (G.explore && G.sailShip !== null && G.sailShip !== undefined) ||
                      (G.shipFrom !== null && G.shipFrom !== undefined);
    if(selecting){
      // ネット対戦では、やめる操作も全員の端末で同じ順に行う
      if(NET.on) netInput({t:'esc'});
      else cancelSelecting();
      e.preventDefault();
      return;
    }
  }

  // 盤の印を選ぶ
  if(!modalOpen && pickables.length){
    if(dir){
      const items = pickables.map(o => {
        const s = screenPosOf(o);
        return s && {o, x: s.x, y: s.y, d0: Math.hypot(s.x - W / 2, s.y - H / 2)};
      }).filter(Boolean);
      const cur = KB.mark && items.find(it => it.o === KB.mark);
      const next = kbPick(items, cur, dir);
      if(next) kbSetMark(next.o);
      e.preventDefault();
      return;
    }
    if(e.key === 'Enter' && KB.mark && pickables.includes(KB.mark)){
      pickOnce(KB.mark.userData);
      e.preventDefault();
      return;
    }
  }

  // ボタンを選ぶ
  if(dir){
    const btns = kbButtons();
    const items = btns.map(b => {
      const r = b.getBoundingClientRect();
      const x = r.left + r.width / 2, y = r.top + r.height / 2;
      return {b, x, y, d0: y * 10 + x};              // 最初は左上から
    });
    const cur = items.find(it => it.b === document.activeElement);
    const next = kbPick(items, cur, dir);
    if(next) next.b.focus();
    e.preventDefault();
  }
  // Enter はフォーカス中のボタンをそのまま押す（ブラウザ標準の動作に任せる）
}
window.addEventListener('keydown', onKey);

let drag = null;
function pointerPos(e){
  const t = e.touches ? e.touches[0] : e;
  return {x: t.clientX, y: t.clientY};
}

/* 画面の1点の真下にある海面（y=0）の座標。
   拡大の中心を指先に合わせるために使う                                 */
const GROUND = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function groundAt(sx, sy){
  pointer.x = (sx / window.innerWidth) * 2 - 1;
  pointer.y = -(sy / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const out = new THREE.Vector3();
  return raycaster.ray.intersectPlane(GROUND, out) ? out : null;
}
const PAN_LIMIT = 11;          // 盤から離れすぎないよう、注視点を囲っておく
const clampPan = v => Math.min(PAN_LIMIT, Math.max(-PAN_LIMIT, v));
/* 指やカーソルの下の一点を固定したまま寄り引きする。
   盤の中心だけを基準にすると、群島のように広い盤で端が見られない        */
function zoomTo(dist, sx, sy){
  const d = Math.min(camMax(), Math.max(6, dist));
  if(sx === undefined || sy === undefined){ cam.dist = d; applyCamera(); return; }
  const before = groundAt(sx, sy);
  cam.dist = d;
  applyCamera();
  if(!before) return;
  // 注視点を動かすとカメラ自体も動くので、2回寄せて合わせる
  for(let i = 0; i < 2; i++){
    const after = groundAt(sx, sy);
    if(!after) return;
    cam.target.x = clampPan(cam.target.x + before.x - after.x);
    cam.target.z = clampPan(cam.target.z + before.z - after.z);
    applyCamera();
  }
}
// 2本指の中点。つまむ位置を拡大の中心にする
function touchMid(e){
  const [a, b] = e.touches;
  return {x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2};
}
function pinchDist(e){
  const [a, b] = e.touches;
  return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
}

let lastTap = {t: 0, x: 0, y: 0};     // ダブルタップの判定用
function onDown(e){
  if(e.touches && e.touches.length === 2){
    const m = touchMid(e);
    drag = {pinch: pinchDist(e), dist: cam.dist, mx: m.x, my: m.y};
    return;
  }
  const p = pointerPos(e);
  const now = Date.now();
  // 地図と同じ操作感：一度叩いてから、続けて押したまま上下でズーム
  const dbl = !!e.touches && now - lastTap.t < 320 &&
              Math.hypot(p.x - lastTap.x, p.y - lastTap.y) < 40;
  lastTap = {t: now, x: p.x, y: p.y};
  // 右ボタンと中ボタンは盤を平らに動かす（左は今までどおり向きを変える）
  const pan = !e.touches && (e.button === 1 || e.button === 2);
  drag = {x: p.x, y: p.y, theta: cam.theta, phi: cam.phi,
          moved: 0, sx: p.x, sy: p.y, zoom: dbl, pan, dist: cam.dist};
  if(pan && e.preventDefault) e.preventDefault();
}
// 画面上の (ax,ay) から (bx,by) へなぞったぶんだけ、盤を平らに動かす
function panBy(ax, ay, bx, by){
  const a = groundAt(ax, ay), b = groundAt(bx, by);
  if(!a || !b) return;
  cam.target.x = clampPan(cam.target.x + a.x - b.x);
  cam.target.z = clampPan(cam.target.z + a.z - b.z);
  applyCamera();
}
function onMove(e){
  if(!drag) return;
  if(e.touches && e.touches.length === 2 && drag.pinch){
    const d = pinchDist(e);
    const m = touchMid(e);
    // 2本指を平行に動かせば盤が動く。つまめば、つまんだ一点を軸に寄り引きする
    const before = groundAt(drag.mx, drag.my);
    const after = groundAt(m.x, m.y);
    if(before && after){
      cam.target.x = clampPan(cam.target.x + before.x - after.x);
      cam.target.z = clampPan(cam.target.z + before.z - after.z);
      applyCamera();
    }
    drag.mx = m.x; drag.my = m.y;
    zoomTo(drag.dist * drag.pinch / d, m.x, m.y);
    if(e.cancelable) e.preventDefault();
    return;
  }
  const p = pointerPos(e);
  const dx = p.x - drag.x, dy = p.y - drag.y;
  drag.moved = Math.max(drag.moved || 0, Math.hypot(p.x - drag.sx, p.y - drag.sy));
  if(drag.pan){
    panBy(drag.x, drag.y, p.x, p.y);
    drag.x = p.x; drag.y = p.y;
  } else if(drag.zoom){
    // ダブルタップのまま下へなぞると寄る、上へなぞると引く（地図と同じ向き）
    zoomTo(drag.dist - dy * .035, drag.sx, drag.sy);
  } else {
    cam.theta = drag.theta + dx * .006;
    // 上下の向きは設定で入れ替えられる（既定は「なぞった向きへ島が傾く」）
    const sign = (+CFG.invertY) ? -1 : 1;
    cam.phi = Math.min(1.42, Math.max(.28, drag.phi + dy * .005 * sign));
    applyCamera();
  }
  if(e.cancelable) e.preventDefault();
}
/* 指は必ず少し動く。6pxしか許していなかったため、置いたつもりが
   「盤を回した」と判定されて何も起きないことがあった                */
const TAP_SLOP = () => (matchMedia('(pointer: coarse)').matches ? 14 : 6);
function onUp(e){
  if(drag && (drag.moved || 0) < TAP_SLOP() && !drag.pinch && !drag.zoom && !drag.pan){
    const p = drag.sx !== undefined ? {x: drag.sx, y: drag.sy} : null;
    if(p) tryPick(p.x, p.y);
  }
  drag = null;
}
// 盤面の向きを既定に戻す。開始時は必ずここから始める。
// 縦長の画面ほど真上寄りから見る：斜めから見ると島の映りが横長になり、
// 狭い横幅に収まりきらず小さくしか出せないため
function resetCamera(){
  cam.theta = Math.PI * .5;
  // 縦長の画面ほど真上寄りから見る。斜めから見ると奥行きが縮んで島が横長に映り、
  // 縦の空きを使えなくなるため（実測：phi 0.66 で画面上 330x239）
  const a = window.innerWidth / Math.max(1, window.innerHeight);
  cam.phi = a < 0.62 ? 0.40 : a < 0.80 ? 0.55 : a < 1.15 ? 0.75 : 0.92;
  // 盤の真ん中を見る。ランダムな並びでは原点が盤の中心とは限らない
  const c = boardCenter();
  cam.target.set(c.x, 0, c.z);
  applyCamera();
}
// 盤に置かれた交差点の重心。カメラの向け先と、収まりの基準に使う
function boardCenter(){
  if(!G || !G.vertices || !G.vertices.length) return {x:0, z:0};
  let x = 0, z = 0;
  G.vertices.forEach(v => { x += v.x; z += v.z; });
  return {x: x / G.vertices.length, z: z / G.vertices.length};
}
/* ホイールの役割は設定で選べる。既定は「拡大縮小」（カーソルの下が軸）。
   「盤を動かす」にすると、上下左右のスクロールで盤が平らに動く。
   どちらの設定でも、Shift を押していれば逆の役割になる                 */
function onWheel(e){
  const move = (+CFG.wheelPan) !== (e.shiftKey ? 1 : 0);
  if(move){
    const k = .012 * cam.dist;      // 引いているときほど大きく動かす
    const ax = window.innerWidth / 2, ay = window.innerHeight / 2;
    panBy(ax, ay, ax - (e.deltaX || 0) * k, ay - e.deltaY * k);
  } else {
    zoomTo(cam.dist + e.deltaY * .012, e.clientX, e.clientY);
  }
  e.preventDefault();
}

/* 引いた画面では印が半径5〜7pxにしかならず、指では狙えない。
   直接当たらなかったときは、画面上でいちばん近い印へ寄せる。
   街道と船は点ではなく辺なので、線分までの距離で測る（線の上ならどこでもよい） */
const TAP_MAX = () => (matchMedia('(pointer: coarse)').matches ? 46 : 24);
function screenPosOf(obj){
  return projectXY(obj.getWorldPosition(new THREE.Vector3()));
}
function projectXY(v){
  const p = v.clone().project(camera);
  if(p.z > 1) return null;                       // カメラの後ろ
  return {x: (p.x * .5 + .5) * window.innerWidth,
          y: (-p.y * .5 + .5) * window.innerHeight};
}
// 線分までの距離。両端は隣の辺と取り合いになるので少し内側だけを見る
function segDist(a, b, cx, cy){
  const dx = b.x - a.x, dy = b.y - a.y;
  const L2 = dx * dx + dy * dy;
  let t = L2 ? ((cx - a.x) * dx + (cy - a.y) * dy) / L2 : 0;
  t = Math.max(.16, Math.min(.84, t));
  return Math.hypot(a.x + dx * t - cx, a.y + dy * t - cy);
}
let lastPickAt = 0;
function pickOnce(d){
  const now = Date.now();
  if(now - lastPickAt < 400) return;       // 1回のタップで続けて置かれるのを防ぐ
  lastPickAt = now;
  if(NET.on){ netPick(d); return; }
  handlePick(d);
}
function tryPick(cx, cy){
  if(!pickables.length || G.busy) return;
  pointer.x = (cx / window.innerWidth) * 2 - 1;
  pointer.y = -(cy / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(pickables, false)[0];
  if(hit){ pickOnce(hit.object.userData); return; }

  let best = null, bestD = TAP_MAX();
  for(const o of pickables){
    const u = o.userData;
    let d;
    if(u.seg){
      const a = projectXY(u.seg[0]), b = projectXY(u.seg[1]);
      if(!a || !b) continue;
      d = segDist(a, b, cx, cy);
    }else{
      const s = screenPosOf(o);
      if(!s) continue;
      d = Math.hypot(s.x - cx, s.y - cy);
    }
    if(d < bestD){ bestD = d; best = o; }
  }
  if(best) pickOnce(best.userData);
}

async function handlePick(d){
  const pid = G.turn;
  if(G.busy) return;
  G.busy = true;
  try{
    if(G.explore){ await handlePickX(d, pid); return; }
    if(G.seaSc && await sea8HandlePick(d, pid)) return;
    if(G.mode === 'robber' && d.kind === 'hex'){ await moveRobber(d.id, pid); return; }
    if(G.mode === 'pirate' && d.kind === 'pirateHex'){ await movePirate(d.id, pid); return; }
    // 船を選ぶ → 置き先を選ぶ。選んだだけでは手は確定しない
    if(G.mode === 'shipPick' && d.kind === 'shipFrom'){
      G.shipFrom = d.id;
      G.mode = 'shipMove';
      render();
      showHint('動かす先を選ぶ（もう一度ボタンでやめる）');
      return;
    }
    if(G.mode === 'shipMove' && d.kind === 'shipTo'){
      moveShip(G.shipFrom, d.id, pid);
      G.shipFrom = null;
      G.mode = null;
      if(G.phase !== 'over') render();
      return;
    }
    if(G.mode === 'settlement' && d.kind === 'vertex'){
      if(isSetup()){
        placeSettlement(d.id, pid);
        G.lastSettlement = d.id;
        if(G.setupStep >= setupGrantFrom()) grantInitialResources(d.id, pid);
        G.setupNeeds = 'road';
        G.mode = 'road';
        render();
        showHint('つながる街道を1本置く');
      } else {
        placeSettlement(d.id, pid);
        G.mode = null;
        if(G.phase !== 'over') render();
      }
      return;
    }
    if(G.mode === 'city' && d.kind === 'vertex'){
      placeCity(d.id, pid);
      G.mode = null;
      if(G.phase !== 'over') render();
      return;
    }
    if(G.mode === 'road' && d.kind === 'edge'){
      placeRoad(d.id, pid);
      if(isSetup()){ G.mode = null; render(); await wait(450); await advanceSetup(); }
      else if(G.freeRoads > 0 && freeRouteSpots(pid).length){
        render();                    // 街道建設カードの残り分を続けて置く
        showHint(`あと${G.freeRoads}本、無償で敷ける`);
      } else { G.mode = null; render(); }
      return;
    }
    if(G.mode === 'ship' && d.kind === 'edge'){
      placeShip(d.id, pid);
      if(isSetup()){ G.mode = null; render(); await wait(450); await advanceSetup(); }
      else if(G.freeRoads > 0 && freeRouteSpots(pid).length){
        render();
        showHint(`あと${G.freeRoads}本、無償で伸ばせる`);
      } else { G.mode = null; render(); }
      return;
    }
  } finally {
    G.busy = false;
    if(G.phase !== 'over') render();
  }
}

let prevT = 0;
function animate(t){
  requestAnimationFrame(animate);
  t = t || 0;
  const dt2 = Math.max(0, (t - prevT) / 1000); prevT = t;
  // トゥイーンを進める
  for(let i = tweens.length - 1; i >= 0; i--){
    const tw = tweens[i];
    tw.t += Math.min(dt2, .05);
    const k = Math.min(1, tw.t / tw.dur);
    tw.update(tw.ease(k));
    if(k >= 1){ tweens.splice(i, 1); tw.done && tw.done(); }
  }
  // マーカーの明滅
  pickGroup.children.forEach((m, i) => {
    if(m.material) m.material.opacity = .78 + Math.sin(t / 320 + i) * .18;
  });
  // 海面：頂点は触らず、さざ波のテクスチャをずらすだけで動きを出す
  if(ripple){
    const o = ripple.material.map.offset;
    o.x = (t * .0000105) % 1;
    o.y = (t * .0000072) % 1;
  }
  // 小舟を波で揺らす
  for(let i = 0; i < bobbers.length; i++){
    const b = bobbers[i];
    b.obj.position.y = b.y + Math.sin(t / 880 + b.ph) * .05;
    b.obj.rotation.z = Math.sin(t / 1150 + b.ph) * .07;
  }
  renderer.render(scene, camera);
}

// 席の割り当て。人数に応じて四隅に散らし、席は途中で入れ替わらない
const SEATS = {
  2: ['bl', 'tr'],
  3: ['bl', 'tl', 'tr'],
  4: ['bl', 'tl', 'tr', 'br']
};
function seatOf(pid){
  const s = SEATS[G.players.length] || SEATS[4];
  // ネット対戦では自分の席を左下にして、順番の並びはそのまま回す
  if(NET.on && NET.pid !== null) pid = (pid - NET.pid + G.players.length) % G.players.length;
  return s[pid] || 'bl';
}

function phaseText(){
  const p = G.players[G.turn];
  if(G.phase === 'over') return '決着';
  if(G.phase === 'order') return `順番決め — ${p.name}が振る`;
  if(G.explore){ const t = phaseTextX(p); if(t) return t; }
  if(isSetup()){
    const n = G.setupStep + 1;
    return `開拓の準備 ${n}/${G.setupQueue.length} — ${p.name}が` + (G.setupNeeds === 'settlement' ? '開拓地を置く' : '街道を置く');
  }
  if(G.phase === 'roll') return `${p.name}の番 — サイコロを振る`;
  if(G.seaSc){ const t = sea8PhaseText(p); if(t) return t; }
  if(G.phase === 'robber') return `${p.name}が盗賊を動かす`;
  return `${p.name}の番 — 建設・交易`;
}

function costLabel(kind){
  return Object.entries(COST[kind]).map(([r, n]) => RES_ICON[r] + n).join(' ');
}

  $('phase').textContent = phaseText();
  $('d1').textContent = G.dice[0] ?? '-';
  $('d2').textContent = G.dice[1] ?? '-';

  recalcVP();
  ['tl','tr','bl','br'].forEach(k => {
    const el = $('seat-' + k);
    el.className = 'seat';
    el.innerHTML = '';
  });

      `<div class="row1">
         <span class="swatch" style="background:${p.css}"></span>

       </div>
       <div class="row2">
         <span>手札 ${RES.reduce((n, r) => n + p.res[r], 0)}</span>
         ${G.explore ? `<span>${RES_ICON.gold}${p.gold}</span>` : ''}
         ${G.explore ? missionBadges(p) : ''}
         ${G.seaSc ? sea8Badges(p) : ''}
         ${tags.join('')}
       </div>`;
    el.className = 'seat on' + (p.id === G.turn && G.phase !== 'over' ? ' turn' : '');
  });
  applyFlyMarks();       // 受け渡し中の縁取りを貼り直す

  // 手札は見ている人のもの（ネット対戦では自分の席、それ以外は操作中の人）
  const me = G.players[viewPid()];
  $('hand').innerHTML = G.hidden
    ? `<div class="masked">手札は伏せています</div>`
    : RES.map(r => `
    <div class="res" data-res="${r}">
      <span class="ico">${RES_ICON[r]}</span>
      <span class="nm">${RES_JA[r]}</span>
      <span class="ct">${me.res[r]}</span>
    </div>`).join('') + (G.explore ? `
    <div class="res" data-res="gold">
      <span class="ico">${RES_ICON.gold}</span>
      <span class="nm">${RES_JA.gold}</span>
      <span class="ct">${me.gold}</span>

// 下段の席が操作パネルに隠れないよう、パネルの高さぶん持ち上げる
function layoutSeats(){
  const root = document.documentElement.style;
  const b = $('bottom');
  if(b) root.setProperty('--seatBottom', Math.round(b.getBoundingClientRect().height + 14) + 'px');
  /* ログ行と上段の席は、トップバーの実寸の下から積む。
     計算式で組むと枠線や字体のぶんが合わず、状態によって数pxめり込む */
  const t = $('topbar');
  if(t) root.setProperty('--barTop', Math.round(t.getBoundingClientRect().bottom + 6) + 'px');
}

function renderActions(){
  const box = $('actions');
  const cur = G.players[G.turn];
  const myTurn = cur && !cur.cpu && G.phase !== 'over';
  const me = cur || G.players[0];
  box.innerHTML = '';

  const btn = (label, cost, on, opts = {}) => {
    const b = document.createElement('button');
    b.innerHTML = `<span>${label}</span>` + (cost ? `<span class="cost">${cost}</span>` : '');
    if(opts.primary) b.className = 'primary';
    if(opts.active) b.classList.add('active');
    b.disabled = !!opts.disabled;
    b.onclick = on;
    box.appendChild(b);
    return b;
  };

  if(!myTurn || G.busy){
    btn(G.busy && myTurn ? '進行中…' : '相手の手番', '', () => {}, {disabled:true});
    return;
  }
  if(G.explore){ renderActionsX(btn, me); return; }

  if(isSetup()){
    if(G.setupNeeds === 'settlement'){
      btn('開拓地を置く', '', () => { G.mode = 'settlement'; render(); showHint('光る地点から選ぶ'); },
          {primary:true, active:G.mode === 'settlement'});
    } else {
      // 海岸の開拓地からは、街道の代わりに船を出してもよい（T-3）
      btn('街道を置く', '', () => { G.mode = 'road'; render(); showHint('開拓地につながる辺を選ぶ'); },
          {primary:G.mode !== 'ship', active:G.mode === 'road',
           disabled:!validRoadSpots(me.id).length});
      if(hasSea()) btn('船を置く', '', () => { G.mode = 'ship'; render(); showHint('開拓地につながる海の辺を選ぶ'); },
          {primary:G.mode === 'ship', active:G.mode === 'ship',
           disabled:!validShipSpots(me.id).length});
    }
    return;
  }

  if(G.phase === 'roll'){
    if(me.dev.some(c => !c.fresh && c.type !== 'vp') && !me.devPlayed)
      btn('発展カードを使う', '振る前でも可', () => openDev());
    btn('サイコロを振る', '', async () => {
      if(G.busy) return;
      G.busy = true; render();
      try{ await rollDice(); }
      finally{ G.busy = false; if(G.phase !== 'over') render(); }
    }, {primary:true});
    return;
  }

  if(G.seaSc && sea8PhaseButtons(btn, me)) return;
  // 7が出たとき／騎士を使ったときは、盗賊か海賊のどちらか一方を動かす（P-1）
  if(G.phase === 'robber'){
    btn('盗賊を動かす', hasSea() ? '陸のタイル' : '', () => { G.mode = 'robber'; render(); showHint('移動先の陸のタイルを選ぶ'); },
        {primary:G.mode !== 'pirate', active:G.mode === 'robber'});
    if(pirateOn()) btn('海賊を動かす', '海のタイル', () => { G.mode = 'pirate'; render(); showHint('移動先の海のタイルを選ぶ'); },
        {primary:G.mode === 'pirate', active:G.mode === 'pirate',
         disabled:!G.hexes.some(h => !h.land && !h.pirate) || (G.seaSc && !sea8PirateAllowed(G.turn))});
    return;
  }

  const canRoad = canAfford(me, 'road') && me.stock.road > 0 && validRoadSpots(G.turn).length > 0;
  const canSet  = canAfford(me, 'settlement') && me.stock.settlement > 0 && validSettlementSpots(G.turn).length > 0;
  const canCity = canAfford(me, 'city') && me.stock.city > 0 && validCitySpots(G.turn).length > 0;

  const canShip = canAfford(me, 'ship') && me.stock.ship > 0 && validShipSpots(G.turn).length > 0;
  const movable = movableShips(G.turn);

  btn(`街道 ${me.stock.road}/${STOCK.road}`, costLabel('road'), () => { G.mode = G.mode === 'road' ? null : 'road'; render(); },
      {disabled:!canRoad, active:G.mode === 'road'});
  if(hasSea()) btn(`船 ${me.stock.ship}/${STOCK.ship}`, costLabel('ship'), () => { G.mode = G.mode === 'ship' ? null : 'ship'; render(); },
      {disabled:!canShip, active:G.mode === 'ship'});
  // 開いた船を1隻だけ動かせる（S-5）。選び直せるよう、押すたびに切り替える
  if(hasSea()) btn('船を動かす', movable.length ? `${movable.length}隻` : '動かせる船なし', () => {
    if(G.mode === 'shipPick' || G.mode === 'shipMove'){ G.mode = null; G.shipFrom = null; }
    else { G.mode = 'shipPick'; G.shipFrom = null; showHint('動かす船を選ぶ'); }
    render();
  }, {disabled:!movable.length, active:G.mode === 'shipPick' || G.mode === 'shipMove'});
  btn(`開拓地 ${me.stock.settlement}/${STOCK.settlement}`, costLabel('settlement'), () => { G.mode = G.mode === 'settlement' ? null : 'settlement'; render(); },
      {disabled:!canSet, active:G.mode === 'settlement'});
  btn(`都市 ${me.stock.city}/${STOCK.city}`, costLabel('city'), () => { G.mode = G.mode === 'city' ? null : 'city'; render(); },
      {disabled:!canCity, active:G.mode === 'city'});
  const devLabel = Object.entries(DEV_COST).map(([r, n]) => RES_ICON[r] + n).join(' ');
  btn('発展カードを買う', devLabel, () => {
    if(G.busy) return;
    buyDev(me); render(); openDev();
  }, {disabled: !canBuyDev(me)});
  btn(`発展カード（${me.dev.length}）`, '', () => openDev(),
      {disabled: me.dev.length === 0});
  if(G.seaSc) sea8Buttons(btn, me);
  btn('交易所', '', () => openTrade());
  if(G.players.length > 1) btn('開拓者と交渉', '', () => openNego());
  btn('手番を終える', '', async () => {
    if(G.busy) return;
    G.mode = null; G.busy = true; render();
    try{ await endTurn(); }
    finally{ G.busy = false; if(G.phase !== 'over') render(); }
  }, {primary:true});
}

  el.querySelector('.who span').textContent = p.name;       // 名前は入力できるので直に入れない
  el.querySelector('.ds').textContent = detail || DEV_DESC[type] || '';
  layer.appendChild(el);

  const a = anchorPoint(p.id);
  const cx = window.innerWidth / 2, cy = window.innerHeight * .40;
  const put = (x, y, s, rot, op) => {
    el.style.transform =
      `translate(-50%,-50%) translate(${Math.round(x)}px,${Math.round(y)}px) scale(${s}) rotateY(${rot}deg)`;
    el.style.opacity = op;
  };
  // 出発点は遷移なしで置く。ここで transition が効くと、
  // 変形なしの位置から出発点へ向かう動きが挟まって席から出てこない
  el.style.transitionProperty = 'none';
  put(a.x, a.y, .2, -70, 0);
  void el.offsetWidth;
  el.style.transitionProperty = 'transform, opacity';
  const IN = 420, HOLD = 950, OUT = 280;
  el.style.transitionDuration = Math.round(IN * FX.mult) + 'ms';
  put(cx, cy, 1, 0, 1);
  await wait(IN + HOLD);
  el.style.transitionDuration = Math.round(OUT * FX.mult) + 'ms';
  put(cx, cy - 28, 1.06, 0, 0);
  await wait(OUT);
  el.remove();
}

// 3D上の座標を画面上の位置に変換する
function worldToScreen(x, y, z){
  const v = new THREE.Vector3(x, y, z).project(camera);
  return {
    x: (v.x * .5 + .5) * window.innerWidth,
    y: (-v.y * .5 + .5) * window.innerHeight
  };
}

// 資源の出入り口の画面上の位置。誰の分でも席カードに出入りさせて、
// 「どの席からどの席へ動いたか」を同じ見え方でそろえる（自分も左下の枠）
function anchorEl(who){
  if(who === 'bank') return $('topbar');
  return $('seat-' + seatOf(who));
}
function anchorPoint(who){
  const el = anchorEl(who);
  if(!el) return {x: window.innerWidth / 2, y: window.innerHeight / 2};
  const r = el.getBoundingClientRect();
  return {x: r.left + r.width / 2, y: r.top + r.height / 2};
}
function receiverPoint(pid){ return anchorPoint(pid); }

// 受け渡しの間だけ、出し手と受け手の枠を縁取って示す。
// render() は席カードの class を作り直すので、印は別に持って貼り直す
const flyMarks = {};
function markSeats(from, to, on){
  [[from, 'give'], [to, 'take']].forEach(([who, cls]) => {
    const el = anchorEl(who);
    if(!el) return;
    const m = flyMarks[el.id] || (flyMarks[el.id] = {});
    if(on) m[cls] = true; else delete m[cls];
    if(!Object.keys(m).length) delete flyMarks[el.id];
    el.classList.toggle(cls, on);
  });
}
function applyFlyMarks(){
  Object.keys(flyMarks).forEach(id => {
    const el = $(id);
    if(el) Object.keys(flyMarks[id]).forEach(c => el.classList.add(c));
  });
}

// 資源が席から席へ飛ぶ。moves = [{res, n, from, to}]（from/to は pid か 'bank'）
let lastFly = Promise.resolve();
function flyBetween(moves){
  moves = (moves || []).filter(m => m.n > 0);
  if(!FX.anim || !moves.length) return (lastFly = Promise.resolve());
  const layer = $('flyLayer');
  const RISE = 380, FALL = 320, STEP = 110;
  let idx = 0, last = 0;
  const marked = [];
  moves.forEach(m => {
    for(let k = 0; k < m.n; k++){
      const delay = idx++ * STEP;
      last = Math.max(last, delay + RISE + FALL);
      setTimeout(() => {
        const a = anchorPoint(m.from), b = anchorPoint(m.to);
        const midX = (a.x + b.x) / 2;
        const midY = Math.min(a.y, b.y) - Math.max(60, Math.abs(b.x - a.x) * .18);
        const el = document.createElement('span');
        el.className = 'fly';
        el.textContent = RES_ICON[m.res];
        el.style.left = a.x + 'px';
        el.style.top = a.y + 'px';
        el.style.transitionDuration = '0ms';
        el.style.transform = 'translate(-50%,-50%) scale(.5)';
        el.style.opacity = '0';
        layer.appendChild(el);
        // 山なりに見せるため、頂点をはさんで2段階で動かす
        requestAnimationFrame(() => requestAnimationFrame(() => {
          el.style.transitionTimingFunction = 'cubic-bezier(.2,.7,.5,1)';
          el.style.transitionDuration = Math.round(RISE * FX.mult) + 'ms';
          el.style.transform =
            `translate(${midX - a.x}px, ${midY - a.y}px) translate(-50%,-50%) scale(1.1)`;
          el.style.opacity = '1';
        }));
        setTimeout(() => {
          el.style.transitionTimingFunction = 'cubic-bezier(.5,0,.8,.4)';
          el.style.transitionDuration = Math.round(FALL * FX.mult) + 'ms';
          el.style.transform =
            `translate(${b.x - a.x}px, ${b.y - a.y}px) translate(-50%,-50%) scale(.72)`;
          el.style.opacity = '.15';
        }, Math.round(RISE * FX.mult));
        setTimeout(() => el.remove(), Math.round((RISE + FALL) * FX.mult) + 160);
      }, Math.round(delay * FX.mult));
    }
    const key = m.from + '>' + m.to;
    if(!marked.includes(key)){ marked.push(key); markSeats(m.from, m.to, true); }
  });
  lastFly = wait(last + 220).then(() => {
    marked.forEach(k => { const [f, t] = k.split('>');
      markSeats(f === 'bank' ? 'bank' : +f, t === 'bank' ? 'bank' : +t, false); });
  });
  return lastFly;
}

// 手持ちの束（{res:n}）をそのまま受け渡しの演出にする
const bundleMoves = (bundle, from, to) =>
  Object.entries(bundle || {}).filter(([, n]) => n > 0).map(([res, n]) => ({res, n, from, to}));

// 産出タイルから受け取り手へ資源が飛ぶ
// 産出したタイルの上でいったん資源が浮かび、そこから受け取り手へ飛んでいく
function flyResources(moves){
  if(!FX.anim || !moves.length) return Promise.resolve();
  const layer = $('flyLayer');

  // 同じタイルから出るものはまとめて浮かせる
  const byHex = new Map();
  moves.forEach(m => {
    if(!byHex.has(m.hex)) byHex.set(m.hex, []);
    for(let k = 0; k < m.n; k++) byHex.get(m.hex).push(m);
  });

  const RISE = 380, HOLD = 420, FLY = 780;   // 浮かぶ→ためる→飛ぶ
  let last = 0;

  [...byHex.entries()].forEach(([hex, list], hi) => {
    const h = G.hexes[hex];
    const from = worldToScreen(h.x, .5, h.z);
    const startAt = hi * 260;
    last = Math.max(last, startAt + RISE + HOLD + FLY);

    setTimeout(() => {
      const els = list.map((m, i) => {
        // 複数枚は横に少しずらして並べる
        const spread = (i - (list.length - 1) / 2) * 26;
        const el = document.createElement('span');
        el.className = 'fly';
        el.textContent = RES_ICON[m.res];
        el.style.left = from.x + 'px';
        el.style.top = from.y + 'px';
        el.style.transitionDuration = Math.round(RISE * FX.mult) + 'ms';
        el.style.transform = `translate(${spread}px, 6px) translate(-50%,-50%) scale(.35)`;
        el.style.opacity = '0';
        layer.appendChild(el);
        return {el, m, spread};
      });

      // 1段階目：タイルの上に浮かび上がる
      requestAnimationFrame(() => requestAnimationFrame(() => {
        els.forEach(({el, spread}) => {
          el.style.transform = `translate(${spread}px, -34px) translate(-50%,-50%) scale(1.15)`;
          el.style.opacity = '1';
        });
      }));

      // 2段階目：それぞれの受け取り手へ飛ぶ
      setTimeout(() => {
        els.forEach(({el, m, spread}, i) => {
          setTimeout(() => {
            const to = receiverPoint(m.pid, m.res);
            el.style.transitionDuration = Math.round(FLY * FX.mult) + 'ms';
            el.style.transform =
              `translate(${to.x - from.x}px, ${to.y - from.y}px) translate(-50%,-50%) scale(.75)`;
            el.style.opacity = '0.12';
            setTimeout(() => el.remove(), Math.round(FLY * FX.mult) + 120);
          }, Math.round(i * 110 * FX.mult));
        });
      }, Math.round((RISE + HOLD) * FX.mult));
    }, Math.round(startAt * FX.mult));
  });

  return wait(last + 200);
}

// 資源を選ばせる（収穫は2枚、独占は1種）
function pickResources(title, text, count, filter){
  return new Promise(resolve => {
    const picks = [];
    const draw = () => {
      $('pickRes').innerHTML = '';
      RES.forEach(r => {
        if(filter && !filter(r)) return;
        const n = picks.filter(x => x === r).length;
        const b = document.createElement('button');
        b.textContent = `${RES_ICON[r]} ${RES_JA[r]}` + (n ? ` ×${n}` : '');
        if(n) b.classList.add('on');
        /* 押すたびに 選ぶ → （まだ枠があれば）もう1枚 → 外す と巡る。
           選んだ札をもう一度押せば外せる。同じ資源を2枚取ることもできる */
        b.onclick = () => {
          if(n && (picks.length >= count || n >= count)){
            for(let i = picks.length - 1; i >= 0; i--) if(picks[i] === r) picks.splice(i, 1);
          } else if(picks.length < count){
            picks.push(r);
          } else {
            for(let i = picks.length - 1; i >= 0; i--) if(picks[i] === r) picks.splice(i, 1);
          }
          draw();
        };
        $('pickRes').appendChild(b);
      });
      $('pickSum').textContent = picks.length
        ? '選択：' + picks.map(r => RES_JA[r]).join('・') + '（選んだ札をもう一度押すと外せる）'
        : `${count}枚選ぶ`;
      $('pickOk').disabled = picks.length !== count;
    };
    const close = v => {
      $('pickModal').classList.remove('show');
      $('pickOk').onclick = null; $('pickCancel').onclick = null;
      resolve(v);
    };
    $('pickTitle').textContent = title;
    $('pickText').textContent = text;
    draw();
    $('pickOk').onclick = () => close(picks.slice());
    $('pickCancel').onclick = () => { picks.length = 0; draw(); close(null); };
    $('pickModal').classList.add('show');
  });
}

async function useDev(p, type){
  const card = p.dev.find(c => c.type === type && !c.fresh);
  if(!card || p.devPlayed) return;
  $('devModal').classList.remove('show');
  const prevBusy = G.busy;
  G.busy = true; render();
  try{
    if(type === 'knight' && G.seaSc === 'pirates'){
      // 海賊の島：騎士は航路の船を戦艦にするためだけに使う
      if(pirWarshipTarget(p) === null){ showHint('戦艦にできる航路の船がない'); return; }
      removeDev(p, card);
      p.devPlayed = true;
      await pirMakeWarship(p);
      return;
    }
    if(type === 'knight'){
      removeDev(p, card);
      await playKnight(p);
      G.robberReturn = G.phase;      // 振る前に使った場合は振る前に戻す
      G.phase = 'robber';
      G.mode = pirateOn() ? null : 'robber';
      G.busy = prevBusy;
      render();
      showHint(pirateOn() ? '盗賊か海賊、どちらかを動かす' : '盗賊を動かすタイルを選ぶ');
      return;                       // 続きは盤面のクリックで進む
    }
    if(type === 'road'){
      const spots = validRoadSpots(p.id);
      if(!spots.length || p.stock.road === 0){ showHint('敷ける街道がない'); return; }
      removeDev(p, card);
      p.devPlayed = true;
      G.freeRoads = Math.min(2, p.stock.road);
      log(`${p.name}が街道建設を使った`);
      await showDevPlay(p, 'road', `街道を${G.freeRoads}本、無償で敷く`);
      G.mode = 'road';
      G.busy = prevBusy;
      render();
      showHint(`街道を${G.freeRoads}本、無償で敷ける`);
      return;
    }
    if(type === 'plenty'){
      const picks = await pickResources('収穫', '交易所から受け取る資源を2枚選ぶ。', 2,
                                        r => G.bank[r] > 0);
      if(!picks){ return; }
      removeDev(p, card);
      p.devPlayed = true;
      await showDevPlay(p, 'plenty', plentyText(picks));
      applyPlenty(p, picks);
      showGain(picks.reduce((o, r) => (o[r] = (o[r] || 0) + 1, o), {}));
      await lastFly;
    }
    if(type === 'monopoly'){
      const picks = await pickResources('独占', '全員の手札から集める資源を1種選ぶ。', 1);
      if(!picks){ return; }
      removeDev(p, card);
      p.devPlayed = true;
      await showDevPlay(p, 'monopoly', monopolyText(picks[0]));
      const got = applyMonopoly(p, picks[0]);
      if(got) showGain({[picks[0]]: got});
      await lastFly;
    }
  } finally {
    recalcVP();
    G.busy = prevBusy;
    if(G.phase !== 'over') render();
    checkWin();
  }
}

/* --- 交渉（開拓者どうし） --- */
const NEGO = {give:{}, get:{}, to:null};

// 条件の返し合いで交渉画面が入れ子になるため、待ち合わせは積み重ねて持つ
const negoStack = [];
function finishNego(v){
  const r = negoStack.pop();
  if(r) r(v);
}
function openNego(prefill){
  RES.forEach(r => { NEGO.give[r] = 0; NEGO.get[r] = 0; });
  const others = G.players.filter(p => p.id !== activeHuman());
  // こちらから持ちかけるときは常に全員へ問う（相手選びは不要）
  NEGO.to = others.length > 1 ? 'all' : others[0].id;
  NEGO.depth = 0;
  if(prefill && typeof prefill === 'object' && prefill.give && prefill.get){
    NEGO.to = prefill.to;
    NEGO.depth = prefill.depth || 0;
    RES.forEach(r => {
      NEGO.give[r] = Math.min(G.players[activeHuman()].res[r], prefill.give[r] || 0);
      NEGO.get[r]  = prefill.get[r] || 0;
    });
  }
  renderNego();
  $('negoModal').classList.add('show');
  return new Promise(r => { negoStack.push(r); });
}
function closeNego(){
  $('negoModal').classList.remove('show');
  finishNego(false);
}

function renderNego(){
  const meId = activeHuman();
  const me = G.players[meId];
  const others = G.players.filter(p => p.id !== meId);
  const to = $('negoTo');
  to.innerHTML = '';
  // 相手を選ぶのは「条件を返す」ときだけ。持ちかけるときは全員に問う
  const pickTarget = (NEGO.depth || 0) > 0;
  to.style.display = pickTarget ? '' : 'none';
  if(pickTarget)
  // 盤面と同じ 左上/右上/左下/右下 の並びで置く
  ['tl','tr','bl','br'].forEach(k => {
    const p = G.players.find(x => seatOf(x.id) === k);
    if(!p){
      const d = document.createElement('div');
      d.className = 'empty';
      to.appendChild(d);
      return;
    }
    const b = document.createElement('button');
    b.innerHTML = `<span class="sw" style="background:${p.css}"></span>` +
                  `<span class="who" style="color:${p.css}">${p.name}</span>`;
    if(p.id === meId){
      b.classList.add('self');
      b.disabled = true;
      b.querySelector('.who').textContent = p.name + '（自分）';
    } else {
      if(NEGO.to === p.id){ b.classList.add('on'); b.style.borderLeftColor = p.css; }
      b.onclick = () => { NEGO.to = p.id; renderNego(); };
    }
    to.appendChild(b);
  });
  if(others.length <= 1 && NEGO.to === 'all') NEGO.to = others[0].id;
  const target = NEGO.to === 'all' ? null : G.players[NEGO.to];

  const step = (kind, r, max) => `
    <div class="stepper">
      <button data-k="${kind}" data-r="${r}" data-d="-1">−</button>
      <span>${NEGO[kind][r]}</span>
      <button data-k="${kind}" data-r="${r}" data-d="1" ${NEGO[kind][r] >= max ? 'disabled' : ''}>＋</button>
    </div>`;

  $('negoTable').innerHTML =
    `<tr><th></th><th>渡す</th><th>もらう</th></tr>` +
    RES.map(r => `<tr>
      <td class="rname">${RES_ICON[r]} ${RES_JA[r]}</td>
      <td>${step('give', r, me.res[r])}</td>
      <td>${step('get', r, 4)}</td>
    </tr>`).join('');

  $('negoTable').querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      const k = b.dataset.k, r = b.dataset.r, d = +b.dataset.d;
      const max = k === 'give' ? me.res[r] : 4;
      NEGO[k][r] = Math.max(0, Math.min(max, NEGO[k][r] + d));
      renderNego();
    };
  });

  const g = bundleText(NEGO.give), t = bundleText(NEGO.get);
  const toName = target ? `<span style="color:${target.css}">${target.name}</span>` : '全員';
  $('negoSummary').innerHTML =
    (g === 'なし' && t === 'なし') ? '渡す資源ともらう資源を選ぶ'
      : `${toName}へ ${g} を渡し、${t} をもらう`;
  $('doNego').textContent = (NEGO.depth || 0) > 0 ? '条件を返す' : '持ちかける';
  document.querySelector('#negoModal h2').textContent =
    (NEGO.depth || 0) > 0 ? '条件を返す' : '開拓者との交渉';
}

// 全員に同じ条件を問い、返答を集める
async function askEveryone(me, give, get){
  const replies = [];
  for(const t of G.players){
    if(t.id === me.id) continue;
    if(t.cpu){
      if(!canPay(t, get)) replies.push({p:t, kind:'nohave'});
      else if(cpuAcceptsTrade(t, give, get, me)) replies.push({p:t, kind:'yes'});
      else {
        const c = cpuCounter(t, give, get, me);
        replies.push(c ? {p:t, kind:'counter', c} : {p:t, kind:'no'});
      }
    } else {
      // 人間には端末を回して個別に聞く
      await passDevice(t, `${me.name}からの提案です。端末を${t.name}に渡してください。`);
      const ans = await askHuman(me, give, get, null, false);
      await passDevice(me, `次の人に移ります。端末を${me.name}に戻してください。`);
      replies.push({p:t, kind: ans === 'yes' ? (canPay(t, get) ? 'yes' : 'nohave') : 'no'});
    }
  }
  return replies;
}

// 返答の一覧を出し、どれを成立させるか選んでもらう
function showReplies(me, give, get, replies){
  return new Promise(resolve => {
    const yes = replies.filter(r => r.kind === 'yes').length;
    const ctr = replies.filter(r => r.kind === 'counter').length;
    $('repliesNote').textContent =
      `${bundleText(give)} ↔ ${bundleText(get)} への返答。` +
      (yes || ctr ? '成立させたい相手を選ぶ。' : '応じる相手はいなかった。');
    const box = $('repliesList');
    box.innerHTML = '';
    replies.forEach(r => {
      const el = document.createElement('div');
      el.className = 'reply' + (r.kind === 'no' || r.kind === 'nohave' ? ' no' : '');
      const ans =
        r.kind === 'yes'     ? 'この条件で応じる'
      : r.kind === 'counter' ? `条件つき：${bundleText(r.c.gains)} を渡し、${bundleText(r.c.gives)} をもらう`
      : r.kind === 'nohave'  ? '求められた資源を持っていない'
      :                        '断る';
      el.innerHTML =
        `<div class="top">
           <span class="swatch" style="background:${r.p.css}"></span>
           <span class="nm" style="color:${r.p.css}">${r.p.name}</span>
         </div>
         <div class="ans">${ans}</div>`;
      if(r.kind === 'yes' || r.kind === 'counter'){
        const g2 = r.kind === 'yes' ? give : r.c.gains;
        const t2 = r.kind === 'yes' ? get  : r.c.gives;
        const b = document.createElement('button');
        const payable = canPay(me, g2);
        b.textContent = payable ? 'これで成立させる' : '手持ちが足りない';
        b.disabled = !payable;
        b.onclick = () => {
          $('repliesModal').classList.remove('show');
          $('closeReplies').onclick = null;
          resolve({p: r.p, give: g2, get: t2});
        };
        el.appendChild(b);
      }
      box.appendChild(el);
    });
    $('closeReplies').onclick = () => {
      $('repliesModal').classList.remove('show');
      $('closeReplies').onclick = null;
      resolve(null);
    };
    $('repliesModal').classList.add('show');
  });
}

// 断られたあと、同じ条件のまま別の相手に問い直せるよう画面を開き直す
function reopenSame(give, get, to){
  if(negoStack.length) return;          // 別の処理が結果を待っている最中は開かない
  // wait() を使う（ネット対戦で、全員の端末がこの画面を開き終えてから次の操作を受ける）
  wait(200).then(() => {
    if(G.phase === 'over' || G.busy) return;
    openNego({to, give, get, depth: 0});
    $('negoSummary').textContent = '同じ条件のまま、相手を変えて問い直せる';
  });
}

async function proposeNego(){
  const me = G.players[activeHuman()];
  const target = NEGO.to === 'all' ? null : G.players[NEGO.to];
  const give = {}, get = {};
  RES.forEach(r => { if(NEGO.give[r]) give[r] = NEGO.give[r]; if(NEGO.get[r]) get[r] = NEGO.get[r]; });
  if(!Object.keys(give).length || !Object.keys(get).length){
    $('negoSummary').textContent = '渡す資源ともらう資源を両方選ぶ';
    return;
  }
  if(!canPay(me, give)){ $('negoSummary').textContent = '手持ちが足りない'; return; }

  // 全員に問う場合
  if(!target){
    $('negoModal').classList.remove('show');
    const prevBusy2 = G.busy;
    G.busy = true; render();
    try{
      log(`${me.name}が全員に持ちかけた：${bundleText(give)} ↔ ${bundleText(get)}`);
      await banner('みんなが考えている…', 800);
      const replies = await askEveryone(me, give, get);
      const pick = await showReplies(me, give, get, replies);
      if(pick && canPay(me, pick.give) && canPay(pick.p, pick.get)){
        execTrade(me, pick.p, pick.give, pick.get);
        showGain(pick.get);
        await banner(`${pick.p.name}と成立した`, 900);
        finishNego(true);
      } else {
        if(pick) log('条件が合わず成立しなかった');
        finishNego(false);
      }
    } finally {
      G.busy = prevBusy2;
      if(G.phase !== 'over') render();
    }
    return;
  }

  $('negoModal').classList.remove('show');
  const prevBusy = G.busy;
  G.busy = true; render();
  const finish = finishNego;
  try{
    log(`${me.name}が${target.name}に持ちかけた：${bundleText(give)} ↔ ${bundleText(get)}`);

    // 相手が人間なら、端末を渡して本人に答えてもらう
    if(!target.cpu){
      await passDevice(target, `${me.name}からの提案です。端末を${target.name}に渡してください。`);
      const ans = await askHuman(me, give, get, null, false);
      await passDevice(me, `返答を伝えます。端末を${me.name}に戻してください。`);
      if(ans === 'yes' && canPay(target, get)){
        execTrade(me, target, give, get);
        showGain(get);
        await banner('交渉が成立した', 900);
        finish(true);
      } else {
        log(ans === 'yes' ? `${target.name}は求められた資源を持っていなかった`
                          : `${target.name}は断った`);
        await banner(ans === 'yes' ? `${target.name}は持っていない` : `${target.name}は断った`, 900);
        finish(false);
      }
      return;
    }

    await banner(`${target.name}が考えている…`, 800);
    const ok = cpuAcceptsTrade(target, give, get, me);
    if(!ok && !canPay(target, get)){
      log(`${target.name}は求められた資源を持っていなかった`);
      await banner(`${target.name}は持っていない`, 900);
      finish(false);
      reopenSame(give, get, target.id);
      return;
    }
    if(ok){
      execTrade(me, target, give, get);
      showGain(get);
      await banner(`${target.name}は応じた`, 900);
      finish(true);
      return;
    }
    // そのままでは飲めないが、条件次第なら応じられる案を返す
    const depth = NEGO.depth || 0;
    const counter = cpuCounter(target, give, get, me);
    if(counter){
      log(`${target.name}が条件を返した：${bundleText(counter.gains)} ↔ ${bundleText(counter.gives)}`);
      await banner(`${target.name}が条件を返した`, 700);
      const ans = await askHuman(target, counter.gives, counter.gains,
        'この条件なら応じる、という返答', depth < 2);
      if(ans === 'yes'){
        execTrade(me, target, counter.gains, counter.gives);
        showGain(counter.gives);
        await banner('交渉が成立した', 900);
        finish(true);
      } else if(ans === 'counter'){
        // こちらから条件を返し直す
        G.busy = prevBusy;
        const r = await openNego({to: target.id, give: counter.gains, get: counter.gives,
                                  depth: depth + 1});
        finish(r);
        return;
      } else {
        log('あなたは断った');
        finish(false);
      }
    } else {
      log(`${target.name}は断った`);
      await banner(`${target.name}は断った`, 900);
      finish(false);
      reopenSame(give, get, target.id);
    }
  } finally {
    G.busy = prevBusy;
    if(G.phase !== 'over') render();
  }
}

// CPUからの申し出に人間が答える
// 返答は「受ける」「条件を返す」「断る」の3択
function askHuman(from, gives, wants, note, allowCounter){
  return new Promise(resolve => {
    // 答える側が支払えない条件なら、受けるを選べないようにする
    const responder = G.players[activeHuman()];
    const payable = canPay(responder, wants);
    $('offerTitle').innerHTML =
      `<span style="color:${from.css}">${from.name}</span>` + (note ? 'の返答' : 'からの提案');
    $('offerText').innerHTML =
      (note ? note + '。' : '') +
      `<span style="color:${from.css}">${from.name}</span>は ` +
      `${bundleText(gives)} を渡す代わりに、${bundleText(wants)} を求めている。`;
    const cbtn = $('offerCounter');
    cbtn.style.display = allowCounter === false ? 'none' : '';
    const ybtn = $('offerYes');
    ybtn.disabled = !payable;
    ybtn.textContent = payable ? '受ける' : '受ける（手持ちが足りない）';
    const close = v => {
      $('offerModal').classList.remove('show');
      $('offerYes').onclick = null; $('offerNo').onclick = null; cbtn.onclick = null;
      resolve(v);
    };
    $('offerYes').onclick = () => close('yes');
    cbtn.onclick          = () => close('counter');
    $('offerNo').onclick  = () => close('no');
    $('offerModal').classList.add('show');
  });
}

/* --- 銀行との交易 --- */
const TRADE_PICK = {give:null, get:null};
function drawTradePicks(){
  if(G.explore) return drawTradePicksX();
  const me = G.players[activeHuman()];
  const row = (id, side) => {
    const box = $(id);
    box.innerHTML = '';
    RES.forEach(r => {
      const rate = tradeRate(me, r);
      const b = document.createElement('button');
      const short = side === 'give' ? `×${rate}` : '×1';
      b.innerHTML = `<span class="ic">${RES_ICON[r]}</span>` +
                    `<span class="nm">${RES_JA[r]}</span>` +
                    `<span class="ct">${short}</span>`;
      if(side === 'give') b.disabled = me.res[r] < rate;
      else b.disabled = G.bank[r] < 1 || r === TRADE_PICK.give;
      b.classList.toggle('on', TRADE_PICK[side] === r);
      b.onclick = () => {
        TRADE_PICK[side] = r;
        if(side === 'give' && TRADE_PICK.get === r) TRADE_PICK.get = null;
        drawTradePicks();
      };
      box.appendChild(b);
    });
  };
  row('giveRow', 'give');
  row('getRow', 'get');
  $('doTrade').disabled = !(TRADE_PICK.give && TRADE_PICK.get);
}
const TRADE_NOTE = document.querySelector('#tradeModal p').textContent;
function openTrade(){
  if(G.explore) return openTradeX();
  document.querySelector('#tradeModal p').textContent = TRADE_NOTE;
  $('giveRow').style.gridTemplateColumns = $('getRow').style.gridTemplateColumns = '';
  const me = G.players[activeHuman()];
  TRADE_PICK.give = RES.find(r => me.res[r] >= tradeRate(me, r)) || null;
  TRADE_PICK.get = null;
  drawTradePicks();
  $('tradeModal').classList.add('show');
}
function doTrade(){
  if(G.explore) return doTradeX();
  const me = G.players[activeHuman()];
  const g = TRADE_PICK.give, t = TRADE_PICK.get;
  if(!g || !t){ showHint('渡す資源と受け取る資源を選ぶ'); return; }
  const rate = tradeRate(me, g);
  if(g === t){ showHint('同じ資源とは交換できない'); return; }
  if(me.res[g] < rate){ showHint(`${RES_JA[g]}が${rate}枚必要`); return; }
  if(G.bank[t] < 1){ showHint(`交易所に${RES_JA[t]}が残っていない`); return; }
  sfx('trade');
  me.res[g] -= rate; G.bank[g] += rate;
  me.res[t]++;      G.bank[t]--;
  log(`あなたが${RES_JA[g]}${rate}枚を${RES_JA[t]}に交換した`);
  /* 続けて交換できるよう開いたままにする。閉じるのは「閉じる」だけ。
     払えなくなった資源が選ばれたままにならないよう、選択を直しておく  */
  if(me.res[g] < tradeRate(me, g))
    TRADE_PICK.give = RES.find(r => me.res[r] >= tradeRate(me, r)) || null;
  if(TRADE_PICK.give === TRADE_PICK.get) TRADE_PICK.get = null;
  render();
  drawTradePicks();
  flyBetween([{res:g, n:rate, from:me.id, to:'bank'}, {res:t, n:1, from:'bank', to:me.id}]);
}

const OPTS = {
